<script type="text/markdown" id="zhSrc"># 08 Swift-Image：探索紧凑统一图像生成模型的性能前沿（中文精读翻译）

## 论文信息

- **英文标题**：Exploring the Performance Frontier of Compact Unified Image Generation Models
- **中文标题**：Swift-Image：探索紧凑统一图像生成模型的性能前沿
- **作者**：Taihang Hu\*、Zhao Wang\*、Zuan Gao\*、Tao Liu\*、Hao Yan\*、Zhengze Xu\*、Yuhang Yu\*、Yongchao Du\*、Xingjian Wang\*、Jun Zheng\*、Qinye Zhou\*（\*同等贡献）、Yaqi Cai、Zhengrui Chen、Chao Lin、Yefeng Shen、Yuan Wang、Zhengtao Wu、Ge Wu、Xiaoli Xu、Denghui Yang、Huayu Zhang、Mingzhou Zhang、Mengting Chen†（†通讯作者）
- **机构**：论文首页未印机构行；作者团队来自阿里巴巴（Alibaba），与 CPI-Bench、Tstars-Tryon、ExpertVerse 等同期工作高度重合
- **arXiv 链接**：https://arxiv.org/abs/2608.20334（v2，2026-08-21，28 页 11 图）

**一句话核心总结**：Swift-Image 在受限算力下探索紧凑统一图像生成模型的性能上限：以 6B 单流并行 DiT 为骨干（Qwen3-VL-8B 编码语义条件、FLUX.2 AE 编码图像隐空间），通过"低分辨率 T2I 奠基预训练（500K 步）→ 持续预训练（200K 步）→ SFT（10K 步）"的渐进课程统一文生图与单图/多图编辑；后训练用 DiffusionNFT 并行专家 RL 加多教师在策略蒸馏（OPD）化解异构目标冲突，用 Prompt Enhancer 将高层推理与像素渲染解耦，再经结构剪枝（注意力头 32→24 得到 3B）与改进 DMD2 少步蒸馏（50→8 步）完成部署压缩。6B 模型仅耗约 243K GPU 小时即在五个编辑基准综合分上领先全部开源模型（Overall 4.41、全榜第三），3B 版几乎无损（4.40），Turbo 少步版综合编辑分反超多步 RL 教师（4.20 vs 4.16）。

---

## 摘要

本文提出 **Swift-Image**，一个紧凑的统一模型，同时支持文生图（text-to-image generation）、单图编辑与多图编辑。目标是探索：在受限计算预算下，一个相对较小的视觉生成器能通过系统性训练工程（training engineering）被推到多高。Swift-Image 采用高效的 6B 单流 DiT（Diffusion Transformer）与渐进式训练管线——从宽泛的语义覆盖逐步演进到更高分辨率、更强视觉质量与统一的生成-编辑监督。后训练阶段，先做并行专家强化学习（parallel expert reinforcement learning），再做多教师在策略蒸馏（multi-teacher on-policy distillation），以缓解异构目标间的干扰。作者进一步用提示词增强器（Prompt Enhancer, PE）将高层推理与像素级渲染解耦——它把用户请求翻译为与生成器对齐的视觉规范。为高效部署，结构剪枝（structural pruning）与少步蒸馏（few-step distillation）产出 3B 与加速版本。Swift-Image 仅以 6B 参数与 243K GPU 训练小时，在受评测开源模型中取得领先的聚合性能；压缩后的 3B 模型几乎无损，而少步蒸馏在大幅减少采样步数的同时甚至进一步提升聚合编辑性能。本文还总结了架构、数据课程、后训练、提示增强与模型压缩方面的实践经验。

---

## 1 引言

近年的图像生成模型在视觉保真度、文字渲染、指令遵循与基于参考图的编辑上取得了长足进步 [6, 9, 18, 21, 22, 38, 53]，但这些进步往往伴随越来越大的生成骨干 [9, 53]、昂贵的训练管线，以及生成与编辑分离的模型变体 [24, 43, 48]。这引出一个实际问题：

> **在受限计算预算下，紧凑图像模型的性能能被系统性训练工程推到多远？**

该问题尤其困难，因为统一模型须在一套权重内同时支持文生图、单图编辑与多图编辑：文生图要求宽泛的视觉-语义对齐，编辑额外要求精确利用视觉参考并保持与请求改动无关的内容不变；复杂用户请求还可能涉及文字渲染、组合推理、领域知识与布局规划。紧凑模型对这些相互竞争的需求尤其敏感——低效的架构选择、任务失衡或训练不稳定都会消耗其有限的容量与算力。许多相关技术在先前系统中已被探索：多模态条件编码器与混合/单流 DiT 已成为主流 [2, 6, 7, 9, 53, 57]；渐进式多阶段训练被用于向更高分辨率与质量扩展 [10, 67]；近期统一系统在紧密共享的架构内同时优化生成与编辑 [6, 8]；基于强化学习（RL）的后训练直接向下游奖励目标优化图像生成器 [29, 56, 69]；提示重写被用于将高层指令解释与底层生成器解耦 [19, 50]；少步分布蒸馏则降低部署成本 [28, 32, 59]。**本文不把这些组件单独视为创新，而是聚焦训练工程：如何把它们组织成一条连贯的管线，产出一个强紧凑模型。**实践中，这类系统的有效性不仅取决于单个组件的选择，还取决于它们在架构设计、预训练、后训练、提示处理与面向部署的压缩之间的相互作用。

**Swift-Image 概览**：其视觉渲染器是一个 6B 并行单流 DiT，以视觉-语言编码器的多模态表示为条件 [6, 7, 57]。架构采用块共享时间步调制（block-shared timestep modulation）、注意力与 MLP 并行计算 [6, 15]、4D 旋转位置编码（4D rotary positional encoding）[6]，以及文本与图像条件的统一表示。对需出现在生成图像中的文字采用字符级分词（character-level tokenization）[47]；多图位置偏移与"图像前置"的输入格式支持参考条件编辑。由此，一套生成骨干无需任务专用权重即可服务多种生成与编辑设定。

模型通过渐进式训练管线优化：先以低分辨率 T2I 数据建立宽泛的视觉-语义对应，随后按大规模图像生成的渐进分阶段原则，逐步引入更高分辨率、结构更复杂的内容与图像编辑监督。持续预训练（continual pre-training, CT）把模型推向更干净、更高分辨率的数据，再在精筛的小语料上做监督微调（SFT）。分辨率分桶（aspect-ratio bucketing）与任务路由序列打包（task-routed sequence packing）原生支持任意宽高比与不限长度提示词 [16]。此后用覆盖文本-图像对齐、视觉质量、美学、指令遵循、参考一致性、人脸身份与文字渲染的奖励信号做后训练 [29, 69]，并通过多教师在策略蒸馏将通用策略与任务专用策略整合为最终统一模型。

作者另用 **Prompt Enhancer（PE）** 将高层请求处理与像素级渲染分离：PE 将简短或复杂的用户请求翻译为更明确的视觉描述，DiT 专注于实现这些描述。PE 生成与编辑联合训练，并用文本级重写反馈与来自冻结渲染器的图像级反馈进一步优化。虽然 PE–DiT 解耦本身并不新 [50]，但它是本紧凑模型管线的实用组件：评测中 PE 在 3B 与 6B 模型上一致带来提升，在知识密集、组合式与布局敏感任务上增益尤其大。

面向高效部署，作者对 6B 渲染器做结构剪枝，经渐进恢复训练与知识蒸馏得到 3B 版本；再用分布匹配蒸馏（distribution matching distillation）减少采样步数 [28, 32]。这些过程产出一族在参数量、推理成本与生成质量间不同权衡的模型，且保持同一统一任务接口。

在覆盖文生图、通用图像编辑、单图/多图编辑、实际应用与知识密集视觉任务的基准上评测：6B 模型在受评测开源系统中取得领先聚合性能，压缩 3B 几乎无损；RL 在各编辑基准上带来大幅一致提升；少步蒸馏版本以少得多的步数取得更强综合性能。**主 6B 渲染器训练仅消耗约 243K GPU 小时**。这表明精心组装的训练配方无需数十亿级生成骨干也能产出强且通用的图像生成与编辑能力。

**主要贡献**：

1. **紧凑统一模型**：Swift-Image 模型族支持文生图、单图编辑与多图编辑。6B 模型仅用 243K GPU 训练小时即取得受评测开源系统中的领先聚合性能；3B 与少步版本以显著更低的部署成本几乎无损（图 1、2、3、4 与表 1、3）。
2. **系统性训练配方**：建立紧凑统一图像模型的端到端训练管线，覆盖能力导向的渐进训练、并行专家 RL、多教师 OPD、结构剪枝与少步蒸馏，在有限容量与算力下有效协调异构生成与编辑目标（图 5、6、8、9、10、7）。
3. **大规模训练的实践洞察**：通过大量消融与训练实验，总结出可迁移的经验——数据分布随模型能力演进、语义覆盖优先于偏好优化、冲突目标先专门化再整合、架构选择与生成可学习性/效率/稳定性对齐（附录 A）。

> **图 1（概述）**：参数量-综合编辑得分对比散点图。综合编辑得分为三个公开编辑基准与自有基准的平均；Swift-Image 仅以 6B/3B 参数取得领先性能。

## 2 相关工作

**2.1 统一图像生成与编辑**：近期系统日益走向带强多模态条件的统一生成与编辑。Qwen-Image [53]、Qwen-Image-2.0 [67]、JoyAI-Image [43] 以强 MLLM 作条件编码器改善指令理解、文字渲染与参考条件生成；Krea-2 [24]、Z-Image [7] 探索高效单流扩散 Transformer；HiDream-O1-Image [8] 等进一步走向实用的统一生成编辑；参考驱动编辑亦有领域系统（如可操纵的商用级虚拟试穿 [11, 12]）。但高性能开源模型往往依赖大骨干或生成/编辑分离的变体。Swift-Image 则专注用一个生成骨干同时支持三类任务、推高紧凑统一模型的性能前沿。

**2.2 扩散模型的 RL 与蒸馏**：Flow-GRPO [29]、DanceGRPO [56] 将 GRPO 式优化引入现代视觉生成器，DiffusionNFT [69] 借扩散前向过程做高效在线奖励优化。超越单策略 RL，DiffusionOPD [27] 独立优化任务专属教师再蒸馏进统一学生，DanceOPD [72] 将不同生成/编辑能力表述为专家生成场。推理加速方面有 DMD 系方法与 Decoupled-DMD [28]。Swift-Image 在此基础上以并行专家 RL + 多教师 OPD 缓解跨任务干扰，并以结构剪枝 + 分布匹配蒸馏实现紧凑与少步部署。

**2.3 提示增强与智能体视觉推理**：除常规提示重写 [50] 外，Gen-Searcher [19] 训练多模态智能体做多跳网络搜索、证据推理与视觉参考检索；Unify-Agent [13] 将世界接地的合成统一为提示理解-多模态证据搜索-接地重描述-生成；RS-Gen [5] 探索免训练智能体框架；ExpertVerse [52] 为知识密集推理合成建立基准。Swift-Image 走互补路线：PE 将意图解释、知识推理与布局规划内化为学习型重写器，DiT 专职精确渲染；PE 进一步用重写级与渲染图像级奖励联合优化，无需在线搜索或工具调用即可自适应推理。

---

## 3 方法

方法将意图理解与视觉实现分离，同时为 T2I 与单图/多图编辑（I2I）保留单一视觉骨干：Prompt Enhancer 在需要时先把用户请求转换为明确的视觉规范，统一多模态扩散模型再渲染该规范。视觉模型经渐进预训练与 SFT 学习，经并行专家 RL 专门化，经多教师 OPD 整合，最后为参数与采样高效部署而压缩。

> **图 5（架构）**：T2I 与图像编辑共用的统一视觉骨干。来自 Qwen3-VL 的语义条件与来自 FLUX.2 AE 的图像隐变量由并行单流 Transformer 块联合处理。输入序为 System Prompt、输入图像、用户提示、输入图像、目标图像；VLM 输出的图像 token 被丢弃（drop）。
>
> **图 6（总览）**：训练阶段为渐进预训练（3 阶段课程）→ 持续预训练 → SFT → 并行专家 RL → 多教师 OPD → 少步蒸馏；推理阶段 Prompt Enhancer 先做分解与重写，再经文本编码器送入统一 Pi-Image DiT。

### 3.1 统一多模态扩散骨干

**多模态条件化**。共享的 Qwen3-VL-8B 编码器 [57] 接收 System Prompt、零或多张输入图像与用户指令。编辑样本采用图像优先排序；必须在输出中渲染的引号内文字采用字符级分词。作者拼接三个均匀间隔隐藏层的表示，并用 MLP 映射到扩散隐空间。**VLM 输出的图像 token 不前传给 DiT**——消融显示它们只增加序列长度而无 measurable 质量增益；像素级参考信息经由单独路径保留：输入图像与加噪目标图像由 FLUX.2 AE 编码后线性投影。T2I 与 I2I 使用同一 System Prompt 与同一条件接口。

**高效并行骨干**。条件特征与图像隐变量拼接后送入 $L$ 个单流并行块。每块并行计算多头注意力与 SwiGLU MLP（扩展系数 3）。省略时间步调制与归一化后，更新式为：

$$y'=\mathrm{LayerNorm}(x),\qquad y=x+\mathrm{MLP}(y')+\mathrm{Attention}(y').\tag{1}$$

该结构允许 QKV 与 MLP 第一投影、注意力输出与 MLP 第二投影分别做算子融合。相对非并行方案，质量差异极小，而推理效率提升约 **10%**。时间步相关的 scale、shift 与零初始化门由一个块共享调制网络产生——共享虽略削弱调制模块本身，却为注意力与前馈层释放了可观的参数预算，在固定模型规模下提升整体性能。

**位置编码与优化稳定性**。在 $[T,H,W,L]$ 上使用 4D-RoPE：文本只占语言轴 $L$，相邻输入图像沿 $T$ 以偏移 **10** 分隔。由此形成的图像索引先验可防止不同图像中相同空间坐标的 token 被人为拉近，减少多图编辑中的"复制粘贴"伪影 [55]。为稳定优化：保留标准残差连接；仅对 QK 使用 RMSNorm，其余用 LayerNorm；注意力与前馈分支外围加 Sandwich Norm；调制门用 Tanh 约束 [7, 73]；所有投影与调制层均无偏置。

**设计洞察**。两条更广的教训：(1) 更强的多模态理解基准分数不保证更好的生成条件——Qwen3.5-4B [39] 在本扩散训练中收敛慢于 Qwen3-VL-8B；(2) 早期收敛不足以选 latent 编码器——内部 PAE [62] 初期学得快，但重建误差引入文字与图像伪影、限制最终质量上限；FLUX.2 AE [6] 提供最佳重建-收敛折中。完整设计空间、组件级发现、负结果与优化器研究见附录 A.2 与表 6。

### 3.2 渐进统一训练

训练课程沿三条轴由粗到细：空间分辨率、任务复杂度、数据质量。**核心原则是先升分辨率、再引异构编辑目标，避免空间尺度与任务分布同时漂移**。训练语料遵循 Wang et al. [51] 的能力中心数据设计：按生成能力的依赖结构构造与组织异构生成/编辑监督。

**奠基预训练**。前 **500K 步**优先规模、多样性、语义覆盖、文本-图像对齐与结构建模：从低分辨率 T2I 起步，分辨率由 **256px 升至 512px**，之后才引入 T2I+编辑联合数据，使模型从宽泛视觉语义走向细粒度的统一生成编辑。宽高比分桶减少填充与裁剪；任务路由序列打包 [16] 避免 T2I 短提示与稠密文字渲染/复杂编辑的超长条件低效混批，原生支持不限分辨率与提示长度。

**持续预训练与 SFT**。CT 运行 **200K 步**，分辨率由 **512px 升至 1024px**，数据分布转向视觉更强的来源；基于 VLM 的层级语义标签与类别级重采样对抗来源偏差、保住长尾覆盖；编辑数据额外做指令类别均衡。SFT 在 1024px 上以精选人工校验高质量子集运行 **10K 步**，并按评测结果对弱能力做数据增强。预训练采用 Logit-Normal 时间步采样以强调中等噪声态与全局结构，SFT 切换为均匀采样（Uniform Sampling）以在轨迹上均匀分布监督、强化细纹理。完整数据流、打包方案、阶段过滤与超参数见图 8、表 7 与附录 A.3。

### 3.3 并行强化学习与多专家整合

监督训练赋予模型宽泛能力，但未显式优化美学、真实感、参考一致性、细粒度指令遵循等人类偏好；而将 RL 扩展到异构多任务数据仍有挑战：冲突任务目标引发梯度干扰、造成任务类别间的跷跷板（seesaw）权衡；组采样 RL 的有限样本效率要求欠优化任务延长优化，而扩散 RL 拉长后又易不稳定与模式坍缩（mode collapse）。因此混合任务训练下部分任务无法达到其专属性能上限。作者用两阶段流程同时解决：**任务连贯的策略并行优化，再由多教师在策略蒸馏（OPD）合并** [27, 72]。

- **多维奖励系统**：构建在线多维奖励系统提供全面而有判别力的反馈。T2I：基于量规（rubric）的评估器评测文本-图像对齐、类别感知美学、视觉质量与风格一致性；编辑：评测指令遵循、参考图一致性与视觉质量；另加基于 ArcFace [17] 与 PP-OCRv6 [66] 的辅助奖励，分别度量人脸身份保持与文字渲染准确性。
- **引导增强 rollout**：rollout 时开启无分类器引导（classifier-free guidance, CFG）以提升采样轨迹质量、给奖励评估更强候选；策略优化时不带 CFG 以降低计算开销、提升训练效率。这种非对称设计保留引导增强奖励信号的好处，同时把部分引导采样能力隐式迁移给无引导策略，而不付出完整引导优化的代价。
- **任务感知奖励路由与并行专家**：按任务类型从多维奖励池灵活路由与组合奖励。不把异构且可能冲突的目标塞进单一策略，而是用 DiffusionNFT [69] 并行训练多个任务连贯策略：一个专属 T2I 专家、一个通用编辑专家、以及若干针对联合训练中欠优化子领域的领域编辑专家。该分解缓解跨任务奖励与梯度干扰，同时保持宽任务覆盖与强领域性能。
- **全步多教师 OPD**：各专家的提升最初驻留在独立检查点。作者从混合任务策略初始化共享学生，并将每个在策略样本交由其领域匹配的专家蒸馏，兼得通才平衡与专才强度。此阶段之后，MOPD 还进一步用于剪枝后 6B→3B 迁移与面向加速的任务专属少步整合。完整奖励定义、专家路由与 RL/OPD 流程见附录 A.4 与图 9。

### 3.4 面向部署的压缩

沿两个互补维度压缩统一模型：采样步数与参数量。分布匹配把去噪轨迹从 **50 步降至 8 步**；结构剪枝得到可部署的 3B 骨干。

#### 3.4.1 少步蒸馏

少步配方建立在分布匹配蒸馏（DMD/DMD2）[59, 60] 之上：冻结教师提供真实分数（real score），联合训练的伪分数网络（fake score）建模学生分布，二者之差给出分布匹配梯度。为减小训练状态与学生推理轨迹间的暴露偏差（exposure bias），中间状态取自学生自身采样轨迹而非前向加噪的训练数据。遵循连续时间分布匹配（CDM）[32]，**动态反向模拟（Dynamic Backward Simulation）** 从 $\{2,4,8,16,28\}$ 采样步数预算并从噪声部分展开学生，使其暴露于不同质量的自生成状态。

作者做了三项面向稳定性的修改：(1) 停止分布偏向更后、更低噪声的状态，把监督集中在纹理与高频精修，同时保留全局结构覆盖；(2) 按 Decoupled-DMD [28]，每个预测的 $x_0$ 只在反向模拟停止噪声以下重新加噪，教师不去监督学生已经过的更噪状态；(3) 对抗头（adversarial head）接在冻结教师的后段层而非持续变化的伪分数上，提供固定语义特征空间与更低方差的信号。异构 6B→3B 蒸馏中，伪分数采用 3B 学生架构，判别器则锚定在 6B 教师。

单一教师无法在所有任务上最优平衡：T2I 导向的监督偏向生成质量，编辑导向的监督更能保参考一致性。因此作者分别蒸馏少步 T2I 与编辑专家，用第二个少步多教师 OPD 阶段 [27, 72] 整合，最后以混合任务少步 DiffusionNFT [69] 收尾。完整流程见图 10 与附录 A.5。

> **图 10（少步蒸馏管线）**：任务专属 RL 教师（T2I-RL / Edit-RL，6B 多步）→ 任务专属少步蒸馏（改进 DMD2：①动态反向模拟、②偏向后段停止、③解耦噪声匹配、④教师锚定对抗损失）→ 少步多教师 OPD（T2I/Edit 专家 → 统一少步模型）→ 混合任务少步 DiffusionNFT 精修 → 最终模型。

#### 3.4.2 结构化模型剪枝

3B 模型由 6B 模型将注意力头数从 **32 减至 24** 并直接继承幸存参数得到。学生不做短恢复训练，而是重新进入由粗到细的课程（CT）。SFT 阶段，冻结的 6B 教师接收相同加噪隐变量 $z_t$、时间步 $t$ 与条件 $c$，监督学生的速度预测（velocity prediction）：

$$\mathcal{L}_{\mathrm{KD}}=\left\|v_{\mathrm{3B}}(z_t,t,c)-\mathrm{sg}\left(v_{\mathrm{6B}}(z_t,t,c)\right)\right\|_2^2,\tag{2}$$

$$\mathcal{L}=\mathcal{L}_{\mathrm{diff}}+\lambda_{\mathrm{KD}}\,\mathcal{L}_{\mathrm{KD}},\tag{3}$$

其中 $\mathrm{sg}$ 为停止梯度（stop-gradient），$\mathcal{L}_{\mathrm{diff}}$ 为原始扩散目标，$\lambda_{\mathrm{KD}}$ 控制教师监督强度。最后，SFT 后的 3B 模型作为学生进入跨容量 OPD，由各专属 6B RL 策略充当任务路由教师。该序列恢复了剪枝损失的能力，并把互补的生成/编辑提升转入一个紧凑模型。

### 3.5 先推理后渲染：Prompt Enhancer

PE 实现高层推理与像素渲染的分离：给定用户指令与可选参考图，产出一个与视觉骨干对齐的结构化 `refined_prompt` [50]。直接了当的请求直接重写；含糊、知识密集或布局敏感的请求先触发 `<think>` 推理轨迹。**只有最终 `refined_prompt` 传给 DiT**，渲染器收到明确的视觉规范而无需同时学习 PE 的深思过程。单一 PE 同时处理 T2I 与 I2I，仅在需要时分配额外计算。

**推理感知监督与 SFT**。构造两类互补数据源。**通用数据（Universal data）** 源自训练骨干所用描述管线产出的视觉描述：强教师先校验（必要时补全）每条描述器产出的 refined prompt，再补充合适推理轨迹；对应的用户输入以多样长度、语言风格与结构化格式合成，并混入真实用户查询。**推理数据（Reasoning data）** 面向需要意图消歧、领域知识或空间规划的请求：先渲染出期望结果，再由教师以实现的目标为条件生成 refined prompt——这种结果接地的监督编码的是"已解出的视觉方案"而非对原请求的表层扩写；目标图像仅用于离线数据构造，推理时 PE 不可见。平衡 Universal/Reasoning、T2I/I2I 与细粒度任务类别后，按复杂度为每个样本指定推理模式：复杂样本同时监督 `<think>` 与 `refined_prompt`，简单样本只监督 `refined_prompt`。SFT 因此同时学到统一输出空间与自适应推理策略。T2I 的 refined prompt 给出完整视觉描述；I2I 中不变内容经 `[image N]` 引用，被修改/新增内容与目标属性以与 T2I 相同的粒度显式描述。

**渲染器接地的强化学习**。从 SFT 检查点出发，用组相对策略优化（GRPO）[56] 训练 PE，同时冻结视觉 DiT（图 7）。对每个请求，PE 以自适应推理采样一组重写。**重写文本奖励（Rewrite Text Reward）** 度量文本级指令遵循（空间关系、精确文字渲染约束、完整性）与知识推理（实体识别、事实性、布局规划）。并行地，每条 refined prompt 由 DiT 渲染，**图像生成奖励（Image Generation Reward）** 度量结果是否实现所请求的内容、知识与布局，以及视觉质量、美学与（编辑的）参考一致性。两种视角角色不同：文本奖励保护正确性与可控性，图像奖励检验规范能否被该渲染器实际执行。作者在每个 GRPO 采样组内对各奖励标准化，融合所得相对优势，而非用手工调 scales 拼接原始分。**只更新 PE**，使其措辞、细节与约束粒度自适应冻结 DiT 而不改动渲染器。附录 A.6 详述教师数据合成、输出约定、均衡与完整奖励量规；图 11 给出定性对比。

> **图 7（PE 数据构造与训练）**：均衡与多样化的 T2I/I2I 数据经教师 VLM 校验与推理标注（含动态思考、意图识别、冗余去除）；SFT 建立统一输出风格与复杂度自适应推理；随后渲染器接地的 GRPO 用冻结视觉骨干的反馈，联合优化文本正确性（文本奖励模型）与视觉可执行性（图像奖励模型）。

RL 在全部评测基准上一致提升 6B 基座，Overall 从 **3.98 提升到 4.16**；增益在 REDEdit（3.98→4.34）与 PiPractical（3.69→3.92）上尤其显著，说明基于奖励的后训练有效提升了超越监督训练的复杂指令遵循与实用编辑质量。少步蒸馏则取得更强综合性能：**Swift-Image-6B-Turbo 以少得多的采样步数取得 Overall 4.20，略超其多步 RL 教师（4.16）**；在 GEdit、ImgEdit、REDEdit 上与教师接近，并把 PiGeneral 从 3.96 提升至 4.08、PiPractical 从 3.92 提升至 4.01。蒸馏管线并非 merely 恢复基座：它有效保留了 RL 引入的增益，产出综合编辑性能相当或更强的少步模型。

### 4.4 Prompt Enhancer 评估

**总体有效性**：表 1 中 PE 一致提升两个 Swift 变体的整体编辑性能，3B 与 6B 分别从 4.05 提升到 4.21、从 4.12 提升到 4.29（原文数字，与表 1 的 4.15→4.31、4.16→4.33 略有出入，疑来自不同评测轮次）。Qwen-Image-Bench（表 3）趋势类似：PE 将 3B 的 Overall 从 48.26 提升到 53.17、6B 从 51.10 提升到 56.33（同上，3B 数字与表 3 略有出入）。这些一致增益表明 PE 在不同规模上都同时惠及生成与编辑。

**推理密集任务**：PE 的收益在需要领域知识、意图推断与视觉布局规划的任务上尤其突出。CPI-Intelligent 上，PE 将 3B 从 1.99 提升到 3.13、6B 从 2.19 提升到 4.21；Pi-ExpertVerse-T2I 上分别从 2.06 提升到 4.49、从 2.49 提升到 4.63（本句为原文数字，与表 2/表 4 略有出入）。此外，把 PE 应用于其他开源模型在 Pi-ExpertVerse 两个拆分上也产生一致提升，说明指令解释与规划是通用瓶颈，而非 Swift-Image 骨干特有的限制。

**讨论**：PE 在 Pi-ExpertVerse 上的提升大于常规基准，支持解耦设计：对直接了当的请求，DiT 本身已具备强视觉执行，提示精修空间有限；对含糊、组合式或知识密集的请求，PE 在生成前解析用户意图、补充相关知识、构造可执行的视觉方案，使 DiT 专注于忠实的像素级渲染，而非同时进行高层推理与视觉合成。这一差距提示：复杂生成日益受限于高层意图解释与视觉规划，而非单纯的渲染能力。

---

## 5 结论

本文提出 Swift-Image，一个紧凑统一模型，支持文生图与单图/多图编辑。通过在架构、能力导向渐进训练、强化学习、蒸馏与压缩上的系统性训练工程，Swift-Image 仅以 6B 参数与 243K GPU 训练小时取得强开源性能；压缩 3B 版本保持竞争力，少步蒸馏进一步降低推理成本而不牺牲（在聚合编辑上甚至提升）性能。除模型本身，本文总结了若干面向紧凑统一视觉生成器的实用原则：训练分布随模型能力演进、冲突目标先专门化再整合为统一策略。这些结果表明，各组件间的精心协同能大幅拓展紧凑视觉模型的性能前沿，希望为构建高效且强大的图像生成系统提供有益参考。

## 附录要点（压缩为要点式）

### A.1 实践洞察与五大原则

- **数据即能力课程，而非固定数据集**：不同生成能力不同时涌现；宽泛视觉-语义对齐与世界知识是细粒度结构、参考关联与受控编辑的前提。早期强调语义覆盖与长尾概念，后期再提升结构复杂度、视觉保真与任务特异性；T2I 学到的文字渲染、视觉概念与风格表示可自然迁移到编辑。最优训练分布应视为"模型当前能力状态的函数"。
- **架构为"生成可学习性、效率、稳定性"优化，而非孤立组件强度**：多模态理解更强的模型不一定提供更好的生成条件；面向查询推理高度优化的表示作为稠密生成条件收敛更慢；组件评估应放在固定计算/参数预算下（如块共享调制释放的参数预算可再分配给核心 Attention/MLP）。
- **预训练：覆盖先于偏好优化**：此阶段过度激进的质量过滤可能适得其反——视觉不完美的图像仍含宝贵语义监督。预训练扩展分布的支撑集，后续阶段在支撑集内重塑概率质量。
- **课程：空间计算与监督复杂度一起提升**：低分辨率足以学宽泛语义对应与全局结构；稠密文字、复杂布局与细粒度空间关系只有在高分辨率下才充分 informative。升分辨率不应只是同样监督的更高成本重复。编辑在 T2I 能力稳定后才引入，从而复用已学的视觉词汇。
- **CT 即"从广度到质量的分布退火"**：质量过滤本身引入分布偏移（专业高保真来源的语义/风格分布更窄），须与显式语义重平衡耦合，防止长尾知识被无意清除。
- **SFT 是"选择高质量子流形"而非"重学世界"**：最有价值的 SFT 样本不一定是全局最高质量样本，而是直接针对模型剩余能力缺口的样本——由此形成评测驱动的数据闭环（反复失败 → 检索/合成目标 → 提高采样权重直至解决），评测从终端度量变为主动控制信号。
- **RL：专门化与统一解耦**：保留混合任务策略作为通才锚点，用领域路由的奖励组合并行训练任务连贯专家，使其在连贯目标下逼近领域性能上限；再用多教师 OPD 把互补增益整合进共享学生。**专门能力不必在同一优化轨迹内学习与统一**。
- **蒸馏：关键在"在哪些状态上蒸馏"且不混合冲突任务**：少步模型只在自己的轨迹上运行，故蒸馏状态取自学生 rollout；rollout 只需覆盖而非复现推理调度（随机化训练时转移 → 一个学生服务多种步数预算）；监督不应在噪声级上均匀铺开（高噪声修全局结构、低噪声修细节纹理；压缩轨迹中高噪声错误不可逆），应把监督放在学生仍弱处并随学生进步再分配。T2I 与编辑在蒸馏中相互干扰（前者需多样性与全局结构，后者需参考保真与未编辑区一致性），分别蒸馏、各用各的状态分布、之后再整合。
- **PE 是"编译到生成器原生条件语言"**：Captioner 在训练期定义了 DiT 观察到的语言分布（词汇、粒度、空间描述、图像引用约定、布局表示）；PE 的职责是把异构用户意图翻译为与训练监督语言相近的生成器对齐表示——本质是**条件分布对齐**问题。提示质量不能只靠文本判断：语义完整的提示对特定生成器可能难以执行，需生成器感知的 RL 同时评估重写条件与冻结生成器实际产出的图像。
- **五条统一原则**：①能力依赖（Capability Dependency）；②分布演进（Distribution Evolution）；③专门化-整合（Specialize–Consolidate）；④推理-渲染解耦（Reason–Render Decoupling）；⑤评测即控制（Evaluation as Control）。强统一视觉基础模型的开发，更多在于协调**数据、能力、计算与优化**在全训练生命周期的演进，而非寻找单一主导技巧。

### A.2 架构选择与消融

消融以三项核心目标评估（借鉴 Krea2 [24] 的设计哲学）：同等训练 TFLOPs 预算下的收敛速度与性能上限（模型性能）、FLOPs/MFU（模型效率）、训练 Loss 与梯度范数曲线的平滑性（训练稳定性）。

**表 6（架构组件消融与最终选择）**：

| 组件 | 基线 | 消融变体 | 最终选择 |
|---|---|---|---|
| Attention | Multi-head attention [49] | Conditional feature-reuse attention [45] | Multi-head attention |
| MLP | GeLU MLP | SwiGLU [42] | SwiGLU |
| Residual | Standard residual | Kimi Attention Residual [46] | Standard residual |
| Text encoder | Qwen2.5-VL-7B [4] | Qwen3-VL-4B/8B [57]; Qwen3.5-4B [39] | Qwen3-VL-8B |
| Modulation | Per-block MLP | Block-shared modulation [6, 40] | Block-shared modulation |
| Autoencoder | FLUX AE [23] | Qwen-Image VAE [53]; FLUX.2 AE [6]; 内部 PAE [62] | FLUX.2 AE |
| Block design | Single-stream Transformer | Hybrid stream [18]; Single-stream parallel [6, 15] | Single-stream parallel |
| Normalization | LayerNorm [3] | RMSNorm [63]; Hybrid norm; Sandwich norm [73] | QK: RMSNorm；其余 LayerNorm + sandwich norm |
| Position encoding | 3D-RoPE | MS-RoPE [53]; 4D-RoPE [6] | 4D-RoPE |
| Prompt encoding | 默认分词；文本前置；保留 VLM 图像特征 | 字符级分词；图像前置；丢弃 VLM 图像特征 | 字符级分词；图像前置；丢弃 VLM 图像特征 |

要点式补充：**文本编码器**——四个候选中 Qwen3-VL-8B 总体最佳；Qwen3.5-4B 虽在多模态理解公开基准上超过 Qwen3-VL-8B，但实际训练收敛显著滞后（假设：作为"思考模型"其输出表示偏向查询导向逻辑，而非生成所需的稠密语义 [36]）；从三个均匀分布隐藏层抽表示拼接、经 MLP 对齐到 DiT 隐空间 [25]。**自编码器**——FLUX 2 AE 在重建质量与下游收敛上最佳；内部 PAE 早期收敛快但引入文字/图像伪影（受限的可重构性压制收敛上限），未来将专门优化内部 AE 的可重构性。**Transformer 块**——OmiControl2 的条件特征复用（缓存首去噪步参考图 KV 共享给后续步）导致性能退化与收敛变慢，故弃用；SwiGLU（扩展系数 3，参照 FLUX-Klein）带来稳定提升。三种流设计对比（纯单流 / 浅层独立深层共享的混合流 / 并行单流）：同层数下混合流略优但参数开销更大；并行单流相对非并行版本性能损失极小而推理效率提升约 10%，权衡后采用并行单流。**时间步条件**——标准 MM-DiT 中每块独立调制 MLP 约占参数量 20%-30%，仅注入标量条件极不经济 [7, 40]；块共享调制虽直接造成小掉点，但释放的参数预算在同等总参数约束下可分给核心层、提升全局性能。**位置编码**——4D-RoPE 分辨率外推最优；相邻图像在 T 维强制偏移 10，缓解目标图 token 对相邻图同位置 token 的过度注意，避免"复制粘贴"伪影 [55]。**残差与归一化**——Kimi-Attn Residual 在图像生成上无增益反而退化（推测图像数据的高度非结构化特征与该机制不兼容 [34]）；全网换 RMSNorm 轻微掉点，故采用混合策略（仅 QK-Norm 用 RMSNorm），加 Sandwich Norm 约束注意力/前馈分支输入输出信号幅度，Gate 参数过 Tanh 防止异常高调制值破坏残差分支 [7, 73]——组合显著提升稳定性（更平滑的 Loss 与梯度范数曲线）。**优化器**——主用 AdamW；探索了 Muon [30]（DeepSpeed 标准实现）：正交化使参数更新数值幅度天生更大，禁用梯度裁剪收益更好；Muon 初期收敛快于 AdamW，但长期最终性能不及，且其参数集需精细过滤（参照社区实践 [24]），尚未纳入最近一轮正式预训练。**条件输入三处统一**——引号内待渲染文字用字符级分词（大幅提升渲染精度）[47]；图文交错编辑指令中图像前置于文本（获得更纯净的初始图像表示与更全局上下文化的指令表示，小而稳定的增益）；VLM 输出图像 token 不前传（无损且加速推理）；全局统一 System Prompt 不损性能（以往工作常用任务分歧模板 [36, 53]）。

### A.3 渐进训练细节

- **预训练（500K 步）**：三阶段课程——S1 低分辨率（256px）T2I 预训练 → S2 256→512px 复杂 T2I 预训练 → S3 512px T2I+编辑联合预训练；先升分辨率再引任务复杂度，解耦空间扩展与多任务学习。过滤链：文件损坏/分辨率/宽高比/模糊/压缩率/去重/宽松 AIGC 检测/安全。序列打包：短提示任务按 512 token 填充常规批处理；长提示任务沿序列维打包，经 FlashAttention-2 的 `flash_attn_var_len_func` 处理（稠密文字渲染与复杂编辑样本可超 10,000 token）。
- **持续预训练（200K 步，512→1024px）**：移除低质网络来源、强调视觉强/专业策展域；VLM 层级语义标签 + 类别级重采样防偏；编辑数据按指令类型做质量过滤与类别均衡（减缓联合训练的任务失衡与灾难性遗忘）；分辨率随质量分布同步上调。过滤链新增：清晰度/美学/像素方差/RGB 熵/严格 AIGC/来源质量/分布过滤。
- **SFT（10K 步 @1024px）**：人机协同策展（大 VLM 先剔除明显缺陷/图文失配样本，再人工终审）；评测驱动数据增强（对欠表现任务与语义概念选择性增样，保留全局类别均衡）；时间步采样由 Logit-Normal 切换为均匀采样。

| Steps (K) | 500 | 200 | 10 |

### A.4 专家 RL 与 OPD 细节

- **动机**：扩散/流式 RL 受低样本效率与有限稳定性制约（DiffusionNFT、Flow-GRPO 需要很多优化步才见稳定收益；过长 RL 引发训练坍缩与模式坍缩）；单次 RL 只能覆盖有限有效数据；混合任务下异构目标梯度干扰加剧。奖励评估本身是多目标的，需要训练良好的奖励模型与系统化评估管线。
- **两阶段级联**：先用全量多维奖励在混合任务数据上优化得到强通才模型；再用定制奖励与专属数据训练各领域教师；最后用多教师 OPD 把领域教师优势整合为单一最终模型。
- **奖励系统**：T2I-Reward（量规式：文本-图像对齐、类别感知美学、视觉质量、提示风格一致性）；Edit-Reward（量规式：指令遵循、参考一致性、视觉质量 + BT 损失训练的偏好奖励模型增强在线打分判别力与稳定性；领域专家训练按编辑域特性定制奖励标准）；补充奖励（ArcFace 人脸身份一致性、PP-OCRv6 文字渲染准确性，减少字形扭曲）。
- **并行 RL**：并行训练 T2I-RL 专家、混合数据 Edit-RL 与若干欠优化编辑子领域专家，减少跨任务优化冲突，每条分支聚焦更连贯的奖励分布。rollout/策略优化解耦：rollout 开 CFG 产强候选，优化关 CFG 省算力，并把引导采样的优势隐式蒸馏进最终策略。
- **多教师 OPD**：混合数据 RL 模型作学生骨干（强泛化、均衡），向其蒸馏 T2I 专家与多个编辑子领域专家的知识；最终模型保留通才覆盖，同时吸收专才强度。

### A.5 压缩与少步蒸馏细节

- DMD2 [59]：冻结教师给真实分数，联合优化伪分数网络近似学生分布，分数差给分布匹配梯度；每次学生更新配多次伪分数更新以稳定优化。目标：50→8 步同时保住视觉质量、提示遵循与结构一致性。
- **动态反向模拟**（CDM [33]）：每次迭代从 {2,4,8,16,28} 随机采样步数预算，从纯噪声部分展开学生取监督状态；相对固定步轨迹，随机化预算让学生暴露于不同生成质量的状态，大幅拓宽自身采样轨迹上的有效监督。
- **三项分布匹配改进**：①停止点偏向更后、更低噪声阶段（同时保持全轨迹覆盖），把更多监督分配给纹理与细粒度细节精修；②按 Decoupled-DMD [28]，生成 $x_0$ 只重新加噪到停止噪声以下的时间步，教师不再监督学生已穿越的高噪状态；③轻量对抗头接在冻结教师后段特征层（而非 DMD2 中持续更新的伪分数），固定教师提供更稳定的语义判别空间。
- **异构师生架构支持**：3B 学生 + 6B 教师蒸馏时，伪分数用 3B 架构（建模学生输出分布、自学生检查点初始化），对抗判别器锚定冻结 6B 教师，使真/生成样本在同一更高容量表示空间中比较。
- **任务专属教师 + 四步管线**：单一教师无法给所有任务最优少步学生（T2I 教师偏生成质量、编辑教师偏参考一致性）→ 分别蒸馏 T2I/Edit 少步专家（遵循 DanceOPD [72]、DiffusionOPD [27] 精神，用少步多教师 OPD 整合）→ 混合 T2I+I2I 奖励的少步 DiffusionNFT 终修（联合优化文图对齐、感知质量、身份保持与结构一致性，同时保留少步效率）。
- **剪枝后恢复**：32→24 头直接继承参数 → 重新走 CT 的由粗到细恢复课程（而非短恢复）→ SFT 加速度预测蒸馏损失（式 2）→ 任务路由 OPD 把专属 6B RL 策略转入统一 3B 学生。

### A.6 Prompt Enhancer 细节

- **四个功能角色**：Interpreter（从可能不完整/含糊的输入恢复预期任务、目标内容、参考角色与修改边界）；Reasoner（仅补足使请求视觉可实现所需的知识与隐含约束）；Planner（把解析后的意图转为显式视觉方案：主体、属性、空间关系、视角、布局区域、文字块、保持要求）；Compiler（把方案映射到 Captioner 确立的词汇、描述结构、粒度、图像引用约定与约束格式）。编译这一步至关重要——训练期 Captioner 定义了 DiT 观察到的条件语言分布，推理期 PE Compiler 从用户请求（而非目标图）复现该分布，对齐两个分布以缩小训练监督与推理条件的差异：

$$P_{\mathrm{PE}}(p\mid u,\,R)\;\approx\;P_{\mathrm{Captioner}}(p\mid I_{\mathrm{target}},\,R),\tag{4}$$

  其中 $u$ 为用户请求，$R=\{I_1,\dots,I_n\}$ 为可选参考图集合，$p$ 为生成器对齐的视觉条件。
- **数据构造**：Universal 数据——复用前述 T2I/I2I 训练语料及其描述管线产出的 refined_prompt，Gemini 3.1 Pro 校验语义保真与视觉完整性（仅必要时修正），为需意图消歧/知识推理/空间规划的样本补推理轨迹；再从验证后的 refined_prompt 合成多样用户输入（自然语言、结构化指令、程序化格式，不同长度/风格/细节度，I2I 样本保留 [image N] 对应关系），混入真实查询。Reasoning 数据——T2I：Claude 生成推理导向指令及底层理据，GPT-Image 渲染目标图，Gemini 以实现图为条件生成目标 refined_prompt；I2I 同流程加参考图与编辑指令；显式覆盖知识密集与布局敏感场景。自适应思考标注：平衡 Universal/Reasoning、T2I/I2I 与任务类别后，按复杂度指定推理模式（复杂样本监督 think+refined_prompt，简单样本只监督 refined_prompt）。
- **SFT**：教 PE 统一的重写空间（无论输入风格/粒度，输出标准化 refined_prompt；T2I 给完整细粒度视觉描述，I2I 只显式描述修改/新增内容与目标属性、不变内容走图像引用），同时学会"何时需要推理"——单一模型以自适应计算支持异构 T2I/I2I 输入。
- **生成器感知 RL**：从 SFT 出发 GRPO、DiT 冻结。Rewrite Text Reward = 指令遵循 IF（视觉约束、空间关系、文字渲染要求、描述完整性）+ 知识推理 KR（实体识别、事实性视觉知识、显式布局规划）；Image Generation Reward = 指令遵循（请求内容/知识/空间关系的实现）+ 视觉质量 VQ（感知质量、美学、编辑的参考一致性）。推理密集类别在两个视角中都加入任务专属知识与布局标准。奖励在 GRPO 组内标准化后融合相对优势，避免手工调 scales；只更新 PE。

## 创新点提炼

1. **紧凑统一模型的系统性训练工程范式**。本文的核心贡献不是单点技术，而是把架构、数据课程、后训练、提示处理与压缩组织成一条连贯管线：6B 单模型统一 T2I/单图/多图编辑，仅约 243K GPU 小时即在五个编辑基准综合分上领先全部受评测开源模型（Overall 4.41，全榜第三），证明训练工程可以在受限预算下大幅推高紧凑模型性能前沿。

2. **效率导向的单流并行 DiT 与参数全局再分配**。并行 Attention/MLP 块（式 1）通过 QKV-MLP 投影融合换取约 10% 推理效率提升；块共享时间步调制删去约占参数 20%-30% 的每块独立调制 MLP，把预算重新分配给核心层。这种"局部组件让步、全局性能受益"的架构评估视角对紧凑模型尤其有价值。

3. **"先分辨率、后任务"的渐进统一课程**。奠基预训练（500K 步，256→512px，纯 T2I）→ CT（200K 步，512→1024px，质量退火 + 语义重平衡）→ SFT（10K 步，评测驱动增样），配合宽高比分桶与任务路由序列打包（短提示填充至 512 token、超万 token 长条件变长打包），实现任意分辨率/提示长度的高效原生支持，并让编辑复用已建立的视觉词汇。

4. **并行专家 RL + 多教师 OPD 的"专门化-整合"后训练**。针对混合任务 RL 的梯度干扰与跷跷板效应，用 DiffusionNFT 并行训练任务连贯专家（T2I 专家 + 通用编辑 + 领域专家），rollout 开 CFG、优化关 CFG 的解耦设计兼顾样本质量与训练效率；再以混合策略为学生做多教师 OPD 整合。该"专门化-整合"范式还复用于剪枝后 3B 迁移与少步整合，RL 使 Overall 从 3.98 升至 4.16。

5. **Prompt Enhancer：条件分布对齐视角的"推理-渲染"解耦**。把 PE 理解为"编译到生成器原生条件语言"（式 4）：Interpreter/Reasoner/Planner/Compiler 四角色把异构用户意图编译为 Captioner 分布的对齐表示，自适应决定是否触发 `<think>`；用冻结 DiT 的文本+图像双反馈 GRPO 优化（组内标准化融合相对优势），在 CPI-Intelligent 上将 6B 从 2.26 拉至 4.23，且对其他开源模型同样有效——证明指令解释与规划是行业通用瓶颈。

6. **结构剪枝 + 稳定性改造少步蒸馏的完整压缩链路**。32→24 头剪枝后重新走 CT 恢复课程 + 速度预测蒸馏（式 2、3）+ 跨容量 OPD，得到几乎无损的 3B（Overall 4.40 vs 6B 的 4.41）；少步蒸馏在 DMD2 基础上引入动态反向模拟（{2,4,8,16,28} 随机预算，一个学生服务多种步数）、偏向低噪声停止、解耦噪声匹配与教师锚定对抗头，并把"专门化-整合"扩展到少步域（T2I/Edit 分别蒸馏 → 少步 OPD → 混合少步 RL），50→8 步的 Turbo 版综合编辑分反超多步教师（4.20 vs 4.16）。
