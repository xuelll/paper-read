<script type="text/markdown" id="zhSrc"># 《AesMind: Harnessing Multimodal Large Language Models for Neuroaesthetic Understanding and Assessment》中文精读翻译

## 论文信息

- **英文标题**：AesMind: Harnessing Multimodal Large Language Models for Neuroaesthetic Understanding and Assessment
- **中文标题**：AesMind：驾驭多模态大语言模型实现神经美学的理解与评估
- **作者**：作者匿名（ICLR 2027 双盲在审；PDF 首页标注 "Anonymous authors / Paper under double-blind review"）
- **机构**：双匿名在审（论文信息不展示机构）
- **发表状态**：ICLR 2027 在审（OpenReview 提交号 UtWakRp7J0，2026-09）
- **提出的资源/框架**：NeuroAes 数据集（含评测基准 NeuroAes-Bench 与训练集 NeuroAes-Data）＋ 认知美学 MLLM "AesMind"（Skill–SFT–GRPO 三阶段训练范式）
- **基座模型**：Qwen3.5-9B（多模态主干）

## 一句话核心总结

本文把神经美学的"感觉-运动 / 情绪-评价 / 知识-意义"三系统理论（Chatterjee & Vartanian 的"审美三联体"）操作化为摄影美学的可计算分类体系，据此构建 25K 图、含 120 万+细粒度神经美学标签与 225 万条人类主观评分（凝练为 15 万条 MOS）的 **NeuroAes** 数据集；并在其上以"技能驾驭（提示优化）→ 监督微调（SFT）→ 组相对策略优化（GRPO）"的渐进三阶段范式训练出 **AesMind**，使一个 9B 多模态模型在感知问答、连续 VAD 情绪回归与八维专业批评生成三类任务上全面达到 SOTA，并展现出跨数据集泛化与给出可操作摄影改进建议的能力。

---

## 摘要

多模态大语言模型（Multimodal Large Language Models, MLLMs）的最新进展显著提升了图像美学评估（Image Aesthetic Assessment, IAA）的可解释性与泛化能力。然而，现有方法仍主要通过单一整体分数或泛泛的批评来评价美学，既无法提供细粒度的属性评级，也无法提供结构化的多维推理。为突破这些局限，本文借鉴神经美学（neuroaesthetics）——一门研究审美欣赏的认知与神经机制的学科——建立了一个涵盖**感觉-运动（sensory-motor）、情绪-评价（emotion-valuation）、知识-意义（knowledge-meaning）**三大系统的完整审美体验分类体系。

基于这一理论框架，本文首先提出 **NeuroAes**——一个专为计算摄影神经美学（computational photographic NeuroAesthetics）定制的大规模数据集，包含 2.5 万张图像，标注了覆盖 48 个子类、总量超过 120 万条的细粒度神经美学标签，以及横跨审美情绪与诱发情绪的效价-唤醒-支配（valence-arousal-dominance, VAD）维度、总量超过 225 万条的人类评分。其中，NeuroAes 被划分为用于全面美学评估的 5K 图 **NeuroAes-Bench** 与用于大规模训练的 20K 图 **NeuroAes-Data**。

在此基础之上，本文开发了 **AesMind**——一个一体化（all-in-one）的认知美学 MLLM，通过"技能驾驭（skill harnessing）、监督微调（Supervised Fine-Tuning, SFT）、组相对策略优化（Group Relative Policy Optimization, GRPO）"的渐进三阶段训练范式，统一了感知、评估与描述三类能力。大量实验表明，AesMind 在全部基准任务上取得最先进（SOTA）性能。值得注意的是，它展现出卓越的连续情绪回归、前所未有的跨数据集泛化能力，以及给出美学改进建议的独特能力，证明其能够深入理解摄影美学，而非仅仅复述表层视觉线索。NeuroAes 与 AesMind 均将开源发布以促进后续研究。

---

## 1 引言

理解摄影美学对于从智能相册管理到以人为中心的图像生成等应用正变得日益关键。在这些场景中，计算模型不仅需要判断视觉吸引力，还需要识别背后的摄影因素、刻画所诱发的情绪，并提供可操作的反馈。历史上，图像美学评估（IAA）主要被构建为数据驱动的分数回归或分类任务，预测平均意见分数（Mean Opinion Score, MOS）或离散美学类别（Murray et al., 2012; He et al., 2022）。尽管部分工作引入了特定摄影属性（Kong et al., 2016; Huang et al., 2024a），这些传统方法本质上将复杂的美学评估压缩为一个孤立的标量分数，难以建模多维人类偏好或提供结构化推理。

近期，MLLM 已将 IAA 从数值回归拓展到视觉问答与批评生成（Huang et al., 2024b; Zhou et al., 2024; Cao et al., 2025）。然而，当前基于 MLLM 的 IAA 方法存在一个关键瓶颈：**其评测维度主要依赖启发式设计，缺乏统一的理论基础**；现有数据集往往标注粗糙，且将美学偏好与视觉情绪视为彼此孤立的问题。其后果是，所开发的模型通常只能产出流畅但泛泛的批评，无法深入参与细粒度的摄影感知与复杂的情绪评价。

> **图 1**：所提出的计算摄影美学框架总览。与以往基于启发式的基准不同，NeuroAes 依据神经美学原理（感觉-运动、情绪-评价、知识-意义）显式统一了感官感知、情绪评价与专业描述性批评。在该框架驱动下，AesMind 相较现有 SOTA 多模态模型展现出优越的多任务能力。图中对比了传统 IAA 模型"孤立标量分数"式评价与本文"多维情绪画像"式评价；示例问答回合（"图像的影调分布？景别？天气？"）显示 Kimi-VL、Qwen3-VL-30B、Gemini-3-Pro、Artimuse 与 AesMind 给出不同答案（AesMind 答案为 mid-mid tone / medium shot / uncertain）；批评示例中 Artimuse 给出套路化赞美（对角线引导视线、明亮色彩突出等），而 AesMind 能具体指出前景杂乱、左下角车顶与右侧红色汽车切入画面破坏构图平衡、中景行人分散缺乏视觉中心等具体缺陷。NeuroAes-25K = NeuroAes-Bench（5K 图，30K MOS 与 28.7 万+ QA 对）＋ NeuroAes-Data（20K 图，120K MOS 与 100 万+指令对）。

为解决上述局限，本文基于神经美学建立了完整的摄影美学分类体系。神经美学研究审美欣赏的认知与神经机制，通过感觉-运动、情绪-评价与知识-意义三个相互作用的认知系统来概念化人类审美体验（Chatterjee & Vartanian, 2014）。在情绪-评价系统内部，心理学研究进一步将**审美情绪（aesthetic emotions，由摄影执行所诱发）**与**一般诱发情绪（evoked emotions，由所描绘内容所引发）**严格区分（Menninghaus et al., 2019）。据此，本文基于神经美学原理，以细粒度属性、审美与诱发情绪、结构化批评三类要素将神经美学三系统形式化为摄影美学体系，建立起一条从**感知视觉属性 → 评价其情绪影响 → 解释审美判断**的统一认知链。

基于该框架，本文构建了包含 2.5 万张图像的摄影美学数据集 **NeuroAes**。为全面理解与评估神经美学，本文采集了覆盖 48 个子类、超过 120 万条的细粒度神经美学标签，以及在 VAD 空间（Warriner et al., 2013）上针对审美情绪与诱发情绪的超过 225 万条人类评分。该数据集被划分为 5K 图的评测基准 **NeuroAes-Bench** 与 20K 图的训练集 **NeuroAes-Data**。NeuroAes-Bench 以三种任务形式评测统一认知链：感官属性感知、VAD 分数连续评估、审美推理描述；NeuroAes-Data 则为渐进训练提供超过一百万条 QA 对与 MOS。基于 NeuroAes-Data，本文开发了 **AesMind**——一个基于 MLLM 的神经美学理解与评估模型，经由渐进三阶段范式训练：用于认知提示初始化的技能驾驭（skill harnessing）、用于跨模态知识内化的监督微调（SFT）、以及适配显式推理诱导的组相对策略优化（GRPO）。大量实验表明，AesMind 在 NeuroAes-Bench 上全面取得 SOTA，在所有连续情绪维度上大幅超越现有模型；同时 AesMind 还表现出卓越的跨数据集泛化。其生成建设性摄影批评与改进策略的能力，证实了模型对美学机制的内在把握，将其从"仅识别表层特征"提升到"结构化解码摄影艺术"。

**本文主要贡献**总结如下：

1. 提出一个**以神经美学奠基的框架**，建立涵盖感觉-运动、情绪-评价、知识-意义三大系统的完整摄影审美体验分类体系；
2. 构建 **NeuroAes** 数据集（含 NeuroAes-Bench 与 NeuroAes-Data），包含超过 120 万条细粒度神经美学标签，以及由 225 万条人类评分导出的 15 万条 MOS；
3. 提出 **AesMind**——一个渐进式 Skill–SFT–GRPO 范式，结合认知初始化、知识内化与新颖的连续混合奖励优化，以诱导显式的"审美思维链"推理；
4. 大量实验证明 AesMind 在 NeuroAes-Bench 上的 SOTA 表现与稳健的跨数据集泛化，验证其超越表层视觉识别、通过建设性美学批评结构化解码摄影艺术的能力。

## 2 相关工作

### 2.1 神经美学与审美情绪

神经美学通过感觉-运动、情绪-评价与知识-意义系统的动态交互刻画人类审美体验（Chatterjee & Vartanian, 2014; Leder et al., 2004）。在情绪-评价系统内，认知心理学严格区分一般诱发情绪与特定审美情绪，并独特地通过效价-唤醒-支配（VAD）空间对其进行量化（Menninghaus et al., 2019; Warriner et al., 2013）。近期，MLLM 被越来越多地应用于视觉情绪理解，产生了众多基准（Xie et al., 2024; Gao et al., 2026; Zhang et al., 2026; Lian et al., 2025）。然而这些工作主要关注一般诱发情绪或粗粒度情感分类，忽视了摄影审美情绪的独特性。对此，本文将 VAD 空间操作化，以分别量化"由视觉内容诱发的情绪"与"由摄影执行引发的美学情绪"。

### 2.2 图像美学评估

IAA 的历史演进从在 AVA 等数据集上回归标量 MOS（Murray et al., 2012），发展到探索个性化美学偏好（Ren et al., 2017; Yang et al., 2026b; Hayashi et al., 2026）。认识到孤立分数的局限后，近期工作引入了具体摄影属性（Huang et al., 2024a）并转向层次化批评生成（Li et al., 2025a; Liu et al., 2026）。此外，先驱研究主张让计算模型对齐人类认知过程而非依赖黑盒映射（He et al., 2022; Chen et al., 2025）。尽管有这些进展，现有评测维度在很大程度上仍是启发式的。受制于统一认知基础的缺失，当前模型难以清晰表达一条连接感官感知、情绪评价与语义批评的结构化审美推理过程。

### 2.3 面向美学的多模态大语言模型

MLLM 的近期进展推动了视觉感知与 IAA 的发展，产生了如 AesBench（Huang et al., 2024b）、UNIAA（Zhou et al., 2024）与 ArtiMuse（Cao et al., 2025）等基准与模型，它们将数值预测与文本批评生成相结合。尽管有研究强调 MLLM 用于评估的比较推理能力（Kil et al., 2024; Teng et al., 2026），当前美学模型仍主要依赖 SFT 方法（Hu et al., 2021）。SFT 虽能生成流畅文本，但其本质是记忆映射，并不能赋予显式的推理轨迹。为弥合这一差距，本文将 GRPO 与连续混合奖励机制相结合，使模型超越死记硬背，显式诱导出审美思维链（chain-of-thought）推理过程。

## 3 NeuroAes：以神经美学奠基的框架与基准

为将神经美学框架操作化用于计算美学理解，本文构建了 **NeuroAes**——一个包含 25,000 张图像与超过 225 万条人类标注的综合性数据集。计算分类体系、数据采集、主观数据处理与所导出评测基准的细节见图 2。

> **图 2**：NeuroAes 数据集构建流水线。过程包含四步：(1) 从小红书（Rednote/Xiaohongshu）与 PARA 多样化采集图像（小红书 26,470 张 + 真实用户评论；PARA 31,229 张 + 原始标注）；(2) 人机协同标注，产出细粒度标签与超过 15 万条主观 MOS 评分（筛选高质评论的小红书图 12,500 张 + 随机采样 PARA 图 12,500 张 = 25,000 张；构建 71 名被试的个人画像；每图 15 名独立被试、6 个分数；150K MOS 与 220 万+个性化分数；数据清洗与人工审计；感觉-运动标签为 3 个核心维度、18 个类别、37 个子类、168 个细粒度标签，由 Gemini 预标注后人工检核；每图含 31 个单选标签、5 个多选标签、4 个开放标签、6 个 MOS、8 条文本评论）；(3) 跨三类认知任务的 NeuroAes-Bench 构建（感知：220,696 道选择题；评估：30,000 个 VAD 分数；描述：37,249 道开放题）；(4) 面向技能驾驭（4,822 QA）、SFT（20,000 图、1,021,246 QA）与 GRPO（50,000 QA）的渐进式训练数据系统性构建过程。

### 3.1 摄影美学的可计算分类体系

本文通过将三大神经美学系统功能性映射为可计算维度，设计了面向摄影美学的专门分类体系：

**(1) 感觉-运动系统（Sensory-Motor System）**。该系统被映射为照片的客观视觉与语义属性，分解为**视觉效果**（visual effects，如光线、构图）、**拍摄参数**（shooting parameters，如焦距、对焦）与**语义内容**（semantic content，如主体、事件）。

**(2) 情绪-评价系统（Emotion-Valuation System）**。该维度刻画离散与连续谱系上的情绪反应。首先，用六个离散 Ekman 情绪类别加一个中性状态捕捉**诱发情绪（evoked emotions）**；其次，在连续 VAD 空间中同时量化**审美情绪与诱发情绪**——其中审美效价（aesthetic valence）反映主观视觉吸引力，唤醒（arousal）刻画即时冲击力，支配（dominance）反映叙事清晰度。关键的是，本文显式标注**主导影响因素（dominant influencing factors）**，将这些主观情绪反应锚定到具体的视觉属性上。

**(3) 知识-意义系统（Knowledge-Meaning System）**。整合前述感知与情绪信息，这一最高认知层级产出八维专业摄影批评，涵盖构图、影调、光线、色彩、拍摄技法、情绪表达、整体评价与可操作的前后期处理建议。

### 3.2 数据采集与主观实验

本文从**小红书**与 **PARA** 采集 25,000 张摄影图像，以确保美学多样性。随后使用 Gemini-3-Pro（Google DeepMind, 2025）生成初始的感官与知识标注，再由受训人类标注员核验与修正。在主观情绪评价方面，标注员使用 1–9 级李克特式自我评估人形图（Self-Assessment Manikin, SAM）量表，对每张图像在六个连续 VAD 维度上打分。为防止标注者特异性泄漏，训练集与测试集使用严格不相交的被试池，其中 5,000 张测试图由固定的 15 人评分组专门评价。

### 3.3 主观数据处理与分析

遵循 ITU 推荐的主观数据处理规范，本文对每位被试的评分做 Z 分数变换以降低标注者个体偏差，将标准化分数线性重缩放到 $[0,1]$，再对有效评分取平均得到最终 MOS：

$$
z_{ij} = \frac{r_{ij} - \mu_i}{\sigma_i}, \qquad z'_{ij} = \frac{z_{ij} + 3}{6}, \qquad \mathrm{MOS}_j = \frac{1}{M}\sum_{i=1}^{M} z'_{ij}. \tag{1}
$$

由此得到六个维度上共 150,000 条 MOS 标注，并进一步用于生成专业摄影批评。

> **图 3**：主观情绪标注的统计分析。VAD 分数分布在所有审美与诱发维度上覆盖广泛；相关矩阵证实这些情绪概念内在相关但不冗余；小提琴图显示小红书子集提供了标准数据集（如 PARA）中通常稀缺的高美学数据密度。

如图 3 所示，六个 VAD 分数之间的皮尔逊相关介于 0.46 与 0.80 之间，证实这些情绪概念内在相关却不冗余。此外，整体 MOS 分布揭示了 NeuroAes 广泛的美学覆盖。值得注意的是，小红书子集提供了高密度的高水平摄影作品，缓解了标准图像质量数据集中高美学作品的稀缺性，有利于专家级学习。

### 3.4 基准与训练数据库构建

**NeuroAes-Bench 评测三类互补任务**：

- **感知（Perception）**：将细粒度标注转化为单选与多选题，并使用本文提出的**猜测惩罚准确率（Guessing-Penalty Accuracy）**降低随机猜测的影响。对含 $N$ 个选项的单选题：

$$
S = \begin{cases} 1, & \text{若正确} \\ -\dfrac{1}{N-1}, & \text{若错误} \end{cases} \tag{2}
$$

  多选题得分由选项级准确率计算，并相对随机猜测基线归一化。

- **评估（Assessment）**：直接预测六个连续 VAD 分数，以 SRCC 与 PLCC 相对人类 MOS 评测。

- **描述（Description）**：以基于 LLM 的评判、语义相似度与词汇重叠评测生成的批评，包括 Qwen3.5-35B（Team, 2026）、Gemini-3.1-Pro（Google DeepMind, 2025）、SimCSE、Word2Vec、ROUGE-L 与 METEOR。

**NeuroAes-Data** 被转换为超过一百万条 QA 对用于渐进训练，并为技能驾驭、SFT 与 GRPO 分别提供任务专属子集（构建流水线详见图 2）。

## 4 AesMind：认知美学 MLLM

为将该框架操作化，本文开发了 **AesMind**——一个渐进三阶段的多模态架构，涵盖元认知初始化、知识内化与显式推理诱导，详见以下小节。

> **图 4**：AesMind 的渐进三阶段训练范式。阶段 1 采用技能驾驭初始化元认知系统提示；阶段 2 通过 LoRA 微调内化跨模态摄影知识；阶段 3 通过组相对策略优化（GRPO），由新颖的连续混合回归奖励与类别匹配奖励驱动，诱导显式的"审美思维链"推理。

### 4.1 用于认知初始化的技能驾驭（Skill Harnessing）

为弥合抽象美学概念与模型语言空间之间的语义鸿沟，本文采用技能驾驭方法（Yang et al., 2026a）。使用来自 NeuroAes-Data 的精选 QA 子集与 Gemini-3.1-Pro 作为教师，迭代优化与本文评测分类体系对应的八个认知"技能"。这些优化后的提示引导后续所有训练与推理，确保恰当的认知粒度。

### 4.2 用于知识内化的 SFT

随后，本文在超过一百万条 QA 对上微调 Qwen3.5-9B 主干以实现摄影知识内化。为防止灾难性遗忘，在视觉与文本两个分支上均采用低秩适配（LoRA），同时完整更新视觉-语言融合器（merger）。该监督微调阶段将视觉特征映射到结构化美学标签与专业批评。

### 4.3 用于显式推理诱导的 GRPO

为诱导显式推理并精化连续感知，本文在平衡后的 5 万条 QA 子集上应用组相对策略优化（GRPO）。通过 KL 正则化的双分量奖励系统优化任务专属行为：

**格式奖励（Format Reward）**。$R_{\mathrm{fmt}}^{(i)}$ 确保回复将推理过程封装在 `<think>` 标签内、将结论封装在 `<answer>` 标签内。以负基线初始化以防早期梯度消失；对正确的标签存在、顺序与前缀匹配给予加性奖励，同时惩罚重复与空块。

**混合回归奖励（Hybrid Regression Reward）**。标准阈值或 $\ell_1$ 范数惩罚在连续评估中表现不佳。本文设计了一个平衡全局稳定性与局部精度的混合回归奖励 $R_{\mathrm{reg}}^{(i)}$：

$$
R_{\mathrm{reg}}^{(i)} = \lambda_{\mathrm{base}} \cdot \max(0, 1-\delta) + \lambda_{\mathrm{peak}} \cdot \exp\!\left(-\frac{\delta^2}{2\sigma^2}\right), \tag{3}
$$

其中 $\delta = |s - \hat{s}_i|$。线性**引导区**（$\lambda_{\mathrm{base}}$）防止高误差区间的停滞，而高斯**高精区**（$\lambda_{\mathrm{peak}}, \sigma$）激励细粒度校准。

**类别匹配奖励（Categorical Matching Reward）**。对离散感知，严格文本匹配在正确提取目标时给予高正奖励。本文针对重尾美学属性引入基于先验的对数调整：

$$
R_{\mathrm{cat}}^{(i)} = \begin{cases} \lambda_{\mathrm{match}} + \min\!\big(-\alpha \ln(p_c + \epsilon),\ \gamma\big), & \text{若正确} \\ 0, & \text{否则} \end{cases} \tag{4}
$$

其中 $\lambda_{\mathrm{match}}$ 为基础奖励，$p_c$ 为类别先验，$\alpha$ 为长尾尺度，$\gamma$ 为上限。

**最终奖励** $r_i$ 整合以上分量：

$$
r_i = R_{\mathrm{fmt}}^{(i)} + \mathbb{1}_{\mathrm{reg}} \cdot R_{\mathrm{reg}}^{(i)} + \mathbb{1}_{\mathrm{cat}} \cdot R_{\mathrm{cat}}^{(i)}, \tag{5}
$$

其中指示函数 $\mathbb{1}_{\mathrm{reg}}$ 与 $\mathbb{1}_{\mathrm{cat}}$ 充当**课程门（curriculum gates）**：仅当 $R_{\mathrm{fmt}}^{(i)}$ 超过动态阈值 $\tau$ 时才激活内容奖励，从而强制模型在语义优化之前先掌握输出结构。

## 5 实验

### 5.1 实验设置

本文基于 Qwen3.5-9B（Team, 2026）实现 AesMind，图像分辨率约束在 262,144 至 393,216 像素之间。初始化后，模型经 LoRA（秩 64、缩放因子 128）在两个分支上进行 SFT，峰值学习率为 $2\times10^{-5}$，并完整更新融合器。GRPO 阶段采用生成组大小 4、KL 惩罚 0.04，语言模型与视觉部分分别使用降低的学习率 $1\times10^{-6}$ 与 $5\times10^{-7}$。奖励超参数为 $\lambda_{\mathrm{base}}=0.4$、$\lambda_{\mathrm{peak}}=0.6$、$\sigma=0.05$。本文在严格一致的协议下，对通用模型（如 LLaVA-OneVision、Gemini-Pro）与专用模型（如 Q-Align（Wu et al., 2024）、ArtiMuse（Cao et al., 2025））评测零样本性能。

## 6 结论 + 精读小结

### 6.1 结论（原文翻译）

本文提出了一个以神经美学原则奠基的综合性计算框架，以推进多模态美学推理。**NeuroAes** 提供了一个大规模基准，通过将审美吸引力与诱发情绪显式解耦，将审美认知链操作化。在该分类体系之上，本文开发了经渐进三阶段范式训练的 MLLM **AesMind**。通过整合元认知技能驾驭、结构化 SFT、以及采用新颖连续混合回归奖励的 GRPO，AesMind 有效弥合了客观视觉特征与复杂人类主观性之间的语义鸿沟。大量评测证明了其在多样感知与连续评估任务上的最先进性能，为未来的主观多模态对齐奠定了稳健基础。

### 6.2 精读小结

- **问题定位**：论文直指当前 MLLM 美学评估的两大痛点——评测维度是"启发式拼盘"而非统一理论体系；美学偏好与视觉情绪被割裂处理。以神经美学三系统作为"认知骨架"是全文的理论支点，使"感知→评价→解释"形成可计算的闭环。
- **方法主线**：数据（NeuroAes：细粒度标签 + 双轨 VAD 主观评分 + 八维专业批评）与模型（AesMind：技能提示优化 → LoRA SFT → 连续混合奖励 GRPO）双轮驱动，二者严格同构于三系统分类体系。
- **结果要点**：感知总体 65.36%（基座 42.05%，+23 点）；评估六维全面 SOTA（总体 SRCC 0.6986 / PLCC 0.7261，第二名微调后的 ArtiMuse 仅 0.5332 / 0.5571）；描述任务 LLM 评判与 ROUGE-L/METEOR 均大幅领先；跨数据集（AVA/PARA/TAD66K/FLICKR-AES/ArtiMuse-10K）零样本即与专用模型持平或更好，在"仅 AVA 训练"的严格控制下泛化优势更明显；CogIP-Bench 上 MSE 降幅最大达约 2.6 倍（美学 9.549→3.646）。
- **值得注意的细节**：消融（表 6）显示完整三阶段并非感知任务的峰值（LoRA+GRPO 达 70.53%），完整模型的取舍是"以少量感知精度换取严格最优的连续主观评估"，与论文"主观对齐是核心难题"的立场一致；附录 G 的细粒度分析坦承模型在通用语义（主体/事件识别）上落后于通用模型，存在"特化-通用"权衡。
- **潜在局限（译者观察）**：(1) 描述任务依赖 LLM-as-a-Judge，评判模型本身也是被评模型的同族（Qwen3.5-35B），可能存在同源偏好；(2) 25K 图规模远小于 AVA（255K），靠标注深度换数据广度，跨域（绘画等非摄影域）覆盖有限（TAD66K 上 SRCC 仅约 0.52）；(3) 数据集的类别标签由 Gemini-3-Pro 预标注 + 人工核验，AI 介入较深（论文已在 AI 声明中披露并交叉验证）；(4) 通用语义能力的小幅退化提示此类特化训练存在代价。

### 6.3 论文声明要点（AI 使用 / 伦理 / 可复现性）

- **AI 使用声明**：生成式 AI 用于合成数据集（基于人类 MOS 构建细粒度美学标注与结构化文本批评）与润色写作；**未**用于提出核心理论主张、开发主要算法框架或建立实证方法。AI 生成的数据标注已与人类感知真值交叉验证以防幻觉；AI 润色文本经作者逐段检查编辑，作者对全部内容负责。
- **伦理声明**：图像来自公开可访问存储库，已确保不暴露个人身份信息或攻击性内容；MOS 采集遵循众包伦理规范，保证标注者匿名与合理报酬。作者强调美学与情绪评价本质上是主观、文化情境化的，强烈警示不应将此类模型用作艺术价值的绝对裁判，否则可能边缘化少数美学表达或强化主流文化偏见，并鼓励未来研究探索文化多样与个性化的美学对齐。
- **可复现性声明**：三阶段全部超参数、系统提示、分类体系与奖励公式均完整记录于附录；补充材料含匿名源码与数据子集；录用后将完整开源 NeuroAes 数据集、NeuroAes-Bench 评测套件与 AesMind 全部模型权重。

### B 理论基础与认知分类体系

- **审美三联体（aesthetic triad）**（图 5，改绘自 Chatterjee & Vartanian, 2014）：感觉-运动系统处理基本视觉特征与感知机制的自动加工；情绪-评价系统统辖审美遭遇的情绪与奖励面向；知识-意义系统通过文化背景、专业知识与语义解释为体验赋予情境。**重要限定**：NeuroAes 将该三联体严格用作**功能性与计算性的组织蓝图**，并不声称直接测量或模拟生物神经活动。
- **审美情绪理论**（Menninghaus et al., 2019）：日常情绪由实用相关性、目标促进性或语义现实触发；审美情绪则源于对对象感官、形式与风格品质的评价，指向艺术执行与表现力，最终汇聚为审美愉悦/不悦。核心命题：**审美情绪源自对"形式与执行"的认知评价而非仅是"内容"**——因此一张构图精湛的悲剧题材照片可以同时具有低诱发效价与高审美效价。显式解耦二者可缓解内容诱导偏差、生成更客观细腻的美学评估。
- **审美 VAD 的操作化**（表 7）：审美效价=视觉吸引力与审美愉悦程度；审美唤醒=视觉冲击与震撼强度的即时性；审美支配=摄影意图与视觉叙事的清晰度。通过描述性指南与视觉锚点示例保证标注一致性（例：光线构图卓越但场景宁静的风景照应得高审美效价、中低审美唤醒）。
- **分类体系构建**（表 8）：与职业摄影师和认知科学家反复咨询迭代而成，严格遵循"客观感知→主观评价→语义解释"的认知递进。完整层级含单选/多选/开放标签、连续 VAD 分数与文本批评：感觉-运动系统分为**效果**（效果评价、拍摄角度、运动状态、光线、色彩、曝光、影调、画质、构图——如影调含全影调/高长调/中长调/低长调等 10 档）、**拍摄**（景别、焦距、构图方向、对焦）、**语义**（主题、人物、时间、地点、事件）；情绪-评价系统含审美 VAD×3 + 诱发 VAD×3 + 离散情绪标签 + 主导美学/情绪因子；知识-意义系统为八维专业批评（构图设计、影调质量、光线美学、色彩表现力、整体评价、技术执行、情绪表达、前后期处理建议）。

### C 与现有美学数据集的对比（表 9）

NeuroAes（摄影 25,000 图，每图 40 个标签，8 维文本批评，情绪"分数+标签+文本"，支持 PIAA）以**标注粒度换体量**：较 AVA（255K 图但仅 0–2 个标签）、PARA（4 标签）、KonIQ-10K（仅分数）等共识驱动的大体量数据集更细；较 ArtEmis/APDDv2/ArtiMuse-10K 等情感或批评数据集更系统。独家保留**个体评分者原始主观评分 + 人口学画像 + 大五人格**，原生支持个性化图像美学评估（PIAA）研究。

### D 数据构建与标注

- **图像采集**：小红书高质评论图 12,500 张（附带专业长文美学分析，先验知识丰富）+ PARA 随机采样 12,500 张（自带多维元数据、拉平美学分布），合计 25,000 张；两来源在训练/测试划分（20K/5K）中均匀分布。
- **主观评分协议**：招募 50–60 名参与者（以大学生为主），实验前统一培训并提供各维度视觉锚点；自研 GUI 上以 9 点 SAM 量表逐维度评分；每图由 15 名不同参与者独立标注。**零泄漏划分**：5,000 张测试图由与训练集完全隔离的固定 15 人组专门标注。**个性化画像**：采集性别、出生日期、籍贯、教育、艺术经验、摄影水平、MBTI 与大五人格分数（表 10 为示例），并对参与者做色觉筛查，刻意保留 1–2 名红绿色盲参与者以支持未来的色盲人群美学探索。评分后经基于 Z 分数的离群剔除，取均值得到每图 6 个 MOS。
- **人机协同标注流水线**：(1) **类别标签预标注**——Gemini-3-Pro 以严格约束 JSON 提示做零样本预标注，输出强制对齐固定词表；(2) **人工核验**——专用核验界面（单选/多选/开放/构图四类，图 8）由受训志愿者纠错并归一化词表；(3) **连续主观分数**——严格来自人类主观实验，MOS 进一步作为条件输入生成衍生离散情绪标签（提示词要求模型同时依据图像与六个 MOS 值输出情绪标签、风格氛围、主导因子）；(4) **文本批评生成**——Gemini-3-Pro 同时接收原图、人工核验标签、小红书/PARA 元数据与长文评论，按"视觉内容最高优先（标签/元数据与视觉冲突时以视觉为准）→ 结构化标签为技术基础 → 人类评论为参考（冲突须纠正，缺失须自主推导）"的信息优先级生成八维 JSON 批评，每维附 0–100 置信度，并给出三个少样本风格示例（含一个允许负面批评的示例）。

### E 基准构建与训练数据制备

- **问题构造**：单标签→单选题；多标签→多选题；分数标签（离散化连续属性）→三档单选题；开放标签→同主题内其他图像的开放标签充当语义干扰项的单选题（防语义捷径）。
- **评测准则**：感知用猜测惩罚准确率（多选题按选项级正确比例、以 0.5 随机基线线性拉伸）；评估用 SRCC/PLCC；描述用六项指标——LLM-as-a-Judge（Qwen3.5-35B 与 Gemini-3.1-Pro 独立评判，完整性/准确性/相关性各 0–2 分）、**确定性长度敏感简洁度分数**（式 6：生成词数在真值词数的 $2/3$–$2\times$ 区间内得 2 分，$1/3$–$2/3$ 或 $2\times$–$4\times$ 得 1 分，否则 0 分——因 LLM 对"简洁性"直接打分不敏感而专门设计）、总描述分 $S_{\mathrm{desc}} = \frac{1}{2}\cdot\frac{1}{4}(S_{\mathrm{comp}}+S_{\mathrm{prec}}+S_{\mathrm{rele}}+S_{\mathrm{conc}})$（式 7），以及 SimCSE/Word2Vec 语义相似度与 ROUGE-L/METEOR 词汇重叠。附完整 LLM 评判提示词。
- **训练数据**：每个标注维度设 5 个问题模板，随机切换 + 选项顺序随机化 → SFT 语料超 100 万 QA 对；GRPO 训练集严格过滤为单选题与分数题，并做正确选项索引均衡（防位置偏差）；技能驾驭阶段为 8 个元技能（感知选择 1 + 描述批评 1 + 六个 VAD 分数技能）从全局 SFT 数据均匀随机采样（表 11：如感知选择训练 2,404 QA/评估 601 QA；各 VAD 技能训练 800 QA/评估 500 QA 等）。

### F 方法与实现细节

- **技能驾驭**：双模型框架——元优化器（Gemini-3.1-Pro，具备显式推理能力，分析目标模型失败案例并提出迭代改进）+ 目标模型（未微调 Qwen3.5-9B，分布式推理执行）。提示编辑采用 **patch 模式**（类似软件调试，只改具体指令而非整篇重写）；**验证门机制**保证单调改进（更新的技能只有在完整验证集上门指标（离散准确率/SRCC/LLM 奖励）超过此前最佳才被永久接受）。最优的 8 个技能被提取并冻结，作为 SFT、GRPO 与最终推理的永久系统提示。附录给出全部 8 个技能全文，要点：**感知选择技能**含 16 条细则（严格只输出选项、整体评估混合属性、主体/主事件聚焦、主观量表倾向适度档、季节缺乏证据时判 uncertain、人口学推断不轻易 uncertain、长曝光光轨视为动态、以阴影判光向光质等）；**描述技能**要求单段 2–3 句 50–80 词、直接切入、专业术语密集；**六个 VAD 评分技能**各自内置校准锚点（如审美效价均值约 0.45、0.60 以上仅留给专业级 flawless 图像；审美唤醒关注"第一眼冲击强度"而非愉悦感；情绪唤醒与效价正负无关等），并强制 `<think>`→`<answer>` 输出格式与防提示复读指令。
- **SFT**：输入序列为 `<image>` + [优化技能] + [问题]，直接映射到真值目标（标准自回归交叉熵）；该阶段**不生成中间 `<think>` 推理步骤**（高效固化显式知识，但需要后续 GRPO 做深层认知对齐）。架构上冻结视觉编码器与 LLM 核心参数，在两分支全部 Attention/MLP 投影层注入 LoRA（r=64, α=128, dropout=0.05），视觉-语言融合器全参数可训练。
- **GRPO 实例化**：格式奖励基线 **−0.2**（保证全错组内非零方差、防梯度消失）：四类结构标签各 +0.1、全部严格按序 +0.3、答案块含精确属性前缀 +0.3（泛用冒号分隔 +0.1）；300 步后启用严格惩罚（重复标签 −0.02、块外冗余文本 −0.05、推理内容异常简短（<5 字符）−0.05）。内容奖励全局放大 2.0 倍以在格式掌握后主导总奖励：混合回归 $\lambda_{\mathrm{base}}=0.4$、$\lambda_{\mathrm{peak}}=0.6$、$\sigma=0.05$；类别匹配 $\lambda_{\mathrm{match}}=0.8$、$\alpha=0.1$、$\gamma=0.7$，精确串提取失败但真值串全局存在时给 0.1 兜底奖励。**课程门**（式 8）：$\tau=0.4$（$t<200$，要求标签齐全且顺序正确）→ $\tau=0.2$（$t\ge 200$，仅要求标签存在），实现"先结构、后语义"。采样配置：50,000 条均衡 QA，每提示 $N=4$ 个 rollout，温度 0.9、top-k 50，token 级 KL 正则系数 0.04，生成长度上限 512。
- **训练配置汇总（表 12）**：技能阶段用 4 个 vLLM worker（优化器为 Gemini-3.1-Pro）；SFT 用 4×A100 + DeepSpeed ZeRO-2（峰值 LR $2\times10^{-5}$，余弦调度，warmup 0.03，权重衰减 0.1，全局批 64，bf16，图像分辨率 $256\times32^2$ 至 $384\times32^2$ 像素）；GRPO 用 8×A100 + ZeRO-3，**丢弃 LoRA、全参数微调整个多模态架构**（LM LR $1\times10^{-6}$、视觉/融合器 LR $5\times10^{-7}$，全局批 8 提示（32 rollout），最大生成 512 token）。SFT 与 GRPO 全程保持相同的动态图像分辨率与视觉 token 密度以保障特征对齐。

### G 附加结果与对比

- **细粒度感知（表 13/14）**：AesMind 在感觉-运动维度全面碾压——光源 0.8419、曝光 0.8455、对焦 0.9380、构图方向 0.9418，常为通用模型（Gemini-3-Pro、InternVL 系）两倍以上，佐证物理级摄影技术理解的习得。**通用语义的短板**：主体识别 0.4731、事件 0.4973，小幅落后于 LLaVA-OneVision-1.5-8B（0.5776/0.6465），"地点""人数"等维度基座模型亦有优势——反映"结构美学特化 vs. 广域语义/计数"的已知权衡。**认知系统间方差**：客观感知任务分数很高，但离散情绪任务绝对分数中等（如审美唤醒 0.3004、诱发效价 0.3181；虽仍全面第一、基线常难超随机线 0.0），印证"主观情绪的离散化分类本质上难于客观几何识别"，从而论证连续 VAD 评估任务的必要性。
- **描述定性分析（图 11/12）**：与基线相比，AesMind 产出结构化、极简洁、分析犀利的八维批评——例如对工业烟囱图指出前景植被"过密而无序，构成视觉阻碍而非引导"；对失焦的面条特写直接判定"物理性模糊无法以后期挽救，唯一建议是重拍"（而 ArtiMuse/Gemini-3-Pro 给出锐化、白平衡等一长串对物理模糊无效的后期清单）。
- **未见真实样例（图 13/14、图 9/10）**：完整数据样例（含三系统全部结构化标签、6 个 MOS、八维批评 JSON）与 NeuroAes-Bench 全部任务形式清单（约 40 个感知问题模板 + 6 个评估提示 + 8 个描述提示）一并列出；在完全未见的花田、书架等真实照片上，AesMind 仍给出专业级评价（指出广角透视畸变、直方图偏左、主体不突出等缺陷并给出二次裁剪、局部提亮、白平衡校正等具体建议）。

## 创新点提炼

1. **神经美学三系统的首次系统性计算操作化**。将 Chatterjee & Vartanian 的"审美三联体"（感觉-运动/情绪-评价/知识-意义）从生物学理论转化为摄影美学的可计算层级分类体系（3 核心维度、18 类、37 子类、168 个细粒度标签），并明确将其定位为"功能性组织蓝图"而非神经活动模拟——为长期依赖启发式维度拼盘的 IAA 评测提供了统一认知理论基础，形成"感知属性→情绪评价→专业批评"的完整可学习认知链。

2. **审美情绪 vs 诱发情绪的双轨解耦，及"审美 VAD"的首次操作化标注**。把传统上只用于"内容诱发情绪"的 VAD 连续空间扩展出针对"摄影执行本身"的审美 VAD 三维（效价=视觉愉悦、唤醒=即时冲击、支配=叙事清晰），使数据集能表达"拍得极好的悲剧题材"这类正交情感状态；跨数据集实验（含仅 AVA 训练的严格设定）证明该解耦产出的是通用而非数据集特异的情感表示——这是CogIP-Bench 上 MSE 大幅下降的直接原因。

3. **NeuroAes："深度换体量"的数据集设计 + 原生 PIAA 支持**。25K 图（小红书高美学密度子集 + PARA 广谱质量子集）× 每图 40 标签、6 个 MOS（15 人独立评分、Z 分数标准化、零泄漏评分者池）、8 条专业批评；总量 120 万+标签、225 万人类评分、100 万+ QA 对。同时独家保留每位评分者的原始评分与人口学/MBTI/大五人格画像（甚至刻意保留色盲被试），使个性化美学评估（PIAA）无需重新收集数据即可开展。

4. **Skill→SFT→GRPO 渐进三阶段范式，认知初始化先于参数更新**。第一阶段在不动任何权重的情况下，用元优化器（Gemini-3.1-Pro）以 patch 式编辑 + 验证门机制迭代搜索 8 个任务技能的系统提示（失败案例驱动、单调改进保证），把"提示工程"升级为可复现的优化过程；第二阶段以 LoRA（r=64, α=128）注入 + 全训练融合器的 SFT 内化跨模态知识；第三阶段丢弃 LoRA、全参数 GRPO 激活显式 `<think>/<answer>` 推理——三个阶段职责清晰、前后依赖明确（消融显示 SFT 是 GRPO 的强制前提）。

5. **面向连续主观回归的混合奖励 GRPO 设计（式 3–5、8）**。这是把 GRPO 从"离散答案正确性"扩展到"连续情绪分数校准"的关键发明：混合回归奖励以"线性引导区（$\lambda_{\mathrm{base}}\max(0,1-\delta)$）+ 高斯高精区（$\lambda_{\mathrm{peak}}e^{-\delta^2/2\sigma^2}$）"双区结构，兼顾高误差区不停滞与低误差区细校准（直击阈值/ℓ1 惩罚的缺陷）；类别匹配奖励以类别先验对数项 $\min(-\alpha\ln(p_c+\epsilon),\gamma)$ 平衡重尾美学属性；$\mathbb{1}_{\mathrm{reg}}/\mathbb{1}_{\mathrm{cat}}$ 指示函数与动态阈值 $\tau$（0.4→0.2 的课程门）强制"先掌握输出结构、再优化语义内容"，避免早期策略崩溃。
