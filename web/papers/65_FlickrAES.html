<script type="text/markdown" id="zhSrc"># 《Personalized Image Aesthetics》中文精读翻译

## 论文信息

- **英文标题**：Personalized Image Aesthetics
- **中文标题**：个性化图像美学
- **作者**：Jian Ren¹、Xiaohui Shen²、Zhe Lin²、Radomír Měch²、David J. Foran¹（¹ Rutgers University；² Adobe Research）
- **发表**：ICCV 2017（Proceedings of the IEEE International Conference on Computer Vision, pp. 638–647；无 arXiv 版本，经 CVF Open Access 官方渠道获取：<https://openaccess.thecvf.com/content_ICCV_2017/papers/Ren_Personalized_Image_Aesthetics_ICCV_2017_paper.pdf>）
- **提出的资源与方法**：FLICKR-AES 数据集（40,000 张 Flickr 图像、210 位 Amazon Mechanical Turk 标注者、每图 5 人评分取均值为真值，约 20 万条带评分者身份的美学评分）；REAL-CUR 数据集（14 位真实用户的个人相册，由相册主人亲自评分）；个性化美学模型 PAM（Personalized Aesthetics Model，基于残差的模型适配方案）与主动学习算法 Active-PAM
- **领域定位**：图像美学评估（Image Aesthetics Assessment）→ 个性化图像美学（Personalized Image Aesthetics）方向的开创性工作，首次系统实证"美学是个人化的"这一命题

## 一句话核心总结

本文首次把"图像美学是高度个人化的"这一命题作为独立研究问题加以系统实证与求解：通过构建带评分者身份的 FLICKR-AES（4 万张图像、210 位标注者）与真实用户相册 REAL-CUR 两个数据集，证明个体审美偏好（用户评分相对通用均分的残差）与图像的内容属性及美学属性显著相关、因而是可预测的，并据此提出基于残差适配的个性化美学模型 PAM（通用美学 CNN + 属性/内容紧凑特征 + SVR 残差回归）与主动学习算法 Active-PAM，每位用户仅需 10–100 张标注图像即可有效学习其个人审美。

---

## 摘要

自动图像美学评分（automatic image aesthetics rating）随着深度学习近期的突破而受到日益增长的关注。尽管已有大量面向通用（generic）或普适（universal）美学模型的学习研究，但对融入个体用户偏好的美学模型的探索仍相当有限。本文通过证明"个体的美学偏好与内容及美学属性表现出强相关性，因而个体感知相对通用图像美学的偏离是可预测的"，来处理这一个性化美学（personalized aesthetics）问题。为支撑本研究，我们首先收集了两个不同的数据集：一个来自 Flickr 并由 Amazon Mechanical Turk 标注的大型图像数据集，以及一个小型的、由相册主人亲自评分的真实个人相册数据集。随后，我们提出一种新的个性化美学学习方法，即使仅使用来自某用户的一小组标注图像也能完成训练。该方法基于一种残差式模型适配方案（residual-based model adaptation scheme），学习一个偏移量（offset）来补偿通用美学分数。最后，我们提出一种主动学习（active learning）算法，面向真实应用场景优化个性化美学预测。实验表明，我们的方法能够有效学习个性化美学偏好，并在定量比较中优于现有方法。

---

## 1 引言

自动图像美学评估是一个重要问题，在图像搜索、创意推荐、照片排序与个人相册整理（album curation）等诸多场景中都有应用 (Lu et al., 2015; Marchesotti et al., 2015)。这是一项具有挑战性的任务，需要对图像中的摄影属性与语义内容具备高层理解。直到最近，得益于能够从数据中有效学习此类高层信息的深度学习的发展 (Lu et al., 2014; Lu et al., 2015; Wang et al., 2017)，该领域才取得显著进展。尽管已经提出了许多成功的基于深度学习的通用美学分类器，但在学习用户专属（user-specific）美学模型上的努力仍相当有限。

众所周知，图像美学评分是一个高度主观的任务，因为个体用户的视觉偏好差异极大。这一点在早期基于规则的照片排序系统中已被观察到 (Vessel et al., 2014; Yeh et al., 2014; Yeh et al., 2010)。例如，图 1 展示了示例图像及五位不同用户在仔细阅读评分说明后给出的美学分数（1 到 5 分）。可以看到，不同用户对同一图像的评分可能差异巨大。这是预料之中的，因为不同用户对图像的摄影属性（构图、光照、色彩）或语义内容（人像、风景、宠物）可能持有非常不同的看法。因此，学习个体用户的视觉偏好是图像美学研究下一个关键步骤。

> **图 1**：展示个人美学偏好的示例。每张图像由 5 位不同用户评分。可以看到，在第一个示例中各用户评分较为一致；而在另外两个示例中，不同用户表现出截然不同的视觉品味。个体用户在评判图像美学质量时，可能对图像的视觉属性或内容有其独特的偏好。

我们把这一问题称为**个性化图像美学（personalized image aesthetics）**，并致力于通过为个体用户的偏好适配一个通用美学模型来解决它。然而，这是一项具有挑战性的任务，因为我们通常需要从每个用户非常有限的标注样本中学习这种偏好。例如，在照片整理软件中，人们希望尽量减少用户的标注工作量；此类应用中的一种有效策略是利用主动学习（active learning），自动挑选有代表性的图像并推荐给用户评分。

若要以基于学习的方式来研究该问题，需要一个带有评分者身份（rater's identities）信息的标注数据集用于训练与评估。现有美学数据集并不合适：它们要么没有评分者身份 (Murray et al., 2012)，要么规模有限 (Kang et al., 2014)。为此，我们引入两个专门为该任务定制的新数据集：(1) **Flickr 图像美学标注数据集（Flickr Images with Aesthetics Annotation Dataset, FLICKR-AES）**，包含 40,000 张 Flickr 图像，由 210 位不同的 Amazon Mechanical Turk（AMT）标注者标注；(2) **真实相册整理数据集（Real Album Curation Dataset, REAL-CUR）**，包含 14 位真实用户的个人相册，美学分数由相册主人提供。

为学习典型用户的平均美学偏好 (Bronstad and Russell, 2007; Kaplan and Kaplan, 1989)，我们首先使用规模较大的 FLICKR-AES 数据集训练一个强大的通用美学预测模型，其表现与最新技术水准相当。然后，我们提出一种新颖的个性化图像美学方法，将通用模型适配到个体用户。为应对来自单个用户的标注样本数量有限的问题，我们采用一种残差式模型适配方案，其设计目标是为每个用户学习一个相对于通用美学分数的标量偏移。

受那些同时利用美学属性与内容信息来提升通用美学评分性能的研究 (Dhar et al., 2011; Luo et al., 2011; Murray et al., 2012) 启发，我们研究了适用于个性化美学学习的特征表示，并观察到：为通用美学预测、美学属性分类以及语义内容分类而训练的特征，对学习个性化图像美学模型都十分重要。我们还在实验中进一步表明，采用这种组合特征表示的个性化美学模型显著优于现有的基于协同过滤的方法。

最后，我们面向交互式相册整理等真实应用场景提出一种主动个性化美学学习算法。结果表明，与以往文献中典型的基于主动学习的方法相比，我们的方法表现更优。

我们的主要贡献有三：

- 我们确立了**个性化图像美学**这一问题，并引入两个新数据集以推动该方向的研究；
- 我们系统分析了用户评分与图像内容/属性之间的相关性，并提出一种新颖的、采用残差式模型适配方案学习个性化图像美学模型的方法；
- 我们提出一种面向真实图像搜索与整理应用的主动个性化图像美学学习算法。

## 2 相关工作

### 2.1 美学质量估计（Aesthetic Quality Estimation）

早期关于图像美学预测的研究主要聚焦于从图像中提取手工设计（hand-crafted）的视觉特征，并通过训练分类器或回归器将这些特征映射到标注的美学标签 (Dhar et al., 2011; Ke et al., 2006; Luo et al., 2011; Marchesotti et al., 2011)。随着 AVA (Murray et al., 2012) 等大规模美学分析数据集的出现，借助深度学习技术的自动美学分析取得了显著进展 (Kong et al., 2016; Lu et al., 2014; Lu et al., 2015; Wang et al., 2016)。在 (Lu et al., 2014; Lu et al., 2015) 中，作者表明使用原始图像的图像块（patches）能持续提升美学分类的准确率；Mai et al. (2016) 提出带自适应空间池化（adaptive spatial pooling）的端到端模型，无需任何裁剪即可直接处理原始图像；Kong et al. (2016) 通过融入图像的美学属性与内容信息探索了新的网络架构。然而，所有这些工作都聚焦于学习通用美学模型。

### 2.2 个性化预测（Personalized Prediction）

协同过滤（collaborative filtering）是推荐与学习个性化偏好的流行算法，矩阵分解（matrix factorization）是其中大多数方法的基础 (He and McAuley, 2016; Koren et al., 2009; Lee and Seung, 2001)。基于矩阵分解的方法严格局限于已被若干用户评分过的既有物品，无法用于为用户预测/推荐新物品。为克服这些局限，已有若干改进被提出：例如，Rothe et al. (2015) 为矩阵分解引入视觉正则化，将新的图像查询回归到隐空间；O'Donovan et al. (2014) 则提出新颖的基于特征的协同过滤，将新物品的特征变换为隐向量。尽管如此，这些方法都假设不同用户评分的物品之间存在相当程度的重叠。而在个性化图像美学中，各用户评分的物品集合未必重叠——例如在照片整理中，每个用户只给自己的照片评分。一些早期的照片排序工作 (Yeh et al., 2014; Yeh et al., 2010) 在排序算法中纳入了用户反馈，但那是以临时性（ad-hoc）的方式调整特征权重，而非从数据中学习。

### 2.3 主动学习（Active Learning）

主动学习（active learning）是一种提升学习效率的有效方法：从无标注样本池中选择最具信息量的子集作为训练数据。不确定性大的样本更可能被选中，随后收集其真值用于更新模型。然而，多数主动学习方法处理的是分类问题 (Schohn and Cohn, 2000; Settles, 2010; Tong and Koller, 2001)，而本文的模型旨在预测连续的美学分数，问题被形式化为回归（regression）。现有的主动分类方法无法直接适用于我们的问题，因为在支持向量回归等回归方法中，评估无标注样本的不确定性并非易事；此外，还存在选中无信息量样本、从而推高标注成本的风险 (Demir and Bruzzone, 2014; Willett et al., 2005)。也曾有少数将主动学习应用于回归问题的尝试：Burbidge et al. (2007) 选择由集成学习算法生成的多个回归器之间分歧（disagreement）最大的无标注图像；Demir and Bruzzone (2014) 提出多准则主动学习方法（multiple criteria active learning, MCAL），利用训练样本的多样性与无标注样本的密度。本文引入的主动学习方法与这些工作的不同之处在于：我们定义了一个目标函数来选择无标注图像，同时考虑与个性化美学直接相关的图像多样性与信息量。

---

## 3 数据集

**FLICKR-AES**。我们从 Flickr（https://www.flickr.com）下载了 40,000 张带知识共享（Creative Commons）许可的照片，并通过 Amazon Mechanical Turk（https://www.mturk.com）收集它们的美学评分。原始美学分数范围为 1 到 5，表示从最低到最高的美学水平。每张图像由 5 位不同的 AMT 工作者评分，其真值美学标签近似为这五个分数的平均值。共有 210 位 AMT 工作者参与了 FLICKR-AES 的标注。

我们将数据集划分为训练集与测试集。具体地，选取由 37 位 AMT 工作者标注的 4,737 张图像纳入测试集，每位测试工作者标注的照片数介于 105 到 171 张之间（平均 137 张）；其余由另外 173 位工作者标注的 35,263 张图像全部纳入训练集，并用于训练通用与个性化美学模型。在这一划分下，我们验证了测试集中不包含任何由训练集工作者标注过的图像，反之亦然。这使我们能够模拟真实应用场景：每位用户只对自己的照片提供评分，而算法事先无法访问这些照片与评分。与现有的带评分者身份的美学数据集 (Kong et al., 2016) 相比，FLICKR-AES 是一个大得多、也更全面的数据集，其内容覆盖更多样、更均衡。

**REAL-CUR**。在 FLICKR-AES 中，美学评分由 AMT 工作者提供，而非数据集中照片的真实主人。为了在真实世界的个人照片排序与整理应用语境下进行测试，我们收集了另一个数据集：由 14 个个人相册（全部来自不同的人）及相册主人提供的美学评分构成。每个相册的照片数为 197 到 222 张，平均 205 张。由于每张照片只有一个用户的评分，我们让每位用户多次浏览自己的相册，以使评分保持一致。据我们所知，这是首个由真实用户为自己的照片提供美学评分的美学分析数据集。

---

## 4 用户偏好分析

个体用户的偏好相对通用美学感知有多显著？这些偏好与图像属性有什么关系？为回答这些问题，我们使用 FLICKR-AES，在个体用户评分与多种图像属性之间进行如下相关性分析。

图像有许多可能影响用户美学评分的性质或属性。其中，我们选择内容属性（content attributes，语义类别）与美学属性（aesthetics attributes，如三分法、对称性）——它们是美学分析中被探索得最多、且被证明对预测图像美学质量有效的线索 (Dhar et al., 2011; Luo et al., 2011)。如何提取这些属性的细节见第 5.1 节。

我们从训练集中选取标注了至少 172 张图像（平均 1,550 张）的 111 位 AMT 工作者，将其视为个体用户。对每位用户，为度量其偏好与内容/美学属性之间的相关性，我们使用 Spearman 秩相关系数（Spearman's rank correlation）$\rho$ (Myers et al., 2010)：

$$
\rho = 1 - \frac{6\sum_{i=1}^{N}(r_i - r_i')^2}{N^3 - N},
$$

其中 $r_i$ 为将第一个度量给出的分数按降序排序时第 $i$ 个样本的秩，$r_i'$ 为第二个度量给出的分数对应的秩。$\rho$ 的取值范围为 −1 到 1，绝对值越高表示两个度量之间的相关性越强。

直接度量用户的绝对美学分数与图像属性之间的相关性，无法正确反映用户的偏好，因为此时的相关值会被每张图像的平均评分所主导。因此，我们计算用户分数相对真值（平均）分数的偏移（offset，或残差 residual），转而度量偏移值与图像属性之间的相关性。我们随机选取 8 位 AMT 工作者，结果展示于图 2a：深红色表示该用户偏好这些属性，深蓝色表示该用户对具有这些属性的图像给出的评分相对更低。可以清楚看到，每位用户的评分（相对于图像属性）的偏离模式都是独一无二的。我们进一步在图 2b 中可视化 Worker1 与 Worker4 评分的示例图像：可以看到，Worker1 偏好风景图像、而非人群图像；而 Worker4 偏好含对称属性的图像、而非人物图像。

> **图 2**：(a) 随机选取的 8 位 AMT 工作者与 2 个"随机"用户的偏移量与图像属性之间的排序相关性。(b) 第一行：Worker1 评分的示例图像——该用户倾向于给风景打比平均分更高的分、给人群场景打比平均分更低的分；第二行：Worker4 评分的示例图像——该用户倾向于给含对称属性的图像更高分、给人物场景更低分。

为理解用户标注的相关性相对于随机性的显著程度，我们另外构造两个"随机"用户作为基线：从训练集中随机采样 1,000 张图像作为其标注图像；每张图像的分数设为真值分数（即五位 AMT 工作者的平均评分）加上零均值高斯随机噪声，标准差分别为 0.2 与 2。选择这两个标准差，是为了模拟两个"平均"用户——其标注相对通用分数的偏移量一个较小、一个较大。它们偏移量与属性的相关性同样绘制在图 2a 中，如预期那样未表现出任何统计上有意义的偏好。与"随机"用户相比，真实用户的相关性强得多，说明其偏好确实与内容和美学属性相关，而非随机偏差。

对每位用户，我们还计算相关性的绝对值之和，并将该值与两个随机用户比较。实验重复 50 次，并对两个"随机"用户报告平均值。我们发现，全部 111 位真实用户的平均相关性分数都高于"随机"用户，说明这些相关性具有统计意义。

该分析表明，分数偏移（残差）是揭示用户在内容与美学属性上的审美偏好的非常有效的线索。受此启发，我们在下一节推导一种新颖的基于残差（偏移）的个性化美学学习模型。

---

## 5 方法

本节首先介绍我们提出的、通过将通用美学模型适配到个体用户来学习个性化美学模型的方法，随后推导面向真实照片整理应用的主动学习算法。

> **图 3**：所提出的基于残差的个性化美学模型概览。

### 5.1 个性化美学模型（PAM）

在真实世界的照片排序与整理应用中，用户往往只对自己的照片提供非常有限的美学评分或反馈。标注样本的缺乏使得从零开始训练一个有意义的个性化美学模型十分困难。传统基于推荐的方法（如协同过滤）可能并不很有效，因为它们要求不同用户评分的物品之间存在显著重叠；而在照片整理应用中，用户-物品矩阵可能过于稀疏，难以学到有效的隐向量 (O'Donovan et al., 2014)。

为了学得一个泛化能力好的有效个性化模型，我们的目标是：不仅捕捉个体之间共享的共性审美偏好 (Bronstad and Russell, 2007)，也捕捉每个个体的独特审美偏好 (Vessel et al., 2014; Yeh et al., 2014)。遵循这一思路，我们利用训练来预测"平均用户"评分的通用美学模型，把个性化美学学习聚焦于建模个体美学分数相对通用美学分数的偏离（残差）。具体流程为：我们首先在 FLICKR-AES 训练集上、以平均评分为真值美学分数，训练一个通用美学模型；然后，对每位用户评分过的示例集合，用通用模型计算集合中每张图像的通用分数，并求用户评分与通用分数之间的残差分数；最后，训练一个回归模型 (Chang and Lin, 2002) 来预测残差分数。方法概览见图 3。

#### 通用美学预测（Generic Aesthetics Prediction）

近期研究 (Kong et al., 2016; Lu et al., 2014; Lu et al., 2015) 已在基于深度学习的通用图像美学预测上取得可喜成果。受这些工作启发，我们训练一个深度神经网络来预测通用美学分数。其架构与 (Ioffe and Szegedy, 2015) 中的网络相同，只是我们裁剪了倒数第二层的神经元数量——我们发现这使得训练更高效、精度更好。我们像 (Kong et al., 2016) 那样测试了不同损失函数的组合，但实验发现，仅使用欧氏损失（Euclidean loss）在我们的数据集上效果最佳。我们还验证了：我们的通用模型在 Kong et al. (2016) 的 AADB 数据集上取得了与其近期最优结果相当的性能。

#### 面向个性化美学的残差学习（Residual Learning for Personalized Aesthetics）

有了通用美学分数，我们用每位用户的评分减去通用分数，即可得到示例图像的残差分数（偏移）。于是我们的目标简化为：学习一个回归器，为任意新图像预测残差分数。由于每位用户的标注样本不足，直接从图像本身训练这样的回归器并不现实。因此，我们提出使用与图像美学相关的高层图像属性，构成面向残差学习的紧凑特征表示。借鉴以往面向通用美学自动评估的研究 (Dhar et al., 2011; Kong et al., 2016; Lu et al., 2014; Luo et al., 2011; Marchesotti et al., 2015; Murray et al., 2012)，我们同时考虑美学属性与内容属性。

给定上述特征，我们简单地使用带径向基函数（RBF）核的支持向量回归器（support vector regressor）来预测残差分数，如式 (1) 所示：

$$
\min \; \frac{1}{2} w^T w + C\left(\nu\epsilon + \frac{1}{l}\sum_{i=1}^{l}(\xi_i + \xi_i^{*})\right) \tag{1}
$$

$$
\begin{aligned}
\text{s.t.}\quad & (w^T\phi(x_i) + b) - y_i \le \epsilon + \xi_i, \\
& y_i - (w^T\phi(x_i) + b) \le \epsilon + \xi_i^{*}, \\
& \xi_i, \xi_i^{*} \ge 0, \; i = 1, \ldots, l, \; \epsilon \ge 0.
\end{aligned}
$$

其中 $x_i$ 为美学属性特征与内容特征的拼接，$y_i$ 为目标偏移值，$C$ 为正则化参数，$\nu$（$0 < \nu \le 1$）控制支持向量数量占训练图像总数的比例。特征向量 $x_i$ 的细节在下文讨论。

#### 面向个性化美学的特征表示（Feature Representation for Personalized Aesthetics）

**美学属性特征**。我们首先利用现有的 AADB 数据集 (Kong et al., 2016)——它包含约 10,000 张图像，标注了十个美学属性³——来训练我们的美学属性特征。由于 AADB 提供的训练图像数量有限，我们以已训练好的通用美学网络作为预训练模型，通过多任务训练（multi-task training）进行微调：即在 AADB 上做属性预测、同时在 FLICKR-AES 上做美学预测。属性预测与美学预测均使用欧氏损失；同时固定通用模型的所有靠前层，仅微调其最后一个共享 inception 层与各预测层。得到微调后的网络后，我们将其 10 维响应作为美学属性特征向量 $f_{\mathrm{attr}}$。实验表明（表 1），我们联合训练的网络的属性预测性能显著优于 (Kong et al., 2016)——这说明从更大规模美学数据集中学到的特征同样能反哺属性预测。

> 注³：这十个美学属性为：有趣内容（interesting content, IC）、物体强调（object emphasis, OE）、良好光照（good lighting, GL）、色彩和谐（color harmony, CH）、鲜艳色彩（vivid color, VC）、浅景深（shallow depth of field, DoF）、三分法（rule of thirds, RoT）、平衡元素（balancing element, BE）、重复（repetition, RE）与对称（symmetry, SY）。

**表 1**：基线 (Kong et al., 2016) 与本文结果的属性预测比较（均以相关系数 $\rho$ 计算；联合训练属性与美学提升了属性预测性能）。

| | VC | GL | IC | SY | DoF | OE | BE | CH | RE | RoT |
| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
| 基线 (Kong et al., 2016) | 0.5759 | 0.3770 | 0.4854 | 0.2283 | 0.5071 | 0.5728 | 0.2035 | 0.4808 | 0.3150 | 0.2174 |
| 本文结果 | 0.6938 | 0.4963 | 0.5641 | 0.2558 | 0.5476 | 0.6718 | 0.3104 | 0.5176 | 0.3749 | 0.2737 |

**内容特征**。至于内容特征，我们使用现成的图像分类网络 (Ioffe and Szegedy, 2015) 从每张图像提取语义特征（avg pool 层）。为生成紧凑的内容属性特征，我们首先以倒数第二个 inception 层的输出为特征，用 k-means 将 FLICKR-AES 训练集的图像聚成 $k = 10$ 个语义类别；随后在网络顶部添加一个 $k$ 类 softmax 层，并用交叉熵损失微调该层（以聚类结果为监督）。网络的 10 维输出被定义为内容属性特征向量 $f_{\mathrm{cont}}$。我们将两个特征向量拼接 $\mathbf{x} = [f_{\mathrm{attr}}, f_{\mathrm{cont}}]^T$，构成面向个性化美学学习的最终特征表示。实验表明，属性特征与内容特征的拼接效果优于单独使用其中任一者。

### 5.2 主动个性化图像美学学习（Active-PAM）

在交互式照片整理等真实应用中，用户可以在照片选择与排序过程中，持续提供关于其美学偏好的评分 (Yeh et al., 2014; Yeh et al., 2010)。与其等待用户对任意图像评分，我们可以用主动学习自动为用户挑选最具代表性的图像请其评分，并在线从反馈中学习。为最小化用户工作量，我们提出一种新的主动学习算法，来优化面向个性化美学学习的训练图像序贯选择。具体地，我们考虑以下两条准则：1) 选中的图像应尽快覆盖多样的美学风格，且冗余最小；2) 用户评分与通用美学分数之间残差较大的图像更具信息量。

基于这些准则，我们如下设计主动选择算法。对图像集合 $N$ 中的每张图像 $p_i$，记通用美学网络预测的美学分数为 $s_i$，其倒数第二层输出的特征为 $f_i$。刻画图像美学风格的美学特征于是可表示为 $v_i = [w_a f_i, s_i]$，其中 $w_a$ 为平衡两项的常数。随后，我们可用欧氏距离 $\mathrm{dist}(v_i, v_j)$ 度量任意两张图像 $p_i$ 与 $p_j$ 之间的距离。给定用户已标注的图像集合 $R$，对相册中每张剩余图像 $p_i$，可计算其与 $R$ 中任意图像 $p_j$ 的距离之和 $d_i = \sum_{j=1}^{|R|} \mathrm{dist}(v_i, v_j),\; p_j \in R$。依据第一条准则，每一步可选择使 $d_i$ 最大的图像。为同时融入第二条准则，我们鼓励选择那些会产生较大残差的图像：将残差分数记为 $r_j$，并用式 (2) 为每张已标注图像赋予权重 $w_j$，再将权重作用于总体距离，得到式 (3)。主动学习算法的细节见算法 1。

$$
w_i = \left(1 - \frac{|r_i|}{\sum_{i=1}^{|R|}|r_i|}\right), \quad p_i \in R. \tag{2}
$$

$$
\max_{q} \; \sum_{j=1}^{|R|} w_j \, \mathrm{dist}(v_q, v_j), \quad p_q \in N, \; p_j \in R. \tag{3}
$$

**算法 1：Active-PAM**

```text
输入：未评分照片集合 N = {p_i}, i = 1, …, K；美学特征向量 v_i；示例评分数量上限 m
1  将已评分示例集合初始化为 R = ∅
2  从 N 中随机选取 ⌊K/10⌋ 张图像构成子集 S 并移入 R：N = N \ S，R = R ∪ S
3  while |R| < m do
4      训练一个回归器来预测残差分数 {r_i}
5      用式 (2) 为每张已标注图像计算权重 w_i（p_i ∈ R）
6      寻找 p_q ∈ N，使式 (3) 取得最大值（p_j ∈ R）
7      将选中的图像加入 R 并更新 N：R = R ∪ {p_q}，N = N \ {p_q}
8  end while
```

本节在 FLICKR-AES 与 REAL-CUR 两个数据集上，对我们的个性化美学模型（PAM）与主动学习方法（Active-PAM）进行实验评估。图 4 给出展示模型工作方式的可视化示例。

> **图 4**：来自两位用户的个性化美学预测示例结果。(a) 来自 FLICKR-AES 的一位用户；(b) 来自 REAL-CUR 的一位用户。蓝色条为该用户的真实评分，黄色条为通用美学预测，绿色条为针对该用户的个性化美学预测。可以看到，我们的个性化模型比通用模型更准确地预测了用户评分。

### 6.1 实现细节

我们的通用美学网络的靠前各层由 Inception-BN 网络 (Ioffe and Szegedy, 2015) 初始化，而被裁剪的最后一个 inception 模块则以 "Xavier" (Glorot and Bengio, 2010) 方式随机初始化，随后在 FLICKR-AES 上微调该网络。训练时，图像先放缩（warp）到 256×256，再随机裁剪为 224×224 送入网络。学习率初始化为 0.001，并周期性地乘以 0.96 退火；权重衰减为 0.0002，动量为 0.9。

### 6.2 个性化美学模型评估

为评估我们的个性化美学模型（PAM），我们将 PAM 与一个基线模型以及一个常用的协同过滤方法进行比较，结果表明 PAM 显著优于另外两者。我们进一步分析了模型中所用的内容与美学属性特征的有效性。

**与其他方法的比较**。我们将 PAM 与另外两种方法比较：1) 基线 SVM 回归器——直接基于用户提供的训练图像，预测该用户在测试图像上的专属美学分数；2) 一种常用的协同过滤方法——非线性基于特征的矩阵分解（non-linear Feature-based Matrix Factorization, FPMF）(O'Donovan et al., 2014)，它在个人色彩美学推荐上优于其他矩阵分解方法。两种方法均使用与我们的方法相同的内容与美学属性特征。我们在 FLICKR-AES 的测试用户上评估这三种方法：对每位测试用户，从其标注的图像中随机采样 $k$ 张作为训练图像，其余图像全部用于测试；对非线性 FPMF，FLICKR-AES 训练集中的所有其他用户也一并纳入训练。由于训练图像选取的随机性，我们对每位测试用户重复实验 50 次，并报告平均结果及标准差。

按照 (Kong et al., 2016) 的做法，我们用排序相关系数（ranking correlation）度量预测值与真值用户分数之间的一致性。通用美学模型在所有测试用户上的平均排序相关系数为 0.514。表 2 给出了在 $k=10$ 与 $k=100$ 两种设置下，各方法相对通用模型的平均相关性提升。可以看到，直接预测分数的 SVM 模型在该问题上并不奏效——其结果甚至差于通用模型：它试图在完全不考虑通用美学理解的情况下，从非常有限的数据中直接学习每位用户的美学"口味"，因而非常不稳定、几乎无法泛化。相比之下，我们的方法（表 2 最后一行）即使只有 10 张训练图像也能奏效，且随着训练样本增多提升更为显著。这验证了我们基于残差的模型设计：它充分利用了通用美学网络中蕴含的共性美学理解，而将学习聚焦于与用户独特偏好直接对应的分数偏移上。我们的模型也显著优于 FPMF——后者即便使用 100 张训练图像，也只有边际提升。

### 6.3 主动学习评估

**与其他方法的比较**。我们将本文方法与另外三种主动学习方法比较：1) Greedy (Yu and Kim, 2010)：每次迭代选择与已选样本的最大距离最小的样本；2) MCAL (Demir and Bruzzone, 2014)：通过聚类待选候选图像并选择其中非支持向量的图像来挑选样本；3) 委员会查询（Query by Committee, QBC）(Burbidge et al., 2007)：用集成算法生成一个模型委员会——实验中，我们用 Bagging 为 QBC 生成 5 个模型（委员会成员）(Abe and Mamitsuka, 1998)。选择这三种方法进行比较，是因为它们处理的是回归问题；而经典的面向分类的主动学习方法 (Demir and Bruzzone, 2014; Tong and Koller, 2001) 在此并不适用，因为诸如基于间隔（margin）的采样等准则并不适合连续的美学分数。此外，我们还加入一个所有图像均为随机选择的基线。

评估一个主动学习方法时，我们从 10 张随机选取的图像出发，训练初始 PAM；在此基础上，不断用主动学习方法从用户相册中选择新图像并更新 PAM 模型，直至选中图像数量达到 100。不同方法为更新模型而选择的图像可能不同。为了在各方法相同的测试图像上进行比较，我们选择用整个相册进行评估。这也与个性化美学的真实应用场景一致：算法能够访问并主动选择相册中的任意图像，而对用户而言，最重要的是相册中所有图像的整体排序质量。由于 PAM 模型初始化的随机性，我们对每种方法重复实验 10 次。平均性能如图 5 所示（所有方法的标准差均小于 0.001）。我们的主动选择方法优于所有其他基线方法以及随机选择。

> **图 5**：主动学习方法在 (a) FLICKR-AES 与 (b) REAL-CUR 上、在相册全部图像上的评估（横轴为训练图像数量 10–100；纵轴为平均相关系数，FLICKR-AES 约 0.52–0.59 区间，REAL-CUR 约 0.41–0.49 区间）。

为进一步检验由不同主动学习方法更新的 PAM 模型的泛化能力，我们不再在整个相册上评估，而是移除所有已被选中用于模型更新的图像，只在模型未见过的剩余图像上评估。需要说明的是，这并非完全公平的比较——由于不同方法选择用于模型更新的图像不同，用于评估的图像也可能随之不同——但它仍能让我们了解模型在新图像上的表现。结果汇报于图 6：在这些未见图像上评估时，由我们的主动选择更新的 PAM 模型表现明显更好。

> **图 6**：主动学习方法在 (a) FLICKR-AES 与 (b) REAL-CUR 上、在相册中未见（未用于模型更新）图像上的评估（横轴为训练图像数量 10–100；纵轴为相对通用模型的平均相关性提升）。

## 7 结论 + 精读小结

### 结论（原文翻译）

在这项工作中，我们处理了个性化图像美学问题，并引入两个新数据集以促进对该问题的研究。我们提出了一种新颖的基于残差的个性化美学模型，可在标注样本有限的情况下容纳个体的美学品味。我们还发现，属性与内容都是研究个体美学偏好的重要信息。此外，我们提出了一种新的主动学习方法，以交互方式选择训练图像，提升个性化美学模型的训练效率与性能。一个有趣的未来研究方向是考察诸如内容冗余、图像质量或人脸识别等额外线索，以改善真实应用中的用户体验。

### 精读小结

**问题与洞察**。美学评分本质上是高度主观的：同一张图像，五位用户的打分可能相差悬殊（图 1）。传统美学模型学习的其实是"平均人"的偏好。本文的关键洞察是：个体评分相对通用均分的**残差（偏移）并非随机噪声，而是与图像的内容类别（风景/人物/人群等）和美学属性（对称/三分法/景深等）系统性相关的可预测信号**——第 4 节用 111 位真实用户与两个高斯噪声"随机用户"基线的相关性对比完成了这一实证。该分析既定义了问题，也直接决定了方法形态。

**方法设计哲学**。"每位用户只有极少量标注"是个性化美学的核心约束。PAM 的应对是**"冻结核心理解、只学小偏移"**：通用美学 CNN（在 4 万张图上训练、性能与当时最优相当）负责共性审美；个性化部分只在高层次语义空间（20 维紧凑表示 = 10 维美学属性特征 + 10 维内容语义特征）中，用 RBF 核 ν-SVR 回归一个标量残差，最终以"通用分数 + 残差预测"作为个人分数。这避开了从原始像素直接学个人模型的过拟合陷阱（直接回归基线在 10 张图时相关性提升为 −0.352，比不学还糟），也与后来流行的残差适配器（residual adapter）思路一脉相承。

**实验结论要点**。(1) 每人 10 张标注即可让 PAM 超过通用模型（+0.006），100 张时达 +0.039；(2) 属性特征与内容特征互补、拼接最优——个人偏好同时由"拍什么（内容）"与"怎么拍（美学属性）"驱动；(3) 协同过滤 FPMF 在"各用户物品集互不重叠"的稀疏设定下几乎失效（100 张图时仅 +0.010），反衬残差适配路径的合理性；(4) 多任务联合训练还让属性预测本身在全部 10 个属性上全面超越 AADB 原文基线（表 1），说明大规模美学监督可反哺属性学习。

**主动学习的必要性**。真实照片整理是交互式场景，用户标注预算极小。Active-PAM 在美学特征空间中做"加权最远点"序贯选择以覆盖多样风格（准则 1），并通过残差权重（式 2：残差越大、权重越小，即对高残差已标注图像的"排斥"越弱）使候选更容易落入信息量大的高残差区域（准则 2），构成一个专门面向回归/个性化任务的主动学习实例；在两个数据集的全相册评估与"仅未见图像"评估中均稳定优于 Greedy、MCAL、QBC 与随机选择（图 5、6），且在未见图像上优势更明显。

**局限与影响**。论文自述的未来方向包括内容冗余、图像质量、人脸识别等额外线索；作者也自己指出"仅未见图像"的主动学习评估协议并不完全公平。就影响而言，FLICKR-AES 与 REAL-CUR 已成为后续个性化图像美学评估（PIAA）研究的标准基准（如 CVPR 2022 的 PARA 数据集工作即以其为对比对象），本文的"残差/偏移"建模思想也被后续工作（如基于 residual adapters 的个性化美学）延续与扩展。

---

## 创新点提炼

1. **首次将"个性化图像美学"确立为独立研究问题，并用数据完成其可行性实证**。不同于以往只学通用美学模型的工作，本文利用 FLICKR-AES 的评分者身份信息，对 111 位真实标注用户计算"个人评分相对通用均分的残差"与 10 个美学属性、10 个内容类别之间的 Spearman 秩相关，并构造两个由高斯噪声（σ=0.2 与 2）扰动均分生成的"随机用户"作对照——111 位真实用户的平均相关性全部高于随机基线，证明个人审美偏离不是噪声、而是与内容/属性系统性相关的可预测信号。这一分析直接构成残差建模的动机，是全文的逻辑支点。

2. **两个专门设计的新数据集及其"按用户划分"协议**。FLICKR-AES（40,000 张知识共享许可的 Flickr 图像、210 位 AMT 标注者、每图 5 人评分取均值为真值、保留评分者身份）在规模与内容覆盖上远超此前带评分者身份的 AADB（约 1 万图）；其训练/测试按"标注者"而非"图像"划分（37 位测试用户、173 位训练用户、图像零重叠），精确模拟"每个用户只评自己的照片、算法事先无法访问"的真实冷启动场景。REAL-CUR（14 位真实用户、每册 197–222 张、由相册主人多轮自评校准一致性）则是首个由真实用户为自己照片评分的美学数据集，为算法提供真实场景试金石。

3. **基于残差的模型适配方案 PAM：把"学个人审美"转化为"学个人相对通用审美的偏移"**。不直接从少量样本回归用户绝对分数（该基线在 $k=10$ 时相关性反而下降 0.352），而是先在 FLICKR-AES 上训练通用美学 CNN（Inception-BN 架构，性能与当时 SOTA 相当），再仅用 20 维紧凑特征（10 维美学属性 + 10 维内容语义）+ RBF 核 ν-SVR 回归残差；每人 10 张标注图即可开始超越通用模型，100 张时平均相关性提升 +0.039，显著优于直接回归与协同过滤 FPMF（+0.010）。

4. **面向个性化美学的"属性 + 内容"双通道紧凑特征表示及其多任务训练**。美学属性通道以通用美学网络为预训练模型，在 AADB 属性与 FLICKR-AES 美学分数上做多任务联合微调（仅微调最后一个共享 inception 层与预测层），所得 10 维属性响应在全部 10 个属性上的预测相关性全面超越 AADB 原文基线（如 VC：0.6938 vs 0.5759、BE：0.3104 vs 0.2035）——说明大规模美学数据学到的表征可反哺小数据属性预测；内容通道以 k-means（$k=10$）聚类为伪标签、交叉熵微调 softmax 层得到 10 维语义输出。二者拼接优于任一单独使用，从特征层面印证"个人偏好由内容与美学属性共同驱动"。

5. **面向回归与个性化美学的主动学习算法 Active-PAM**。经典主动学习面向分类（margin sampling 等准则不适用于连续分数），本文针对美学回归设计双准则序贯选择：以"通用分数 + 倒数第二层特征"构成的美学特征空间中的加权距离最大化保证风格覆盖多样性；同时用式 (2) 的残差权重削弱高残差已标注图像的"排斥"，使候选更易落在信息量大的高残差区域。在 FLICKR-AES 与 REAL-CUR 的全相册评估及"仅未见图像"评估中，均稳定优于 Greedy、MCAL、QBC 与随机选择，且在未见图像上优势更显著（更好的泛化）。
