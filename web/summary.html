## 二、逐篇核心创新

### 01 RubricRM——动态量规（rubric）作为中间评估协议
- **量规轨迹合成**：教师模型（Gemini 3.1 Pro）把既有偏好标签"转写"为结构化轨迹（意图→维度→权重→评分标准→逐维打分），锚定人类偏好、规避教师独立判断瓶颈，构建 31.8K+30.7K 训练轨迹。
- **维度级 GRPO**：奖励 $R=\sum_i w_i b_i \phi_i$ 同时建模偏好方向 $\phi$ 与分差幅度 $b$、按量规权重聚合，信号远细于二元偏好；配固定量规 rollout + 饱和组过滤（$\sigma_R<0.05$）保训练稳定。
- **小模型逼近大评审**：Qwen3.5-4B/9B 双任务专用模型在 MMRB2、GenAI-Bench、EditReward/EditScore-ERB 全面超越专用奖励模型，逼近 Claude Sonnet 4.6、Gemini 3.1 Pro。

### 02 VA-Judger——首个视听联合生成奖励模型
- **不可分解性洞察**：视听偏好 ≠ 各模态独立判断之和，"多指标拼装奖励"与人类整体偏好系统性失配（各指标一致率仅 50%–57%）。
- **VAPref-10K 难度感知数据**：1 万条真实视频改写为生成提示词，4.4K 简单对 + 9.8K 困难对互补；课程式 SFT（Gemini 冷启动）+ 人类校验拒绝采样（困难对仅留与人类一致样本）。
- **维度路由奖励**：单个 VA-Judger 替换 OmniNFT 五个专家奖励，按维度路由到音频/视频/共享分支；LTX-2 后训练人类偏好率 62.30%（次优 27.63%）。

### 03 TryOnReward——VTON 专用细粒度奖励
- **注视校准目标（FCO）**：用服装/人体解析掩码定义目标 token 集，把奖励预测注意力锚定在任务相关区域，抑制全局捷径学习；推理零开销。
- **不确定性感知成对排序 + 边际感知点级回归**：奖励头输出高斯分布做二维边缘化的成对概率；评分头以人工分差作自适应边际，统一成对与点级监督。
- **实证抗 hacking**：驱动 DiffusionNFT 后 Model2Model 总分 3.047→3.564，且在未见过的 DressCode/VITON-HD 上保持领先。

### 04 Lever-Edit——"无需编辑奖励"的奖励迁移
- **反事实目标描述**：$c_{tgt}=c_{change}\oplus c_{preserve}$ 把"改什么+保什么"编码为自包含文本，将图-图评估转化为 T2I 奖励擅长的图-文对齐——全文"杠杆"支点。
- **嵌入级前缀微调**：冻结 VLM 与编辑主干，仅训连续查询前缀，在离散空间锁语义、连续空间给适配自由度；产物是可插拔模块，适配任意 VLM/主干。
- **双重监督**：策略梯度最大化迁移奖励 + token 级 NLL 以强 MLLM 金标准描述抑制语义漂移；Lever-Bench（1,880 失败样本对）验证。

### 05 RewardVerse——量规即奖励 + 标量漂移治理
- **标量漂移问题定义**：分数区间塌缩 + 语境高方差两种症状；2×2 消融证明"量规必要但不充分"——须与 soft-logits 连续读出耦合（整数 JSON 协议失败率高达 46.7%–53.3%）。
- **RGPO 非对称两阶段**：生成器走 GRPO 策略梯度、评分器只接受人类边距校准损失，防评分器"拉分差钻空子"；相对边距校准不做绝对回归。
- **极致数据效率**：每维 30 对（共 480 对）达 EvalVerse 16 维 SOTA（宏平均 PLCC 0.554）；驱动 Wan-2.2-A14B GRPO 提升目标指标且不损其他能力（对比 VideoReward 全面下降）。

### 06 FIRM-Video——"先检查后评分"
- **清单式监督构建**：维度专属清单构建 → 时序视觉证据逐条验证 → 仅聚合已验证决策；分数只由已验证二元决策导出，可追溯、不重复扣分。
- **"先定分、后说理"蒸馏**：把多阶段流水线输出转写为自然语言理由时分数先于理由确定，合成 88,044 条 JSON 监督（FIRM-Video-90K）蒸馏进单次前向的 8B 模型。
- **双 SOTA**：FIRM-Video-Bench MAE 从基座 1.33 降至 0.78；三个 T2V 生成器 Best-of-8 全面最高（Semantic +1.24–2.11）。

### 07 SenseNova-U1.5——原生统一 4K 生成
- **空间耦合解码器**：token→二维特征场→Pixel Shuffle+卷积逐步重建，相邻块在像素定稿前交换信息，解决接缝/网格伪影，支撑 4K 原生生成；每 32×32 区域仅 1 token。
- **"先专后统"多专家后训练**：美学/OCR/信息图/编辑四专家各自 RL（多重集 IoU、瓶颈式最小值聚合等奖励路由设计），再多专家在策略蒸馏进单一模型（学生沿自身 ODE 轨迹向冻结专家回归，时间步分布 Beta(2,5)→Beta(5,2)）。
- **理解-生成双向增益**：VBVR-Pro 68.2 超 Nano-Banana-Pro 与 GPT-Image-2；RealUnify-GEU 56.3 证明生成本身成为推理中间表示。

### 08 Swift-Image——6B 紧凑统一模型的性能前沿
- **系统性训练工程范式**：把架构、数据课程、后训练、提示处理与压缩组织成一条连贯管线——6B 单模型统一 T2I/单图/多图编辑，仅约 243K GPU 小时即在五个编辑基准综合分上领先全部受评测开源模型（Overall 4.41）。架构上采用效率导向的单流并行 DiT：QKV-MLP 投影融合换约 10% 推理效率，删除每块独立时间步调制 MLP（约占参数 20%–30%）把预算还给核心层。
- **"先分辨率、后任务"渐进课程 + 并行专家 RL/多教师 OPD**：奠基预训练（500K 步、256→512px、纯 T2I）→ CT（200K 步、512→1024px、质量退火+语义重平衡）→ SFT（10K 步、评测驱动增样）；后训练用 DiffusionNFT 并行训练任务连贯专家（rollout 开 CFG、优化关 CFG 的解耦设计），再以混合策略学生做多教师 OPD 整合，RL 使 Overall 从 3.98 升至 4.16，"专门化-整合"范式复用于剪枝迁移与少步整合。
- **Prompt Enhancer 的条件分布对齐视角**：把提示增强理解为"编译到生成器原生条件语言"——Interpreter/Reasoner/Planner/Compiler 四角色把异构用户意图编译为与 Captioner 分布对齐的表示，自适应决定是否触发 `<think>`；用冻结 DiT 的文本+图像双反馈 GRPO 优化，CPI-Intelligent 从 2.26 拉至 4.23，且对其他开源模型同样有效。
- **结构剪枝 + 稳定性改造少步蒸馏的完整压缩链路**：32→24 头剪枝后重走 CT 恢复课程 + 速度预测蒸馏 + 跨容量 OPD，得几乎无损的 3B（Overall 4.40 vs 6B 的 4.41）；少步蒸馏在 DMD2 基础上引入动态反向模拟（{2,4,8,16,28} 随机预算、一个学生服务多种步数）、偏向低噪声停止、解耦噪声匹配与教师锚定对抗头，50→8 步 Turbo 版综合编辑分反超多步教师（4.20 vs 4.16）。

### 09 VicEdit——从"文本讲述"到"视觉展示"
- **三模态视觉参考**：单图（外观纹理）/图像对（空间变换）/视频对（时序动态）锚定编辑指令，弥补文本指令在纹理-空间-动态三维度的表达局限。
- **VicEdit-400K + MASD/DCI**：四阶段自动流水线构数据；模态条件化加性查询调制（$Q_{vis}=Q_{base}+E_m$）+ 视觉上下文校准指令偏移（$\Delta_{inst}$）。
- **双 SOTA + 低开销**：VicEdit-Bench Overall 3.45（超次优 16%）；参考特征提取仅 +0.5–1.0 秒（<0.5% 推理开销），32 GPU 天 LoRA 训练。

### 10 UniSpace——统一视觉空间
- **重建瓶颈定位**：受控诊断证明补丁嵌入（而非冻结 ViT 块）才是重建瓶颈——仅换随机投影即使末层 PSNR +3.70 dB，推翻"语义编码器不能重建"假设。
- **补丁重参数化双通路**：冻结语义通路 + 新增重建优化补丁嵌入共享同一 ViT，rFID 低至 0.14 超专用 VAE；显式通道拼接（768+128）保语义/重建边界——纠缠表示解码 FID 崩溃至 120.9。
- **UniSpace 8B**：PR-Qwen-ViT 作为 8B Qwen3 MoT 唯一冻结视觉接口，理解 next-token + 生成/编辑共享平衡流匹配（BFM）目标；ImgEdit 4.28 显著超同规模基线。

### 11 CapabilityDataDesign——能力作为数据组织单元
- **三个能力专用引擎**：T2I 接地（440M）、编辑变换（120M 对：自然视觉关联挖掘 + 专家扩展）、知识接地（PageRank+VLM 筛 300 万实体/2700 万对），接口可互操作。
- **Caption 作为统一监督语言**：编辑指令构造为"条件 T2I 生成"，`[image N]` 参考机制使 T2I 概念词汇向编辑迁移。
- **五阶段课程 + 缺口驱动闭环**：四轴（任务/概念/质量/分辨率）共演化 256px→1024px；失败案例转为可度量缺口驱动定向补数；缺陷/退化感知的数据保留把伪影转化为可识别概念。

### 12 DensePred2Editing（InsEdit）——密集预测作为结构化监督
- **感知→创作反向迁移**：深度/法线预测表述为图像形式去噪目标纳入统一训练，无感知专用头即显著提升编辑局部性（Local Add 3.92→4.18）与结构保留。
- **语义/视觉显式解耦**：Qwen2.5-VL/SigLIP/Glyph-ByT5 语义通路管"做什么"，干净 VAE 潜码视觉通路管"保留什么"，共享 MMDiT 联合注意力；单检查点 4.15 最高统一总分。
- **MCA 互上下文注意力**：同 DiT 内源/目标分支受控 K/V 交换（Concat/Swap × K/KV 四算子 + 层/时间步调度），构造约 30 万对支持时间局部化编辑，突破"首帧编辑再传播"偏置。

### 13 VoT——视觉思维 token
- **文本→思维→图像**：VLM 与扩散分支间插入离散"视觉思维"token 层，渲染前显式规划物体与布局，解决静态 embedding 条件化"知道却画不准"，天然可解释可控。
- **语义量化而非像素量化**：以冻结 VLM 的 ViT 语义特征为量化目标，"VLM 对齐 + 特征重建 + 向量量化"三目标闭环；教师规模定律（2B→7B 持续改善 token 质量）。
- **三分支 MoT**：文本/VoT/扩散三分支，21B 总参仅 ~6 万 GPU 时新增分支训练；GenEval 0.91 超 BAGEL/Mogao（0.89）与 FLUX.1-dev（0.82）。

### 14 TRM——先思考后评分
- **R→J→H→s 显式流程**：先为每个案例生成案例自适应评分细则（"该评什么"），再逐条检查汇总（"评得怎么样"），跨生成/编辑任务统一。
- **PD-GRPO 治理 BT 极化**：机理分析 BT 目标在分数差上无内部最优导致持续极化；双组互为参照 + 硬间隔指示奖励，保留判别力同时维持点式校准。
- **完整证据链**：9B TRM 开源最优、媲美专有；引导 FlowGRPO 一致提升 7 个生成/编辑模型；1/8 参数量比肩 EditScore-72B；vLLM 异步奖励计算流水线化部署。

### 15 EditReward——首个大规模专家标注的编辑偏好奖励模型
- **200K 专家偏好对 + 双维量表**：9,557 条指令（6 大基准来源）× 6 个 SOTA 编辑模型候选池，受训专家按"指令遵循（IF）+ 视觉质量（VQ）"两维 4 级量表打分（Krippendorff α 0.668/0.597），规模与细粒度同时超越 ImageRewardDB、HIVE、GenAI-Bench 等既有数据。
- **多维不确定性感知排序 + 平局解缠**：多头 MLP 为每个维度独立输出高斯分布再聚合（成对不确定性损失比逐点回归高 14 分、均值聚合最优）；"一图 IF 占优、另一图 VQ 占优"的平局对被拆为方向相反的两个样本，平局数据效用翻倍且训练更稳。
- **实证闭环**：GenAI-Bench 65.72 / AURORA-Bench 63.62 双 SOTA（超 GPT-5 的 59.61）；多方偏好基准 EditReward-Bench（K=2/3/4 全对才算对）区分出 GPT-4o（28.31）与 GPT-5（37.81）的差距；用 Top-20K 筛选 ShareGPT-4o-Image 微调 Step1X-Edit，GEdit-Bench 英文总分 7.086 > 全量训练 6.780 > 原始模型 6.444。

### 16 EditScore——"基准→奖励→在线 RL"的全链路体系
- **EditReward-Bench**：3,072 组专家偏好对覆盖 4 大类 13 子任务、11 个编辑器（含 Gemini-2.5、gpt-image-1 等专有模型）；双人讨论标注协议使一致性维度收敛率 +12.12%、与全专家组多数票一致率 >97%。
- **生成式奖励 + 自集成**：奖励建模形式化为条件文本生成（输出"推理 + 标量分数"，CoT 带来 +0.038），[0,25] 分制下 SC（编辑成功+过度编辑）× PQ（自然度+伪影）几何平均；7B 版即超 10× 大的 Qwen2.5-VL-72B，72B 追平 GPT-4.1，Avg@4 自集成后 0.763 超 GPT-5——推理时计算扩展比参数扩展边际收益更高（延迟次线性）。
- **高保真奖励 = 在线 RL 的解锁条件**：固定 OmniGen2 只换奖励源的受控实验中，Qwen2.5-VL-72B 致训练不稳定，7B EditScore 即可稳定训练并匹敌 GPT-4.1；更反直觉的是 GPT-5 标注更准但方差更低，最终策略反而更差（6.292 vs 6.375）——高方差奖励才是有效学习信号。

### 17 FIRM Reward（Trust Your Critic）——差异优先的鲁棒编辑奖励
- **两条专门化数据流水线**：差异优先（difference-first）利用 MLLM"擅长找两图差异、不擅综合评判"的能力不对称性，先生成双层次差异报告、再据文本差异推断执行/一致性分数（FIRM-Edit-370K）；清单式 plan-then-score 由 LLM 规划器生成定制评分清单、MLLM 逐步结构化打分（FIRM-Gen-293K，5 种异构生成器防过拟合）。
- **8B 专门化奖励 + 全人工 FIRM-Bench**：FIRM-Edit-8B / FIRM-Gen-8B 在与人类判断的 MAE 上超 GPT-5 与全部开源基线（0.62/0.51 vs GPT-5 的 0.67/0.52），证明"专门化数据 > 通用规模"；FIRM-Bench 807 样本全人工标注、分数均匀分布。
- **Base-and-Bonus 乘性融合（CME/QMA）**：一致性作为乘性调制项而非加性权重——高一致性只有建立在高执行之上才能兑换奖励，机制上消灭"复制输入""黑色剪影"式奖励作弊（CME 7.84 vs 线性加权的 1.06/6.51）；FIRM-Qwen-Edit 仅 2,400 样本 RL 即达 GEditBench 7.84 SOTA，而通用 Qwen3-VL-32B 做奖励反致 −0.07 负优化。

### 18 SpatialReward——显式空间推理治"注意力坍缩"
- **问题定量诊断**：MLLM 评测器因缺乏空间锚定，注意力坍缩进盲目 sink 状态、源图"不可见"，跨图像比较退化为单图评估（熵差 3.48→1.16、源图熵 2.88→5.71、集中度 0.84→0.37）。
- **Think-with-Boxes 双流架构**：SC 流"先定位再检查"以 `<|bbox_id|>`/`<|global|>` 交错 token 锚定推理、强制像素级回看，PQ 流输入隔离实现感知解耦；8B 模型在 EditReward-Bench / MMRB2 提升 +11.3% / +9.1%。
- **数据-训练-部署全链**：260k 空间先验数据（Qwen-3-VL-235B 生成边界框 → 人像域路由 Gemini-2.5-Pro、通用域路由 GPT-5 → 回传改写与幻觉校验）；SFT→GRPO（0.778→0.803）+ 加权几何平均聚合；MER-Bench（15 子任务 2/3/4-Pair 分层排序）；vLLM 前缀缓存使生成式奖励比判别式快 1.5×（72.7 vs 110.5 ms/图），驱动 OmniGen2 在 GEdit-Bench +0.90（约为 GPT-4.1 监督的两倍）。

### 19 ImageReward——T2I 人类偏好奖励的开山之作
- **首个通用 T2I 偏好奖励模型**：基于 137K 专家比较（打分 + 排序双阶段标注流水线，标注员培训、质检复核、矛盾权衡规则），偏好准确率 65.14%，大幅超 CLIP（+38.6%）、Aesthetic（+39.6%）、BLIP（+31.6%）。
- **更可靠的自动评估**：与人类模型排序 Spearman 1.00（CLIP 0.60、零样本 FID 0.09），同时支持模型级比较与单样本选择，直击 FID 无法评单图、不含人类偏好的痛点。
- **ReFL 直接微调**：基于"40 步去噪中约 30 步后预测的 $x_0'$ 质量即可辨识"，无梯度去噪至后段步骤、仅一步带梯度回传（ReLU 奖励映射 + 预训练损失正则），首个从评分器反馈直接调优扩散模型的方法（胜率 58.79%，全面优于数据过滤/损失加权/RAFT 等间接方法）。

### 20 HPS——从社区交互中挖掘偏好信号
- **零标注成本的偏好数据**：从 Stable Diffusion Discord 社区挖掘 98,807 张生成图与 25,205 次真实用户选择（2,659 名用户），利用社区"用户挑图发回触发精化"的天然交互模式。
- **主流指标的偏好盲区实证**：IS/FID 在偏好/非偏好图像上无显著差异，CLIP 与美学分类器仅略高于随机——确立"人类偏好是现有指标未覆盖的质量维度"。
- **HPS 及其对齐用法**：微调 CLIP ViT-L/14 得偏好分数，选择准确率 43.5% 超人类参与者（42.0%），跨模型一致率 61.5% 接近人类间 63.5%；用 HPS 自动划分偏好/非偏好子集、训练时给非偏好图像加 "Weird image." 前缀、推理时用作 CFG 负面提示——rank-32 LoRA 即可让 74% 图像获超 10/20 人类票（原始模型仅 22%）。

### 21 HPSv2——偏好评估的坚实基准
- **HPD v2 数据集**：798,090 次成对偏好覆盖 9 个 T2I 模型（自回归/扩散/GAN）+ COCO 真实图像，突破"几乎只有 SD 系图像"的分布瓶颈；ChatGPT 清洗提示词从图文两端同时去偏（风格词堆砌、矛盾、NSFW）。
- **受控专家标注**：57 名签约标注者经培训、300 组排序测试与 recall@2 交叉质检（录用率 61%），并公开标注者人口统计——质量控制与透明度远超匿名众包。
- **HPS v2 模型 + 评估协议**：CLIP ViT-H/14 上成对 softmax + KL 微调，在 ImageReward 与 HPD v2 双测试集同时最佳（65.7%/83.3%）；3,200 条提示词按 Animation/Concept-art/Painting/Photo 四风格各 800 条、分 10 组报告均值±标准差；覆盖学界-社区-工业界 20 模型的基准揭示"社区 SD 系普遍优于学术模型"。

### 22 PickScore——真实用户偏好数据集
- **首个大规模开放的真实用户偏好数据**：自建 Web 应用让有内在动机的用户"边生成、边表达"成对偏好（含平局），58 万+训练样本（新版本逾百万）、3.7 万+提示词——约为同期 ImageReward/HPS 的 5 倍以上。
- **PickScore 模型**：InstructGPT 式奖励目标（偏好分布与 softmax 分数间的 KL 散度、平局软标签）微调 CLIP-H，提示词频率反比加权抗过拟合；8×A100 不到 1 小时训练出超人类专家的偏好预测（70.5% vs 68.0%）。
- **评估协议革新 + best-of-N**：实证 FID 与人类模型排序强负相关（−0.900，高 CFG 图像更鲜艳但偏离 MS-COCO 分布）而 PickScore +0.917；45 模型、1.4 万真实偏好的 Elo 评估中相关性 0.790 最优；每提示生成 100 图（5 噪声 × 20 风格模板）按 PickScore 选优，胜率 71–85%。

### 23 RealGen——检测即奖励（detection-as-reward）
- **范式转换**：把合成图像检测器从事后鉴别工具变为 RL 奖励源——图像被判"真实"的概率即真实感分数，绕开人类偏好奖励的先验偏差（HPSv2 偏红、PickScore 偏紫、偏好 ≠ 真实感）与 FLUX-Krea 式人工筛库的昂贵成本。
- **双层检测奖励融合**：语义级用可解释 MLLM 检测器 Forensic-Chat 的 "real" token 概率捕捉"油感皮肤"等可见伪影，特征级用专家检测器 OmniAID 的 1−P(fake) 捕捉频域伪影等不可见痕迹，辅以 Long-CLIP 对齐奖励，批内标准化求和为融合优势函数。
- **两阶段 Detection-GRPO + RealBench**：先冻结扩散模型、GRPO 训练提示改写 LLM（自动提示工程），再冻结 LLM、Flow-GRPO 优化 FLUX.1-dev，以"完整去噪推理评估 + 有限连续步探索"化解训练-推理不一致；RealBench（1,000 张真实图像、七类提示）以 GPT-5 与 Effort 两个留出评估器验证泛化而非过拟合；对阵真实图像胜率 50.15%，而偏好类奖励反将模型带偏向卡通风格。

### 24 TextPecker——结构异常量化奖励
- **瓶颈诊断**：系统论证主流 OCR 模型与 MLLM（含 GPT-5、Gemini-2.5-Pro）在文本结构异常感知（TSAP）上近乎全败（英文 F1 最高 0.214），"误读"（语言先验纠正字形缺陷）与"不可见"（忽略低置信度扭曲区域）两种失效模式解释了 OCR 奖励天然有偏的根源。
- **结构感知复合奖励 $\mathcal{R}=w_E\mathcal{S}_E+w_Q\mathcal{S}_Q$**：语义项用词级匈牙利匹配 + 未匹配词惩罚，结构项以放大系数 $\omega$ 惩罚异常字符占比（针对强生成器"错误罕见但刺眼"），即插即用替换字符串级 OCR 奖励，无需架构改动。
- **数据与实证**：1.4M 字符级结构异常数据（10 个生成器真实伪影 559.6K 框级 + 笔画删除/交换/插入合成引擎）；SD3.5-M/Flux/Qwen-Image 三主干中英文一致增益（Flux 英文 Sem. +38.3%、Qwen-Image 中文刷新 SOTA）；实证 OCR 指标可高估缺陷文本性能（+8.3% vs −7.8% 分歧案例）并构建 GenTextEval 重评估基准；评估器异步服务化后 100 RL 步仅 +0.12h。

### 25 UnifiedReward——理解与生成的统一奖励模型
- **首个"四任务 × 双模式"统一奖励**：单一模型同时覆盖图像/视频 × 理解/生成四类评估，同时支持成对排序与逐点打分；VLRewardBench 宏准确率 66.5% 超 GPT-4o（62.4%）与 Gemini-1.5-Pro（62.5%）。
- **约 236K 统一偏好数据 + 两阶段构建**：整合 EvalMuse、HPD、OIP、LLaVA-Critic-113K、VideoDPO、LiFT-HRA、VideoFeedback、ShareGPTVideo 八源；"成对排序划池 + 逐点打分筛分"两阶段流水线从 N=10 候选自动构造 DPO 偏好对（消融优于随机/仅打分/仅排序）。
- **跨任务协同与可扩展性**：预算匹配对照与"单域训练-跨域评测"迁移矩阵证明收益来自任务间正向迁移而非数据量（视频生成评估数据仅 10K 的匮乏被联合学习显著缓解）；Qwen2.5-VL 3B/7B/32B 骨干一致提升，作为 GRPO 奖励在 FLUX.1-dev 上优于 HPSv2/PickScore，四条 DPO 线全部超任务专用基线。

### 26 SigLIP——sigmoid 损失的语言-图像预训练底座
- **成对 sigmoid 损失**：把 CLIP 式"批内 softmax 归一化 + 双向 InfoNCE"改写为每个图文对独立的二分类损失，任务定义与批大小解耦——小批量下显著更优（3B 样本、512 批时 51.5 vs 47.7），大批量亦不落下风。
- **偏置初始化 + 分块分布式**：可学习偏置以 $b=-10$、$t'=\log 10$ 初始化，消解初始负例主导（16k 批内 268M 负例）引发的过度校正（62.0→63.0）；以 $D$ 次轻量集合置换取代全量 all-gather，批大小可推至 100 万。
- **扩展规律与效率**：批大小收益约 32k 饱和、继续增大反而有害的系统实证；4 块 TPUv4 一天训出 79.7% ImageNet 零样本的 SigLiT；mSigLIP 瓶颈式词嵌入（250k 词表仅损约 0.5%）把 XM3600 文到图检索 28.5%→34.9%。其图文相似度已成为后续生成工作的标准语义一致性指标（04 的 SigLIP 一致性、12 的语义通路）。

### 27 SpectraReward（Read It Back）——读回式零样本奖励
- **"让 MLLM 当读者而非裁判"**：冻结 MLLM 以生成图像为条件、对原提示做一次 teacher-forced 前向传播，取平均 token 对数似然为奖励——免训练、免偏好标注、免流水线，较标量打分在 GenEval 上高 11.8 分。
- **语义谱与理论保证**：逐 token 似然构成图文对的"语义谱"（计数错误集中拉低数量词、物体替换骤降对应名词），可解释且简单平均即保持可靠组内排序；PMI 修正项在组相对优势计算中自动抵消故无需归一化。
- **Self-SpectraReward + 反直觉规模发现**：统一模型用自身理解分支为自身生成分支打分，共享 tokenizer/视觉编码器带来的"奖励-策略分布对齐"使 BAGEL 自奖励匹敌 4×（30B）、超 30×（235B）规模的外部奖励模型；奖励 MLLM 收益非单调（~30B 饱和）且预训练版骨干一致优于指令微调版。

### 28 CLIP——对比语言-图像预训练的奠基之作
- **"任务无关预训练 + 零样本迁移"首次大规模移植视觉**：构建 4 亿图文对的 WIT 数据集，训练跨 2 个数量级计算量的 8 个模型，证明对比预训练性能是计算量的平滑可预测函数（log-log 线性），复现 GPT 家族的缩放规律。
- **以对比目标取代预测目标**：判断"哪段文本与哪张图像配对"远易于预测配对文本的确切单词——换成对比目标使零样本迁移效率提升 4 倍，双编码器 + 对称 InfoNCE 自此成为多模态预训练的标准范式。
- **自然语言即分类器**：文本编码器作为超网络，把类名（经"A photo of a {label}."提示工程与嵌入空间多提示集成，合计提升近 5%）嵌入为零样本线性分类器权重，任意数据集的分类转化为与预训练一致的图文配对推理；ImageNet 零样本 76.2% 匹配全监督 ResNet-50，无需任何训练样本。
- **发现零样本模型的"有效鲁棒性"优势**：零样本 CLIP 把 ImageNet 与自然分布偏移间的精度差距缩小最多 75%；而同一模型适配到 ImageNet 后精度提升 9.2% 却不带来鲁棒性提升——揭示 ImageNet 分布的有监督适配本身是鲁棒性差距的重要成因。
- **诚实的失败模式与社会影响分析**：系统记录细粒度/计数/分布外任务弱点（MNIST 88% 被原始像素逻辑回归超过）、零样本到少样本的反直觉下降（对比人类 one-shot 54%→76%）、数据重叠审计，并量化类别设计驱动的种族/性别贬损偏见与监控滥用潜力——为大规模视觉-语言模型治理建立了模板。

### 29 CLIPScore——免参考图文评估的奠基指标
- **CLIPScore 免参考指标**：直接用现成 CLIP ViT-B/32 计算候选描述与图像嵌入的余弦相似度（截断后乘 2.5 重缩放），不用任何人工参考，即在 Flickr8K-Expert/Composite 等基准上与人类判断的相关性超过 CIDEr、SPICE、ViLBERTScore-F 等全部基于参考的指标（51.2/53.8 vs 50.1/52.4）。
- **RefCLIPScore 参考增强版**：取 CLIP-S 与最大参考余弦相似度的调和平均，参考可用时在所有语料库上进一步提升相关性（最高 55.4，FOIL 幻觉检测 92.6），统一了免参考与参考两套评估生态。
- **互补性证明与可操作建议**：信息增益/前向选择分析证明 CLIP-S（图文兼容性）与 SPICE、ViLBERTScore-F（文本相似性）相关但不冗余，据此给出建议——报告"至少一个图像感知指标（CLIP-S）+ 一个强仅参考指标（SPICE）"。
- **鲁棒性与边界双面检验**：FOIL 对抗语料上无参考即察觉名词短语级幻觉（87.2）；250 张从未上网的私人照片上 86% 重建人类偏好，排除记忆化嫌疑；同时诚实测绘失效场景——新闻描述（65 vs METEOR 93，需外部上下文）与吸引力判断（57，仅等于长度基线），而 Twitter alt-text（48.4 vs 参考指标最高 15）与剪贴画（68 vs 基线 53）是其优势领域。
- **评估方法学复现纪律**：逐项剖析 Anderson et al. 2016 协议的自由度（Kendall 变体、评分聚合、真值参考剔除、Pascal-50S 判断集误用）并修正，且指出 MSCOCO 系统级 12 点相关可被随机指标刷到 ρ=.91——对后续指标论文的实验规范具有独立方法论价值。

### 30 HPSv3——宽谱人类偏好分数
- **首个宽谱偏好数据集 HPDv3**：首次将高质量真实摄影（质量上界）、低质量真实图与 GAN/扩散/DiT/自回归共 16 个模型输出纳入同一标注体系，达 108 万图文对、117 万成对比较的迄今最大规模，突破既有数据集"只比生成图、模型过时、无真实图上界"的局限。
- **可靠标注流水线**：专业艺术家验证集（600 对、80% 收敛率）筛选标注者资格，每对 9–19 人标注、置信度 ≥95% 才入训练集，平均收敛率 76.5%（HPDv2 仅 59.9%），并以 12 类别分布对齐保证代表性。
- **VLM 主干 + 不确定性感知排序损失**：用 Qwen2VL-7B 全参训练替换 CLIP/BLIP 特征提取，排序分数建模为一维高斯 $r\sim\mathcal{N}(\mu,\sigma)$、双高斯积分求偏好概率，显式吸收标注噪声，消融全面优于 RankNet 损失。
- **评测稳健性基准**：与人类排序相关性 Spearman 0.94/Kendall 0.82（HPSv2 为 0.87/0.76），跨 HPDv2→HPDv3 测试集仅降 8.5pp（PickScore 降 14.2pp），并建立 11 模型 × 12 类别、13.2 万图文对的基准排行。
- **CoHP 免训练迭代生成范式**："模型级（HPSv3 选黄金模型）→ 样本级（加噪再生成、逐轮择优）"两阶段推理，无需额外数据即提升质量，用户研究对 CoHP-ImageReward 胜率 87%。

### 31 VisionReward——细粒度多维人类偏好打分
- **分层诊断式多维偏好解耦**：把图像/视频的人类偏好拆解为 5/9 个维度、61/64 个程度递进的二值判断问题（checklist），由微调的 CogVLM2/CogVLM2-Video 逐一作答，使偏好评估从黑箱整体判断变为可逐项审计的诊断过程，且准确率随问题数单调上升（59.3%→81.7%）。
- **可解释的线性加权偏好学习**：二值回答映射为 ±1 特征、对偏好对特征差做逻辑回归学出每题权重，总分即加权求和——每个问题对分数的贡献可直接读取，机制上化解"准确性与可解释性不可兼得"；迭代权重掩码处理负系数并支持问题剪枝（2 问即达 71.1%）。
- **统一图像与视频、显式建模时序维度**：视频侧新增稳定性/动态/物理/内容保持四个时序维度，弥补图像奖励模型帧级评估忽略时序依赖的缺陷——6 秒视频上偏好预测超随机幅度约为其他最佳方法的两倍，总体超 VideoScore 17.2%。
- **MPO 多维一致偏好对构造**：发现标准 DPO 按总分差选对导致单维过优化与维度退化；MPO 仅在全部维度 Pareto 支配时才构造偏好对，各维度同步提升（对齐分由降转升），算法无关（DPO/MaPO 均有效）且更少样本得更高分。
- **MonetBench 基准 + 约 500 万条二值问答对的大规模多维标注**（48K 图 + 33K 视频，标注一致性约 89%），评估与优化双闭环（评估全面超 8 个基线；驱动 CogVideoX-2B 优化后人类胜率高出 VideoScore 31.6%）。

### 32 UnifiedReward-Think——首个统一多模态思维链奖励模型
- **长 CoT 引入奖励建模**：首次将显式长链推理引入奖励建模，统一覆盖图像/视频的理解与生成四类奖励任务，同步提升奖励信号的可解释性与复杂场景可靠性。
- **"小数据冷启动 + 大数据自我泛化"**：仅 5K 条 GPT-4o 蒸馏的图像生成 CoT 偏好样本教会推理格式，再凭 VLM 固有先验在大规模统一偏好数据上自我生成推理并按真值筛选；仅从图像生成任务蒸馏即可泛化到全部任务，换较弱蒸馏源性能依旧。
- **拒绝采样 + 可验证奖励 GRPO**：答对样本交拒绝采样强化正确推理分布、答错样本交 GRPO 探索多样推理路径，仅依赖最终答案的格式/准确性奖励即有效激励长链推理（消融显示 GRPO 贡献最大）。
- **多维 CoT 评分策略**：沿多个任务相关维度对每个候选独立打分再聚合为最终决策，隐式保证"只验证最终答案即可验证推理"，治 MLLM"推理轨迹与决策不一致"的普遍失败模式。
- **显式推理内化为隐式推理**：掌握 CoT 后不输出任何推理轨迹（w/o CoT）仍全面超基线（VLRewardBench 73.1 vs 基座 67.5，幻觉子集 70.5 vs 58.1），提供按需权衡推理开销的灵活性。

### 33 UnifiedReward-Flex——个性化上下文自适应的统一奖励
- **治"一刀切"评估范式**：固定打分器/BT 偏好模型假设单一全局偏好分布、VLM-as-a-judge 困于静态规则清单，对内容特有视觉线索不敏感、系统性偏离主观且上下文相关的人类偏好——首次将奖励建模与上下文自适应推理耦合，同时覆盖图像与视频生成。
- **上下文自适应分层评价机制（核心贡献）**：以语义对齐/视觉质量/美学等预定义维度为稳定锚点，逐提示实例化细粒度子标准，必要时自生成新高层维度（"叙事与交互"、"动作动态与物理"），逐维度聚合证据得维度级胜者再综合为总体胜者——把"评什么、评多重要"本身变成模型的推理输出。
- **推理感知的两阶段训练**：阶段一从 GPT-5.2 蒸馏结构化推理轨迹构建 UnifiedReward-Flex-SFT-90K（45K 图像对 + 45K 视频对）做 SFT；阶段二 DPO 采用"正确性优先、双正确时按推理轨迹质量定偏好（闭源评审 + 人工核验）"的偏好对构建规则，使对齐同时覆盖决策与推理质量——在全对的困难子集上也提升判别力。
- **个性化多维偏好奖励接入 Pref-GRPO**：锚定维度平均胜率 $\bar{R}_{\mathrm{dim}}$ 与总体胜率 $R_{\mathrm{overall}}$ 两路信号分别组内标准化后按 $\hat{A}^i=\alpha\hat{A}^i_{\mathrm{dim}}+(1-\alpha)\hat{A}^i_{\mathrm{overall}}$ 混合，消融确定 α=0.7 最优。
- **全面稳健的实证**：较 UnifiedReward-Think：MMRB2 +3.2、GenAI-Bench-Video +2.2；下游 FLUX.1-dev GRPO 语义一致性 +14.56，Wan2.1 T2V GRPO Dynamic Degree 58.6→70.8 且空间关系/颜色同步提升；增益跨生成器（FLUX.1/2、Wan2.1/2.2）与跨规模（2B–32B）保持。

### 34 InstructPix2Pix——指令引导图像编辑的开山之作
- **开辟"指令引导编辑"任务范式**：编辑条件从"输入/输出图像完整描述"变为一条自然语言编辑指令，用户无需遮罩、示例图或逐例微调，一句话即可编辑图像。
- **大模型知识组合自动合成配对数据**：仅 700 条人工标注三元组微调 GPT-3 Davinci，即从 LAION 真实描述生成 454,445 条"（输入描述，编辑指令，编辑后描述）"三元组，破解配对编辑数据无法从互联网直接获取的根本瓶颈。
- **文本对→图像对的可靠合成**：Stable Diffusion + Prompt-to-Prompt（共享注意力权重）保证前后图像一致；每个描述对随机采样 100 个 p∼U(0.1,0.9) 的图像对，经三重 CLIP 阈值（0.75/0.2/0.2）过滤择优。
- **双条件潜在扩散 + 双条件无分类器引导**：在 SD 上新增图像条件通道（与带噪潜变量拼接、零初始化）、复用文本编码通路；训练时按 5%/5%/5% 随机丢弃条件，推理时 s_I、s_T 独立可调，实现"保持输入图 vs 编辑强度"的连续事后调控；8×A100 仅 25.5 小时训练。
- **零样本泛化 + 前向传播快速编辑**：纯合成数据训练却零样本泛化到真实图像与人类自然指令，约 9 秒/图（A100），在 CLIP 图像相似度–方向相似度权衡上显著优于 SDEdit。

### 35 AutoRubric——统一量规化 LLM 评估框架
- **统一框架消除"重复发明税"**：将散落在 LLM-as-a-Judge、教育测量、心理测量文献中的量规评估技术（分析式量规、混合准则类型、集成评审、判决平衡少样本校准、偏差缓解、κ/EMD 信度诊断）整合为带"有主见默认值"的单一开源 API，每项技术均配证据引用与可运行实现。
- **逐准则原子评估的"测量+优化"双重角色（核心论点）**：同一份逐准则分数既诊断评审者在哪些准则上分歧（CHARM-100 揭示检测过短/过长的召回 0.70 vs 0.14 不对称），又可直接作为优化信号——技能改进回路把同行评审智能体从 0.47 提升至 0.85，RL 奖励在 AdvancedIF 上 +0.039 并向 IFEval 非负迁移。
- **异构准则类型 + 三分支加权聚合公式**：单一量规内混用二值/有序/名义准则，多选项显式 0–1 数值与乱序构成位置偏差的结构性防御；CANNOT_ASSESS 弃权提供 SKIP/ZERO/PARTIAL/FAIL 四策略，400+ 单元测试保证构造正确性。
- **CHARM-100 基准**：首个混合三种准则类型（1 二值 + 4 有序 + 1 名义）且带逐样本参考标签与 50 项二次标注审计（宏平均 κ=0.687）的聊天机器人评估数据集，含跨准则冲突与复合反模式设计，防止"总体质量"捷径刷分。
- **"不存在万能缓解栈"的实证**：三模型家族 × 八配置的敏感性分析表明评审者家族是最大变异源（精确率 60.4%/51.0%/19.4%），缓解效应方向随模型反转、跨家族集成不优于最强单评审者——配置选择必须模型与准则依赖，且缓解无法补偿弱评审者。

### 36 RubricHub——粗到细自动量规数据集
- **全自动粗到细量规生成，直击"监督天花板效应"**："回应锚定+原则引导生成 → 异构多模型聚合（GPT-5.1/Gemini 3 Pro 候选池蒸馏）→ 难度进化（从高分共识回应提炼'优秀→卓越'附加准则）"三阶段流水线，分别解决相关性、无偏性与区分度问题；消融显示三阶段在两个医疗基准上带来严格单调的性能提升。
- **RubricHub 数据集**：约 11 万条、五大领域（医疗/科学各 27.1%、指令遵循 20.9%、写作 15.9%），复杂领域平均每查询 30+ 条细粒度准则；即便 Qwen3-235B 平均得分也仅约 0.6，证明评估体系高区分度且未饱和。
- **RuFT + RuRL 两阶段量规驱动后训练**：RuFT 以量规为拒绝采样过滤器（阈值 0.6）构建 3 万条 SFT 冷启动数据；RuRL 将量规展开为权重归一化的二元稠密奖励（语义准则走 LLM 评分器、可验证准则走规则系统）配合 DAPO 训练——Qwen3-14B-Base 在 HealthBench 上从 22.8 升至 69.3，超越 GPT-5（67.2）与 Baichuan-M2-32B。
- **实用导向的系统实证**：仅正向准则一致优于含负惩罚方案（评分器对负准则判定准确率低）；评分器在效果-速度权衡下选定 gpt-oss-120B；940 条准则的人机一致性研究显示 30B 即达实质性一致（κ=0.74）后饱和，为量规驱动 RL 的可靠性提供多角度验证。
- **同题换规的因果验证**：在相同 RaR 问题上仅替换为 RubricHub 生成的量规，HealthBench 即从 47.7 升至 62.1，证明增益源于量规质量本身而非数据来源。

### 37 OpenRubrics——可扩展合成量规生成
- **首个大规模 (提示, 量规) 合成数据集**：整合 UltraFeedback、Magpie、Skywork-Preference、Synthetic-IF、MegaScience、Medical-o1 六大来源，使量规生成与量规引导奖励建模摆脱对专家手工整编和商业 API 即时提示的依赖。
- **"硬性规则 + 原则"双类型量规体系**：显式区分提示中的显式客观约束（hard rules）与隐式可泛化质量（principles），使评价覆盖表层要求与深层质量；案例研究表明该组合能纠正奖励模型偏好冗长输出的系统性误报。
- **对比量规生成（CRG）+ 偏好-标签一致性过滤**：以"提示 + 按偏好排序的回答列表（含负向对比）"为条件生成判别性量规，再以拒绝采样式闭环验证（组级准确率 ≥ τ=0.5 且成对预测正确）剔除噪声量规，保障合成数据的可靠性。
- **两阶段 Rubric-RM 及强实证收益**：将评估解耦为"量规生成 + 量规条件化判断"，Qwen-3-8B 主干在八个奖励建模基准上平均 70.1、超最强同规模基线 8.4%，voting@5 达 73.0 反超 RM-R1-14B 与 API 判断器；作为 DPO 奖励信号在 IFEval（79.5）、Arena-Hard SC（53.1）、WildBench（53.6）、HealthBench（23.8）上全面领先开源基线。
- **高效可摊销的推理设计**："短量规生成 + 轻量判断"替代长思维链，100 样本仅 130.77 秒（vLLM），量规可缓存复用，兼具可解释性与效率。

### 38 AutoRubric-R1V——量规化生成奖励治"推理-答案不一致"
- **识别并量化 answer-only RLVR 的失败模式**：仅奖励最终答案正确性会纵容含矛盾中间步骤的轨迹；将"推理—答案不一致"形式化为不一致率/假阳率，并证明朴素 RLVR 的不一致率在训练中持续上升（>20%）。
- **Strict Accuracy 忠实性评测协议**：由不接触真值的外部评判者验证"推理隐含结论是否与最终 boxed 答案一致"，答案对但推理不一致的预测判为假阳性剔除；人工复核召回率 >85%、精确率 >90%，可自动化且可靠。
- **量规自聚合，零人工标注、零更强教师**：借鉴测试时扩展/自洽性思想，每题采样 8 条轨迹保留正确者，对正确轨迹 >3 条的问题由纯文本 LLM（gpt-oss-120b）聚合跨轨迹一致复现的关键检查点为问题专属量规（平均每集 3.47 条、覆盖 67.26% 训练集），偶发步骤被过滤为虚假/多余。
- **量规奖励与可验证奖励加权融合进 GRPO**：$r_i=\lambda r^{\text{ans}}_i+(1-\lambda)r^{\text{rubric}}_i$；量规显式规定预期推理要求，评判者（gpt-oss-20b）只需文本比对、无需重新理解视觉输入，大幅降低评判开销；消融显示去掉量规/评判奖励后 Strict Acc. 53.24→49.43→47.06，增益随量规覆盖率单调上升。
- **准确率与忠实性双 SOTA + 数据效率**：基于 Qwen2.5-VL-7B-IT 平均 Strict Acc. 53.24（较基座 +8.00）、Standard Acc. 55.26，以 −2.02 的低不一致取得最优准确率—忠实性折中；训练平滑无振荡、抑制 reward hacking；10% 数据即匹敌全量朴素 RLVR，Geometry3K 迁移训练增益外溢至 MMMU/MMMU-Pro。

### 39 Proxy-GRM——代理引导批评的可迁移量规
- **量规可迁移性的可操作定义**：以"独立代理仅凭量规能否复现正确偏好判断"形式化量规质量，把批评理由（rationale）从不可观测潜变量变为可度量、可优化的训练目标，直指 GRM"答案对但理由错"的事后合理化风险。
- **代理引导的闭环量规验证**：训练严格只"消费"量规（而非生成量规）的轻量代理评测器，其预测准确率作为量规质量奖励注入 GRPO 复合奖励（$r = r_{acc} + r_{proxy} + 0.5 r_{format}$），首次在多模态设置中闭合量规质量监督回路，解决 LLM-as-a-Judge 不可微、昂贵、进不了训练环的开环局限。
- **过程保真优于纯结果优化**：SFT 型代理一致优于 RL 型代理，揭示纯结果奖励的 RL 会让评估过程内部不一致——验证类任务更需 SFT 式过程级保真。
- **极高数据效率**：仅约 5 万样本（约可比 SOTA 的 1/4）即在 VL-RewardBench 75.22%、Multimodal Reward Bench 85.62%、MM-RLHF-Reward Bench 82.94% 上取得 SOTA。
- **量规可复用 + 反直觉负结果**：学得量规使未见评测器大幅提分（32B 评测器 VL-RB 43.30→66.80）且无需再训练；多代理集成平均奖励一致大幅劣于单一代理（最佳组合低 12.51 点），对多信号奖励设计具有普遍警示。

### 40 AutoRubric-T2I——从偏好数据学习加权自然语言规则
- **首个 T2I 领域的规则学习框架**：从图像偏好数据自动合成、选择并加权显式自然语言规则集来指导冻结 VLM 评测器，把规则生成从"人工/启发式提示"升级为统计学习问题。
- **无限维稀疏逻辑回归 + 块坐标下降**：把"从无限规则空间选 Top-N"建模为 $\ell_0$ 约束优化并松弛为 $\ell_1$ 惩罚，工作集迭代扩展 + $\ell_1$ 自动剪枝冗余规则并赋学习权重，兼具统计可解释性与稀疏恢复理论根基。
- **课程分桶困难对挖掘的失败驱动闭环**：排错偏好对分小边际/大边际/高分错误三桶并按训练进程课程式调整采样权重，"失败诊断→规则提取"两阶段提示迭代扩展规则池；消融显示其为主要性能增量来源之一。
- **极端数据效率**：仅 256 对偏好数据（<0.01% 标注量）与 2–4 小时一次性精炼（4×A6000），替代 137K–798K 对标注的奖励模型训练。
- **免微调超越强标量基线且抗奖励作弊**：Qwen3-VL-8B 逐点评测器在 MMRB2 上 26.5%→62.5%，超微调的 HPSv3/UnifiedReward；Gemini-3-Flash 下 71.4% 超其成对基线；作为 Flow-GRPO 奖励一致提升生成质量（人工选择率 44.8%，p<0.001）。

### 41 AutoRubric-Reward——隐式偏好外化为显式量规即奖励
- **奖励建模的接口重构**：主张多模态对齐的瓶颈是"缺少因子化接口"而非"知识匮乏"——在任何成对比较之前，先用冻结 VLM 把内化偏好外化为提示词特定的可验证二元量规，全程零参数更新。
- **"生成-验证-精炼"流水线 + 层次化整合**：逐偏好对生成量规后由独立验证器检查能否恢复原偏好标签（约 87% 首轮通过、<4% 丢弃），再按"整体对齐/组合属性/局部细节"层级整合为单一协议，同时充当评委系统提示与奖励条件信号。
- **量规策略优化（RPO）**：把多维评估蒸馏为"胜者 +λ、败者 −γ"的二元优势并均匀分布到全部去噪时间步，直接嵌入 PPO 式裁剪 + KL 正则的在线目标——消除独立奖励模型、缓解奖励作弊、天然适应策略分布演化。
- **接口瓶颈的系统诊断**：基座 VLM 位置偏差 Δ=30.2–34.6 且不随规模缓解（结构性缺陷），量规条件化压至 8.9–10.3；跨模型量规迁移与基数消融（K=1→20 准确率单调升 4.6 点）共同证明收益来自偏好结构的显式因子化而非规模或耦合。
- **极高数据效率与评估-生成统一**：约 100 个偏好对即构建高质量量规；FLUX.1-dev 的 GenEval 0.66→0.80、DPG-Bench 83.84→85.76，Qwen-Image-Edit-2509 的 GEdit-Bench 7.54→7.85，评估保真度直接转化为生成质量。

### 42 CodeV——代码即动作空间，工具动作级过程奖励
- **揭示"高准确率掩盖不忠实工具使用"的系统性失效**：DeepEyes、Pixel-Reasoner 在 V* 上准确率很高，但答案正确的样本中仅 43%–57% 的中间裁剪真正包含目标物体——模型常靠选项等文本线索猜对答案，现有基准因此大幅高估视觉工具使用能力。
- **动作级忠实性评估协议**：不审查思维链 token，只审查工具动作的"视觉后果"——把中间裁剪图连同原问题交给 GPT-4o 判定是否包含被查询目标（任一裁剪命中即 faithful），得到独立于准确率、可复现的量化指标，天然抗"装饰性"工具调用。
- **TAPO（工具感知策略优化）**：把过程奖励直接定义在视觉工具输入/输出而非思维链 token 上——混合奖励 $R=\lambda_{acc}r^{acc}+\lambda_{tool}r^{tool}$，工具奖励仅基于"问题+沙箱输出"做证据检查（评判看不到代码与思维链），更难被奖励作弊；辅以红线负奖励与 $|\lambda_{tool}|<|\lambda_{acc}|$ 的正确性主导约束。
- **代码即动作空间 + 工程化沙箱**：视觉工具表示为受限沙箱中执行的 Python 代码（think/code/answer 统一进 token 级策略，无需外部控制器），沙箱在安全隔离、代码容错（自动修补/坐标 clamp/跨调用状态维持）与"可视化产物即观察"上做了系统设计。
- **双重实证收益**：忠实工具使用率达基线 1.3–2 倍（V* 68.0 vs DeepEyes 49.7、Thyme 7.0），同时 V* 84.8 超 GPT-4o（64.4）20 余分、MathVista 71.8 全场最佳（较 Qwen2.5-VL-7B 底座 +3.9）；消融显示步级工具监督是关键（TAPO 较仅准确率奖励 +3.0/+2.2），且训练中响应长度与调用数持续下降（抑制冗长作弊）。

### 43 VisTA——视觉工具选择的强化学习框架
- **免监督的端到端视觉工具选择 RL**：把"从同类异构工具库中为每个查询选工具"建模为 RL 问题，智能体凭试错与任务结果反馈自主学习，无需人工演示、详细工具描述或推理监督。
- **工具感知的对比式奖励设计**：同时评估"直接路径"与"工具增强路径"的答案正确性，以 +1/−0.5/0/+1 四情形奖励精确刻画工具有助/有害/中性/无变化的边际贡献，再经组相对优势归一化由 GRPO 优化。
- **智能体与推理器解耦的零成本可迁移性**：推理模型全程冻结、仅训选择策略，学得策略无需重训即可换用更强推理器——QwenVL 7B 训练的策略配 GPT-4o 后 ChartQA 从 79.4 升至 88.9。
- **极简工具提示接口驱动的经验学习**：提示仅含工具分类与索引，刻意省略功能描述与演示，迫使智能体靠 RL 经验发现工具真实效用，天然适配能力未知/文档不全的工具集成。
- **ChartQA-OoD 基准与多维行为分析**：通过移除文本标签 + 随机几何拉伸构造 OoD 测试集，VisTA 领先最佳基线 6.4 分；工具级伪上界、频率-效用相关（0→0.8+）等分析实证策略收敛。

### 44 Visual-ARFT——多模态智能体强化微调
- **首个面向多模态智能体（搜索+编程）的强化微调框架**：把"可验证奖励 + GRPO"的 RFT 范式从纯语言（Search-R1、ReTool）推进到视觉-语言模态，使开源 LVLM 学会 o3 式原生工具使用——调搜索引擎答多跳问题、写代码处理退化图像。
- **"格式奖励 + 模块化准确率奖励"体系**：最终答案奖 F1（比 EM 平滑、容忍语言多样性）、搜索查询奖 Sentence Transformer 语义相似度、代码块只奖"可执行"——全程无需偏好数据或学习型奖励模型。
- **对代码"零内容监督"的设计哲学**：不评代码正确性、对一切可执行代码块统一给 1 分——实证严格的正确性奖励会使模型收敛到少数确定性解法、损害跨场景泛化，是"奖励应管到什么粒度"的有启发性结论。
- **MAT 基准补齐评估空白**：首个多模态智能体搜索+编程基准（150 搜索 + 200 编程共 350 例全人工复核），编程侧自动化施加旋转/光照/模糊/噪声/裁剪六类退化且可组合，按推理复杂度分 Simple/Hard 子集。
- **极致数据效率与跨模态泛化**：仅 20 条搜索训练样本即在纯文本多跳 QA 上平均 +29.3 F1/+25.9 EM（7B），超越纯文本 LLM 训练的 Search-R1/ZeroSearch；3B/7B 在 MAT 上全面超越 GPT-4o——多模态训练到纯文本任务的意外模态迁移。

### 45 Thyme——超越图像的思考
- **"超越图像的思考"范式**：让 MLLM 在推理中自主决定是否/如何用工具，通过生成可执行 Python 代码一次完成裁剪、缩放、旋转、对比度增强与复杂数学计算的组合，突破此前"以裁剪思考"类方法的单一功能局限，在开源模型中逼近 OpenAI o3 式多功能工具推理。
- **GRPO-ATS 算法**：文本推理用温度 1.0 鼓励探索、代码生成用温度 0.0 保证可执行性（code token 动态切换）——既救回因代码错误报废的 rollout 样本，又防止模型坍缩为回避写代码。
- **低成本两阶段训练**：50 万样本 SFT 冷启动（六类场景数据 + 掩码沙盒/仅学最后一轮/数学退火三策略）约 200 GPU 小时激活全部功能，RL 阶段再以 GRPO-ATS 精炼决策。
- **自动容错沙盒**：危险操作扫描 + 10 秒超时保安全，autopep8 格式化、ast 修正越界裁剪框、预设变量、跨轮历史上下文——自动修复 7B 模型琐碎代码错误。
- **结果门控的一致性奖励**：$r=\text{Result}\times(1+0.5\times\text{Consistency})+0.5\times\text{Format}$，一致性加成仅在答案正确时生效；近 20 个基准上感知/推理/通用全面提升（如 MME-Real-Lite +11.1、LogicVista +9.2、幻觉 Overall +7.3）。

### 46 Pixel Reasoner——好奇驱动的像素空间推理
- **像素空间推理范式**：首次让 VLM 在推理链中直接调用 zoom-in / select-frame 等视觉操作主动检视视觉证据，突破纯文本 CoT 在视觉密集任务上的表达局限。
- **"学习陷阱"的识别与拆解**：热启动模型"文本强、像素弱"的落差会自我强化（新生操作多负反馈 + 多数查询可绕开操作），导致策略过早放弃视觉操作；论文用三类起点的训练动态拆解了成因与破解条件。
- **好奇心驱动的约束式 RL 奖励**：把"操作率 ≥ H、单响应操作数 ≤ N"写成约束优化，经带截断的拉格朗日松弛化为 $r'=r+\alpha\cdot\max(H-\text{RaPR},0)\cdot\mathbf{1}_{PR}+\beta\cdot\min(N-n_{vo},0)$——加分随掌握自动消退、防奖励作弊，截断设计避免过度满足并使 α、β 可固定。
- **带自反思的试错数据构造**（CodeV 所引用要点）：摒弃直接蒸馏（会产生"绕行轨迹"），用模板合成"全局分析→操作→局部分析→作答"轨迹并刻意插入错误线索（无关帧、过大裁剪框）构造"出错—察觉—纠正"示范；缺此数据的消融模型陷入"表面执行操作赚加分、无视错误"的作弊循环。
- **两阶段后训练实证**：7,500 条合成轨迹 SFT + 15,000 查询好奇心 RL，Qwen2.5-VL-7B 基础上的 Pixel-Reasoner 在 V\*（84.3，超 Gemini-2.5-Pro 5.1 分）、TallyQA-Complex、MVBench、InfographicsVQA 上全面领先开源模型并胜过多数带工具方法。

### 47 ReVPT——工具强化的视觉感知
- **视觉工具使用的 RL 配方（冷启动 + GRPO）**：不同于依赖昂贵数据生成与精细过滤的 SFT 路线（TACO/CogCoM），ReVPT 只需挑选合适视觉问题做 RL——先以 1.5k 条 GPT-4.1 合成轨迹冷启动基本工具技能，再用可验证二元奖励（格式 ∧ 答案对 = +1，否则 −1）的 GRPO 让模型自主探索工具策略。
- **R1-Zero 失败的实证诊断**：直接免冷启动训练多模态智能体会导致工具使用倾向渐进式消失（视觉任务非内在必须用工具 + 处理后图像构成分布偏移）——揭示小模型工具学习的核心困难，论证两阶段配方的必要性。
- **分布式工具控制器 + 四工具套件**：本地环境式工具控制器独立部署视觉工具服务，K 轮 rollout 中工具输出回传 LVLM 迭代推理；精选目标检测（开放词表）、放大、边缘检测、深度估计四个最适配感知任务的工具，兼顾功能覆盖与模型可学性。
- **主结果**：ReVPT-3B/7B 在 CV-Bench 上较指令模型提升 9.03%/9.44%（摘要口径），感知密集基准全面超越 SFT 与纯文本 GRPO 基线；BLINK-Depth/Relation 子集胜过 GPT-4.1 与 Gemini-2.0-Flash。
- **工具收益边界的系统分析**：合成"是否/为何用工具"提示 + 通用数据共同保住通用能力（否则感知专化训练拖垮 MMSTAR 等）；RL 后模型主动收敛工具频率、换用更有效工具；工具输出本身常出错甚至干扰推理（四类失败模式）——"视觉工具专家的价值随模型规模非单调"的论断为该方向提供罕见的清醒评估。
- **"工具使用的苦涩教训"**：冷启动示范不可避免注入人类工具选择偏见且 RL 后仍持续；算力驱动的自主发现（o3 动态代码生成）终将胜出——与 52 PyVision（动态工具发明）、42 CodeV（代码即动作空间）的走向互为印证。

### 48 SFT Memorizes, RL Generalizes——后训练范式的受控比较
- **等计算量受控比较揭示"RL 泛化、SFT 记忆"**：在规则与视觉两个正交分布偏移维度、纯语言与视觉-语言两种模态上，RL 的同分布收益一致迁移到未见规则/未见视觉分布（V-IRL-L +11.0%），而 SFT 一致退化（V-IRL-L 从 80.8% 崩落至 1.3%）。
- **GeneralPoints 可控环境**：自建算术推理卡牌游戏，通过人头牌取值规则与卡牌颜色变体，把"泛化"操作化为文本声明规则与视觉外观变化下的性能保持。
- **RL 提升 VLM 底层视觉识别**：扩大 RL 计算量同时提升卡牌识别率与成功率，扩大 SFT 则二者皆退化——提出 SFT 过拟合高频推理 token、忽视识别 token 的机理假设。
- **SFT/RL 互补分工的边界条件**：无 SFT 的 RL 因基座指令遵循差而全部失败，过度调优的 SFT 检查点也令 RL 无法恢复（坍缩回训练规则）——SFT 稳定格式、RL 贡献增益。
- **验证迭代是推理时缩放的关键杠杆**：同预算下 10 步验证带来 +5.99% OOD 提升而 1 步仅 +0.48%；副产品是开源模型在 V-IRL mini 基准达 77.8%，超此前闭源两阶段方法 33.8 个百分点。

### 49 ToRL——跳过 SFT 的工具集成 RL 扩展
- **跳过 SFT、直接从基座模型扩展工具集成 RL**：证明仅靠规则奖励（对 +1/错 −1）与不受限探索，工具使用能力即可从 Qwen2.5-Math 基座涌现，摆脱"蒸馏轨迹→SFT"的预设工具模式束缚。
- **把代码解释器嵌入 GRPO 采样循环的 TIR Rollout 框架**：检测到 output 终止符即暂停生成、送 Sandbox Fusion 执行、把 OBSERVATION 插回上下文续写，且刻意把报错信息回传给模型以促其自我修正。
- **四项工程化设计保障训练稳定高效**：工具调用上限控制 GPU 空闲、沙箱隔离执行、报错只截取最后一行、对沙箱输出做损失掩码（防止模型记忆执行结果）。
- **训练中代码行为的四维定量分析**：代码占比 40%→80%、通过率持续上升、正确答案对应更高代码通过率、有效代码占比提升——实证模型自主习得工具策略并抑制无效代码（一种元认知）。
- **关键设置消融与涌现认知行为**：调用上限从 1→2 提升约 2% 准确率但单步耗时 237s→288s；可执行性惩罚（−0.5）反而有害；训练后期涌现"据报错修代码"与"先推理后代码验证、发现矛盾即反思修正"等行为。主结果：ToRL-7B 平均 62.1%（+14.7），AIME24 43.3%，媲美部分 RL 训练的 32B 模型。

### 50 DeepEyes——无冷启动 SFT 的端到端"图像思考"
- **无冷启动 SFT 的端到端"图像思考"**：仅凭结果奖励（GRPO）从 Qwen2.5-VL-7B 训练，视觉定位能力原生涌现为"图像思考"——不需预收集推理数据、不需外部专用模型，是对 o3 未公开机制的开源式探索（V\* 达 90.1%，+18.9%）。
- **iMCoT 交错多模态思维链 + 原生工具调用**：模型每步推理后自主决定"直接作答"或"生成边界框→裁剪放大→裁剪图纳回轨迹"，文本与图像 token 在 MDP 状态中交错（式 1），感知与推理被联合全局优化。
- **条件式工具奖励**：$R = R_{\text{acc}} + R_{\text{format}} + \mathbb{I}_{R_{\text{acc}}>0}R_{\text{tool}}$ 把工具加成门控于答案正确——消融证明去掉它模型会停止感知动作、无条件奖励则停滞，唯有条件式带来持续上升的主动感知与最高准确率。
- **感知效用导向的数据治理**：三源数据（V\* 47% + ArxivQA 30% + ThinkLite-VL 23%）加多阶段过滤（难度治理→核验→感知效用过滤），专解"无 SFT 冷启动时 RL 初始采样效率"问题，表 10 验证三类数据互补协同。
- **三阶段训练动态与幻觉抑制**：主动感知经历"初步探索→高频调用→高效利用"演化并涌现视觉搜索/比较/确认/幻觉缓解四种类人模式；相关性图分析证明主动感知迫使模型用视觉证据覆盖语言先验、系统性缓解幻觉。

### 51 V*——引导式视觉搜索作为 MLLM 核心机制
- **确立"视觉搜索"为 MLLM 的核心缺失机制**：诊断当前 MLLM 依赖冻结的低分辨率 CLIP 编码器——既丢失高分辨率细节，又无法自知缺少何种信息并主动寻找；而人类靠"特征引导+场景引导"完成的高效搜索是多步视觉推理的前提。
- **SEAL 元架构**：VQA LLM 与视觉搜索模型经视觉工作记忆（VWM）协作——显式列出缺失目标 → 搜索回填 → 再作答，把"幻觉猜测"变为"指缺—找—答"，且与基座模型解耦、即插即用。
- **V\* 算法**：把 LLM 世界知识转化为搜索启发式（目标专属线索 + 上下文线索双通道 + 递归四分图 + 优先级队列），形式化为 A\* 变体；搜索长度 4.65 大幅优于随机/顺序基线（6.62–11.39）。
- **V\*Bench 基准**：191 张 SA-1B 高分辨率图（均值 2246×1582）人工精制属性识别+空间关系样本——多数 MLLM 近随机（~36%）、GPT-4V 仅 54.97%，而 7B SEAL 达 75.39%（人类 98.95%），证明瓶颈在视觉搜索机制而非语言推理。
- **认知科学呼应与完整训练配方**：V\* 搜索效率（2.80 步）逼近人类眼动引导（2.52–2.70 步，COCO-Search18），支持"LLM 常识可作视觉搜索先验"的 System II/视觉 CoT 论断；配套 100k 负样本 + 167k VQA + 120k 指令数据管线，通用基准基本无损（MME/POPE 反升），并发现坐标→空间关系的 grokking 现象。

### 52 PyVision——Python 为唯一原子工具的动态工具生成
- **动态工具生成而非静态工具调用**：不预定义任何静态工具集/视觉解析器，MLLM 针对具体查询与视觉输入即时编写并执行 Python 工具——把"调用工具"升级为"发明工具"，消除外部模型瓶颈。
- **工程化多轮智能体运行时**：MLLM 与隔离 Python 解释器的 n+1 轮循环，进程隔离 + 跨轮变量持久化 + 文件系统安全 I/O，配合系统提示协议（image_clue 预加载、code/answer 标签）使生成代码极少崩溃。
- **工具分类学与跨域模式分析**：用 text-embedding-3-large 对生成代码嵌入聚类，归纳出基础/高级图像处理、视觉提示与草图、数值统计四大类及长尾操作，并量化揭示任务敏感性（V\* 上裁剪占 83%+）。
- **"放大器"效应**：动态工具放大后端模型既有优势而非新增能力——感知强的 GPT-4.1 在 V\* 上 +7.8%，推理强的 Claude-4.0-Sonnet 在 VLMsAreBlind-mini 上 +31.1%（48.1%→79.2%），Qwen2.5-VL-72B 的结果（V\* +10.0% vs MathVision +1.7%）进一步佐证。
- **扎根视觉证据的可验证推理**：Ebbinghaus 反例等案例展示模型拒绝套用错觉模板、转而探查像素值并计算真实尺寸；附录公开完整系统提示与 10 类工具真实代码，可复现性强。

### 53 Beacon——知悉"何时"与"如何"用工具：诊断驱动的必要性感知 RL
- **MA/TE 双维度诊断框架**：首次把"何时用工具"与"工具净效应"纳入统一量化——模式适应性（MA_text：文本易样本少调工具 / MA_tool：文本难样本多调工具）与工具效应（Tool-Gain − Tool-Harm）；以 5 次采样的 text-easy/text-hard 分层替代单次推理的二元可解性判定（歧义样本剔除），实证揭示现有模型的结构性病灶——MA 有限、困难样本上的工具收益被易样本上的伤害大幅抵消（多个模型 Δ_TE≈0，相对纯文本推理几乎没有净提升）。
- **NAAR 必要性感知自适应奖励**：以"模式条件化标注 + 在线标注"双原则治前人局限（CodeDance 组级奖励可能错罚成功的工具轨迹、AdaTooler-V 教师标签分布失配、Metis 无差别劝退工具调用）——按当前策略的无工具/工具双模式表现在线判定每题必要性，文本可解时正确的代码回答仍得 0.25 部分分，从机制上化解"自适应"与"准确率"两个目标的冲突。
- **HCE 提示引导能力扩展**：直击 RLVR"全错组零学习信号、困难样本被浪费"痛点——两阶段流程生成答案无关的可靠提示注入 rollout，帮策略探索自身分布之外的行为；再以非对称重要性采样（新策略分子用原始 Prompt、旧策略分母保留提示）把提示辅助能力迁移回无提示策略，推理时不依赖提示；约 40% 的全错组被回收为有效学习信号。
- **防遗忘的 SFT 数据工程**：难度过滤（基座 5 次采样至多对 2 次）→ Gemini 3.1 Pro 轨迹合成（仅留答对者）→ 同模型精炼的三段式流水线；混入准确率 ≥0.6 样本的纯文本轨迹并对代码输出做损失掩码，使无工具推理不降反升（51.57% vs 基座 49.75%）。
- **诊断驱动的实证闭环**：13 基准开源最佳平均性能（11/13 项第一、超基座 +6.07 分）、Δ_TE +3.14%（其余模型约 0）、Text-Retain 91.00%——首个同时改善模式适应性与工具净收益的模型，证明"用得更多"与"用得更对"可以兼得。

### 54 CogCoM——操作链推理：先于 RL 浪潮的"操作即证据"SFT 先声
- **操作链（Chain of Manipulations, CoM）推理机制**：让 VLM 在单次生成过程中逐步主动执行图像操作（定位、裁剪放大、OCR 等）并以操作结果为证据推导答案——操作由模型内在能力驱动、不依赖外部工具执行，既提升答案忠实度，又让错误可逐步追溯，兼顾性能与可解释性；这是"操作即证据"范式在 2024 年初的奠基性实现，直接启发了此后"思考即裁剪"的 RL 浪潮。
- **基于大规模先导实验的 6 种原子操作形式化**：在 170K 个 TextVQA 问题上提示 GPT-4 生成解题动作、抽取动词短语，把 465 种动作聚类映射为 OCR、Grounding、CropZoomIn、Counting、Calculate、Line 六种原子操作并给出统一符号定义，同时允许推理时自创新操作——为"操作"概念提供了数据驱动的可扩展形式化基础。
- **级联式自动化数据生成流水线**：LLM 作语言标注器生成含占位符的解题步骤、视觉基础模型（GroundingDINO + PaddleOCR）作视觉标注器实例化操作结果，把顺序步骤展开为树后以 DFS 搜索"答案可达"的正路径——以金标准答案为硬约束自动过滤错误推理链，低成本产出 70K 高可靠 CoM 样本（另 7K 专家标注图形数学样本）。
- **基于 KV 记忆的多轮多图兼容架构**：在 CogVLM 四组件架构上以跨轮累积、按需截断的 KV 记忆机制支持多轮多图输入，使"裁剪产生的新图像回接进上下文"与现有 VLM 训练体系完全兼容，CoM 样本可无损转换为标准多轮 VQA 格式。
- **推理链质量的直接度量与工程经济性**：4 大类 9 基准全面超越通才模型（GQA +5.97、ST-VQA +9.0、8 个定位子集 6 个最佳），并专门构建 CoM-test 测试床与"关键点感知 + BLEU"加权度量直接评估推理链正确性；注入 CoM 的第二阶段训练仅耗 160 A100×天（约预训练总成本 4%），移除 CoM 数据的消融（TextVQA −6.6）证明增益确来自带证据的视觉推理而非数据增量。

### 55 VTC-Bench——组合式视觉工具链的生态级体检
- **大规模真实工具集**：以 OpenCV 为源精选 32 种视觉操作（几何/增强/特征提取/绘图四模块），工具数量与多样性远超此前基准（最多 14 个）且与真实 CV 流水线对齐，根治"稀疏工具集"问题。
- **三层九任务认知层级设计**：把 9 类任务组织为"视觉感知增强 → 定量视觉估计 → 组合式视觉推理"的递进层级，系统刻画从被动感知到主动构建式推理的完整能力谱系，而非零散任务堆砌。
- **真值工具链与细粒度诊断指标**：每题配人工核验的参考执行轨迹（平均 5.04 步、4.97 个独立工具），据此提出有效工具链、TCR、MAE、$Eff_{\text{tool}}$ 等指标，使评估深入中间规划质量而非仅看最终对错。
- **代码与接口双范式评测协议**：同时支持 Python 代码生成与预定义接口调用（Qwen-Agent + Thyme 框架、规则匹配 + LLM-as-a-Judge 双流判分），实证接口调用整体与代码调用相当、多数闭源模型上甚至更优——颠覆"代码执行天然更优"的假设。
- **19 个领先模型的能力诊断**：最强 Gemini-3.0-Pro 仅约 51%；闭源工具收益显著而开源微薄甚至倒退；工具选择窄化（集中于 Zoom In、Rotate 等熟悉操作）、链长不足"走捷径"、过度依赖未验证中间结果——为"从被动感知到主动多步编排"给出生态级瓶颈清单。

### 56 ViGoRL——把每一步推理都锚定到图像坐标的接地强化学习
- **显式空间接地的推理步骤重构**：把 VLM 推理每一步从纯文本重定义为〈思考 $s_t$， 坐标 $(x_t,y_t)$〉元组并相应修改策略的自回归分解——模型必须为每条思考提供图像位置证据，这是把"接地"作为核心认知行为注入 VLM 的关键设计，与所有"纯文本思考"RL 方法本质区别。
- **MCTS 引导的接地热启动蒸馏**：鉴于 RL 只能放大基座已有行为，用 72B 教师配合 MCTS 系统性搜索接地推理空间，从 1,500 提示构造约 3 万条含"直接链"与"修正链"（含回溯）的轨迹做 SFT，在 RL 之前就把区域探索、视觉验证与回溯行为植入小模型。
- **带接地格式奖励的 GRPO**：总奖励为格式项与任务项加权和，格式奖励显式要求坐标引用全部有效且标签规范——直接强化"接地且正确"的序列，避免普通 RL 在只优化最终正确性时坍缩为未接地的语言捷径。
- **多轮 RL 与可缩放视觉反馈（"交互式显微镜"）**：模型预测坐标后可发起 crop 工具调用、环境返回以该坐标为中心的高分辨率裁剪图，形成"预测坐标 → 观察放大视图 → 继续推理"闭环；配合语法奖励与多样性奖励稳定多轮训练，V*Bench 达 86.4%。
- **行为学放大效应实证**：GPT-4o 行为编码显示接地把区域探索（1.44→3.5）、接地子目标（0.07→1.1，15 倍）、视觉验证（0.14→0.39）显著放大，并催生所有基线都不具备的视觉回溯（0→0.47），使 3B 模型（0.64）追平 72B（0.65）；人类评估确认 72.8% 坐标空间准确且有用性 3.81/5——性能与可解释性双收。

### 57 OpenThinkIMG——开源端到端工具增强全栈框架与 V-ToolRL
- **首个开源端到端工具增强 LVLM 全栈框架**：把"异构工具标准化接入（统一注册表）—分布式容器化工具服务（独立部署、故障隔离）—工具控制器动态编排—SFT/RL 一体训练"整合为开放框架，直接回应工具接口不统一、基础设施缺失的领域痛点。
- **V-ToolRL 视觉工具强化学习**：把 GRPO 从纯文本扩展到含视觉工具 rollout 的智能体场景——工具返回的视觉输出直接纳入状态与优势估计（重要性比率以工具输出为条件），仅凭最终答案 "+1/-1" 规则化终端奖励，模型自主学会何时、调用何种、按何顺序使用工具。
- **可扩展的三阶段视觉轨迹合成管线**：GPT-4o 少样本任务分解做符号化规划 → JSON 批量补全工具调用（输出缓存、批量并行）→"畸形剔除 + 72B 模型与规则双重校验 + 人工把关"多级过滤，以"轨迹能否导出有效答案"为去留判据，为冷启动与 RL 提供低成本高质量数据。
- **小模型战胜大模型的实证突破**：Qwen2-VL-2B 的 V-ToolRL 在 ChartGemma 达 59.39%（较基座 +29.83、较 SFT +13.72、较纯文本 RL +7.76——后者单独验证了视觉反馈的独立贡献），超参数大 4–6.5 倍的 Taco-8B（30.50%）与 CogCom-13B（15.07%），超 GPT-4.1（+8.68）、逼近 Gemini。
- **RL 自发塑造高效可解释的工具行为**：训练中每样本平均工具调用数从 0.63 降至 0.10–0.12（"答案才给奖励"压力下学会"少而准"）、推理叙述反而更长（66→83-86 token），带视觉反馈的奖励准确率全程高于纯文本 RL 且收敛更快——RL 在塑造行为经济性上的独特价值得到直接证据。

### 58 DeepEyesV2——代码执行与网络搜索统一进单一推理循环的智能体多模态模型
- **统一多工具的智能体推理循环**：首次在单一推理轨迹中把 Python 代码执行、图像搜索与文本搜索作为可交错组合的互补工具，由模型自主决定何时如何调用，实现"感知—搜索—推理"闭环协同，突破以往单工具、割裂模块方法的局限。
- **先导实验驱动的两阶段训练范式**：以严格先导实验证明直接 RL 无法让 MLLM 习得可靠工具调用（模型放弃写代码、或用占位符代码骗奖——奖励黑客现象），据此确立"冷启动 SFT 建立工具模式 + 智能体 RL 精炼调用"流程，RL 仅用准确率与格式两个简单奖励、无需复杂奖励工程。
- **工具收益导向的数据构建**：基座 8 次采样至多 2 次答对的难度过滤 + "带工具 8 次采样成功率"分类，把样本分为工具可解（用于 RL）与工具仍不可解（用于冷启动），强模型合成答案正确、代码无误的轨迹并补长 CoT——冷启动与 RL 数据互为补充。
- **RealX-Bench 综合评测基准**：300 题、5 个真实领域，感知/搜索/推理三轴非互斥标注（24% 题目同时考验三种能力），答案唯一且可程序化自动验证；首次系统揭示现有最强模型（平均 46.0%）与人类（70.0%）在能力整合上的巨大差距。
- **任务自适应与可泛化工具行为的涌现**：感知任务偏好图像操作、推理任务偏好数值计算；RL 后调用频率下降但方差保持高位（自适应而非固定模式），出现"裁剪+搜索"等复杂跨工具组合，并在未见的 TIR-Bench 与新增函数调用工具上零样本泛化——真正的智能体化推理。

### 59 V-Thinker——数据演化飞轮驱动的交互式图像思考
- **交互式图像思考的范式形式化与端到端实现**：把"与图像交互式思考"形式化为"文本思考 + 代码操作 + 环境执行 + 视觉反馈"的闭环，训练出能自主生成、执行并迭代精炼视觉代码的通用推理器；选择开放式代码而非封闭工具集作为交互媒介，从根上解除视觉动作空间的表达上限。
- **数据演化飞轮（Data Evolution Flywheel）**：以知识概念与视觉工具双锚点共同演化，配合检查—修复协同校准与渐进扩展，从零合成 40 万量级的 V-Interaction-400K；五轮迭代后知识系统规模约为种子的 50 倍且无饱和迹象——"模型即数据创造器"范式的可扩展性得到验证。
- **视觉渐进式训练课程**：先以 V-Perception-40K 做点级感知对齐，再经冷启动 SFT 与沙盒 GRPO（准确率 + 格式 + 条件化工具使用复合奖励）对齐交互推理；消融证实每阶段不可或缺——RL 带来 6 个点以上通用推理增益，感知地基缺失则交互能力随之松动。
- **专家验证的 VTBench**：专收"本质上需要视觉交互"的任务（五位专家至少三位认定必要方可收录），覆盖 9 个开源基准、4 个领域、感知/指令引导交互/交互推理三维度的 1,500 样本——"必要性优先"准入标准为交互式推理补上专属度量衡。
- **"交互思考"双重价值的系统实证**：V-Thinker-7B 在 VTBench 较基座平均 +12.5 个百分点（指令引导交互 +22.8，感知维度超 GPT-4o 与 78B 级开源模型），且不引入领域内数据即在 MathVision 等通用基准 +6.3——"学会改图"与"学会解题"之间存在正向迁移。

### 60 CodeDance——组级准确率自适应奖励的可执行视觉推理
- **可执行代码作为视觉推理的统一通用媒介**：模型不再受限于"预测边界框再裁剪"的固定 schema，而是自主定义、组合并执行代码来编排多工具、计算中间结果、渲染可自检的视觉产物（框、线、图）——代码同时承载调用与程序逻辑（顺序/条件/循环/数值计算），复合策略无需预定义即可表达，新增工具只需暴露 API。
- **基于组级准确率的难度自适应两级奖励 $R_{\text{BAT}}$**：序列级奖励以 GRPO 组内准确率 $\mu_{\text{acc}}$ 为在线难度信号，用缩放因子 $d=\sigma(\gamma(0.5-\mu_{\text{acc}}))-\delta$ 动态调节——难题放大工具收益、简单题抑制冗余调用（翻转阈值 $\mu_{\text{acc}}^\star\approx0.85$ 后 $d<0$ 为有意设计）；回合级对执行失败施加即时惩罚并按折扣累积，提供密集纠错信号并缓解熵坍塌与奖励欺骗。（Beacon 批评其未以"轨迹是否实际调用工具"为奖励条件、可能错罚成功的工具轨迹——该争论见 53。）
- **面向自适应工具调用的冷启动数据工程**：34K 多轮"推理—代码—观察"交错轨迹，弱到强难度分层过滤 + 图像变换/数学计算/开放式视觉编辑三类原子监督，由 Qwen2.5-VL-72B 交叉验证；数据本身按难度决定是否调工具（简单题直接作答、难题启用代码），从源头抑制工具刷分。
- **RL 阶段的涌现行为及其系统验证**：仅经原子操作监督的模型在 RL 中自发涌现跨任务工具迁移（图表的边界框操作迁移到计数）、新颖工具组合（打点+裁剪、画框+裁剪）与 SFT 未定义的新工具代码，且经"数据 5K→34K、模型 3B→7B、步数与轮数扩展"四维实验证实随计算预算持续增强——"监督给积木、奖励促组合"。
- **7B 规模的强性能**：计数、视觉搜索、图表、数学等 10 余基准超越 GPT-4o 与 Qwen2.5-VL-32B 及 DeepEyes/Pixel Reasoner/Thyme 等工具基线（PixmoCount 77.1、相对提升 53.0%），消融验证自适应奖励在"准确率—轮数—执行成功率"三维上同时占优（68.1 / 1.38 轮 / 0.99）。

### 61 AdaTooler-V——教师标注工具收益分数的自适应工具使用
- **"该不该用工具"的决策范式**：首次把 Thinking-with-Images 方法的核心问题从"如何用好工具"重新表述为显式决策问题——不需要工具的问题走纯文本 CoT、需要的渐进调用视觉工具，同时优化性能与推理成本（响应长度随训练自发下降而准确率上升）。
- **AT-GRPO 与工具收益分数驱动的自适应奖励**：按逐样本工具收益分数 $\Delta S$ 的符号与幅度对工具奖励做自适应缩放——有益时奖励且随调用次数增长、无益时惩罚，配合以 $n_{\text{max}}$ 为中心的高斯包络抑制"调用过少"与"滥用"两种极端，嵌入 GRPO 的组归一化优势与 KL 约束。
- **教师模型驱动的样本级"工具需求"标注（亦是主要争议点）**：用 Qwen2.5-VL-72B 对每样本做"带工具/不带工具"各 8 次对照求解、以平均准确率之差离线计算 $\Delta S$ 作为"需不需要工具"的真值标签——该机制把"自适应"变成可学习信号，但标签质量受制于单一教师的工具使用上限与采样噪声；Beacon 批评其教师派生监督存在策略-教师分布失配，作者亦在附录承认有偏风险并提议以可学习估计器改进。
- **跨模态大规模数据集与两阶段训练**：覆盖单图/多图/视频约 30 万样本、十余类技能的 AdaTooler-V-300k（四种规则化奖励：精确匹配/数值匹配/WER/ROUGE）+ 教师 CoT 标注的 AdaTooler-V-CoT-100k；先 SFT 冷启动建立工具交互先验，再 AT-GRPO 突破 SFT 的模式匹配行为。
- **12 个图像/视频基准全面领先**：V* 89.8%（超 GPT-4o 24.6 分、超基座 11.3）、MathVista 74.5%、MMSI-Bench 36.8、SPAR-Bench 40.3；视频侧 32 帧即达 VSI-Bench 46.7、Video-Holmes 55.6（基座 27.8，翻倍）；训练阶段/α/工具使用三组消融闭环验证组件必要性，全开源。

### 62 Metis——HDPO 分层解耦的元认知工具使用
- **"盲目工具调用"问题的系统形式化**：首次把智能体多模态模型的核心缺陷定性为"元认知缺失"——无法在内部参数化知识与外部工具间仲裁；实证现有智能体工具调用率普遍高达 80%–90% 以上，造成延迟与噪声双重代价，为"何时不用工具"建立研究议程。
- **耦合奖励失效的数学机理**：通过方差分解与一阶泰勒展开严格证明——标量化"精度 + α·工具惩罚"奖励中，效率信号的梯度贡献被 $\mathcal{O}(\alpha)$ 上界与精度方差双重压制，并伴随梯度纠缠、语义歧义、超参脆弱三种病态；从理论上解释"惩罚式方法为何注定无法遏制工具滥用"。
- **HDPO 分层解耦策略优化**：把工具效率从竞争性标量目标重构为严格条件化目标——精度通道在全部 rollout 上做标准 GRPO，效率通道仅在"正确轨迹合格集"内部做条件优势估计（$|\mathcal{Q}|\geq2$ 才生效），两通道独立归一化、仅最终损失处加权合并，彻底消除协方差引起的梯度干扰。
- **隐式认知课程**：训练早期合格集为空、优化由精度主导；推理能力成熟后效率信号平滑放量——无需手动奖励调度即自然形成"先学会正确、再学会高效"的两阶段发展轨迹。
- **元认知数据治理与 98%→2% 的实证闭环**：沙箱执行根除幻觉环境动态、pass@8=1 过滤隔离真实工具必要性、元认知裁判过滤 + RL 数据双重校准；Metis 把工具调用率从 98% 压到 2%（降幅逾 90%）同时刷新感知/文档/数学 SOTA（CharXiv(RQ) 54.1、WeMath 65.2、五基准平均 66.9）——证明执行效率与推理精度相互催化而非此消彼长。（Beacon 批评其"总体劝退"缺乏任务依赖自适应性、可能压制必要调用——见 53。）

### 63 AVA——美学评价的"分布 + 语境"数据范式起点
- **首个大规模异构美学数据库**：25.5 万张 dpchallenge 图像（规模约为此前最大库的 20–70 倍），每图 78–549 票（平均 210 票）的完整评分**分布** + 66 个语义标签 + 14 种摄影风格标签；刻意保留评分模糊的难样本（CUHK 系只留极端共识图）——把"多主体评判不压平成均值"确立为数据设计原则。
- **评分分布的系统统计刻画**：分布大体高斯（99.77% 图像均值落在 2–8），非高斯偏斜源于量表端点效应、可用 Gamma 镜像变换建模；"均值-方差矩阵"把图像按"质量 × 常规性"划入四象限、高方差对应非常规题材——"争议度"自此成为均值之外可量化的观测量。
- **语境 × 偏好的量化分析**：利用每图绑定挑战赛的独特设计，发现负向低唤醒主题（Despair/Fear/Bored 等）系统性拉低评分、自由创作类方差最低——"语境 × 偏好"结论只有在分布与语境同时保留的数据上才能得出。
- **"规模 × 无歧义"双效应实验**：训练规模扩大与 δ 剔除歧义训练图像等效提升精度（测试集不清洗、更真实）；单个大规模通用模型全面超过逐类专用模型——直接支撑后续推荐/个性化场景，也开辟了风格分类新任务（53.85% mAP）。

### 64 AADB——评分者身份、属性与内容自适应的排序网络
- **唯一跨图记录评分者身份的美学数据集**：1 万张人工清洗 Flickr 真实照片，每图 5 位评分者的美学分 + 11 个摄影属性连续置信分 + 匿名评分者 ID——"评分者内一致性"可被建模，"模型 vs 单个评分者"的人机对比（模型 ρ 0.6782 vs 平均评分者 0.6738、高产者 0.7112）首次成为可能。
- **回归 + 成对排序的联合形式化**：孪生网络以排序损失直接建模图像对相对次序、回归损失锚定评分尺度；within-rater/cross-rater 混合采样（0.6515 > 纯跨评分者 0.6308）证明收益来自评分者信息而非数据量——"标注信息量 > 标注数量"的干净实证。
- **属性 + 内容双自适应、测试免标签**：属性分支作深度监督正则（部分标注即可用），内容侧以无监督 k-means + softmax 软门控组合内容特定评分分支（测试时无需类别标签）；排序学习"顺带"在 AVA 刷新分类 SOTA（77.33%，比此前低分辨率最佳 +4.48pp）。

### 65 FLICKR-AES——"美学是个人化的"首次系统实证
- **问题确立 + 可行性证明**：对 111 位真实标注用户计算"个人评分相对均分的残差"与 10 美学属性/10 内容类别的秩相关，全部高于高斯随机用户对照——个人审美偏离是与内容/属性系统性相关的可预测信号，而非噪声。
- **按"用户"而非"图像"划分的数据协议**：FLICKR-AES（4 万图、210 位标注者、约 20 万条评分、保留身份）训练/测试按标注者划分、图像零重叠，精确模拟冷启动；REAL-CUR（14 位真实用户自评相册）提供真实场景试金石。
- **残差适配 PAM + 面向回归的主动学习**：通用美学 CNN + 20 维属性/内容紧凑特征 + ν-SVR 回归残差，每人 10 张标注即超通用模型、100 张时相关性 +0.039（优于协同过滤 +0.010）；Active-PAM 双准则序贯选择在未见图像上优势更显著——个性化美学的完整基线框架。

### 66 NIMA——评分分布预测与 EMD 损失
- **单值 → 直方图分布**：ImageNet 预训练 CNN（VGG16/Inception-v2/MobileNet）端到端输出 1–10 分桶概率，一次前向同时导出均值（美学/质量水平）与标准差（人群分歧/非常规性）——模型首次能表达"这张图争议很大"这类分布层判断，与 AVA 的"高方差 ≈ 非常规"实证直接呼应。
- **平方 EMD 损失引入质量/美学训练**：按分数桶有序结构以 CDF 差范数惩罚误分类，同时提升均值精度（AVA SRCC 0.612，超此前最优 0.558）与分布拟合（EMD 0.050）；架构极简（仅换最后一层），并提供移动端 3.22M 参数版本。
- **"评分即先验"的闭环应用**：NIMA 分数作目标函数搜索色调增强/去噪算子参数（726 种组合中自动找到美学近优设置、去噪自动适配平滑强度），全程无参考——预示"感知损失驱动图像增强"范式（作者随后在 ICCP 2018 发展为可微训练框架）。

### 67 MUSIQ——任意分辨率 IQA 的多尺度 Transformer
- **绕开 resize/裁剪的范式转移**：原生分辨率全图 + 保持长宽比的缩放变体切固定尺寸块、拼多尺度 token 序列，把 ViT 范式引入 IQA——大图主导的 PaQ-2-PiQ 上 SRCC 0.646 vs 此前最佳 0.601，直接验证原生分辨率输入的价值。
- **HSE + SCE 双位置编码组件**：图像块位置按比例哈希到共享 G×G 可学习网格（任意长宽比 + 隐式跨尺度空间对齐 + 对注意力零侵入），尺度嵌入显式标记 token 来源尺度——AVA 上 0.707→0.726，并给出网格尺寸经验法则 $G\times G\times P\times P\approx H\times W$。
- **为 IQA 量身定制的训练协议与完整证据链**：预训练跳过方形缩放（预先适应可变长宽比）、推理单次前向免多裁剪近似；拉伸探针实验证明可检测不自然缩放退化；27M 参数即匹配 ResNet-50 量级，4 个大规模数据集 3 个 SOTA + AVA 最优 MSE。

### 68 PARA——人格画像作为个性化美学条件
- **"面向图像 + 面向人"双视角标签体系**：31,220 图 × 438 名被试 × 13 维（9 项客观属性 + 内容偏好/判断难度/情绪/分享意愿 4 项主观属性）≈ 972 万条标注，全面超越 AADB（60 万条/190 人）与 FLICKR-AES（20 万条/210 人）；并首次随库发布 BFI-10 大五人格等脱敏被试画像。
- **心理学量表 × 美学标注的系统关联**：高神经质被试的属性-美学相关结构显著区别于其他人格组、高外向性更看重内容（PLCC>0.8）；低分图像更难判断、情绪-美学强相关——个性化审美偏好可被主观属性"镜像"反映的大规模证明。
- **条件化 PIAA 的首次计算验证**：人格/艺术/摄影经验作为条件先验乘入网络末层输出（先条件化 GIAA 再微调 PIAA），三种少样本设定均稳定优于无条件组（100-shot SROCC 0.7046 vs 0.6952）；配套四道招募门槛 + 场次锚定/重复标注的主观实验质控协议。

### 69 CLIP-IQA——反义提示配对的零样本评估
- **零训练 IQA 路线的开辟**：冻结 CLIP 图文对齐先验直接充当质量感知（look）与抽象感知（feel）评分器，KonIQ-10k SROCC 0.695 优于有监督 CNNIQA——手工 NSS 特征与标注监督之外的第三条路线。
- **反义提示词配对机制**：Good/Bad photo 的 Softmax 相对相似度（等价于反向对数几率差）化语言歧义为对比，仅此一项把 SROCC 从 0.116–0.214 提至 0.695；移除位置嵌入 + ResNet 主干选型（卷积归纳偏置弥补位置信息）支持任意尺寸输入。
- **"提示词即指标"范式 + 极轻量校准**：换任意属性反义词对即插即用地评估自定义维度（亮度/噪点/自然-合成/情绪等），AVA 人机一致率约 80%；CLIP-IQA+ 仅微调两个提示词嵌入即比肩 SOTA（0.895+），每个新领域只需存储两个提示词——领域迁移成本压缩到极致。

### 70 DOVER——美学/技术解耦的视频质量评估
- **DIVIDE-3k 多视角主观研究**：3,590 个 UGC 视频 × 45 万条意见，首次同时收集美学/技术/整体三套标注并首创"主观推理"占比标注；$\mathrm{MOS}\approx0.428\,\mathrm{MOS}_A+0.572\,\mathrm{MOS}_T$（SROCC 0.9834 优于任何单一视角）——"UGC 质量意见为何模糊"首次从直觉变成可测量的事实。
- **输入端"视图分解"**：美学视图 = 空间下采样 + 时间稀疏采样（保语义构图、降低失真敏感度），技术视图 = 7×7 裁剪块拼接 fragment + 连续帧采样（保失真、弃内容）——两分支各配归纳偏置（AVA 预训练 + 跨尺度正则 / 弱全局语义保留），从输入构造层面避免拟合模糊标签。
- **FAST-VQA 级效率全面 SOTA + 双分数输出**：LSVQ 全集与三个小数据集全部第一（282.3 GFLOPs、1080P 10s 视频 47ms），美学/技术分支分别可读且与对应视角意见相关性高约 7%——同一模型可分别服务相机质量度量（技术）与内容推荐（美学），调整融合权重还能面向不同人群。

### 71 AesBench——MLLM 美学感知的四维专家基准
- **EAPD 专家标注数据库**：2,800 张自然/艺术/AI 生成图像，由 32 位按六维度严格遴选的美学研究者/教育者/美术生标注，8,400 个问答对 + 2,800 条专家美学解释——标注主体（专家 vs 众包）与标注深度（解释）的双重升级。
- **AesP→AesE→AesA→AesI 四维阶梯**：感知（属性识别）→ 共情（情绪共鸣）→ 评估（评级/细粒度分数）→ 解释（成因分析），每维 × 4 题型交叉组织——把"美学能力"从单点打分解构为由浅入深的完整能力链路。
- **GPT 辅助评测策略**：显式回答规则比对 + 模糊回答交 GPT 判定的二段式方案，把不可控的 MLLM 自由文本评测转化为已验证可靠的纯文本评测范式。
- **15 个 MLLM 全景诊断的反直觉发现**：最强模型也仅初级美学感知（评估最高 52.86%）；Q-Instruct 感知第一而解释垫底、GPT-4V 恰相反的"感知-解释错位"；解释精确性显著低于相关性（幻觉量化）；AI 生成图像上普遍最差——为后续研发给出明确短板清单。

### 72 AesExpert——人类反馈驱动的美学专家化
- **人类主观实验取代机器标注作为数据源头**：48 名多元受试者按 ITU-R 标准以三级渐进式问题对 21,904 张图给出 88K 条自然语言评论（AesFeedback）——从源头抑制幻觉（美学解释精确度 +44.6%），而纯网络众包的 AVA-Comments 在同等设置下几乎无法提供有效美学信息。
- **"人类反馈 + GPT-4 扩展"两级流水线（88K→409K）**：人类评论直接作指令/响应 + GPT-4 以人类评论为语义锚生成 VQA/选择题（AesMMIT 覆盖 6 个美学维度 × 4 类题型）——规模与查询多样性扩展的同时不脱离人类反馈。
- **轻量"美学专家化"微调的跨骨干验证**：冻结视觉编码器、仅微调投影层与 LLM，LLaVA-1.5-7B/13B 与 mPLUG-Owl2 一致有效且不破坏通用知识；连 7B 版总分（86.89%）都超 GPT-4V（80.80%）约 6 分——收益来自数据配方而非模型规模，与 AesBench 构成"基准-数据-模型"研究闭环。

### 73 Q-Eval-100K——文生视觉质量与对齐解耦评估
- **迄今最大的文生视觉 MOS 数据集**：100K 实例（60K 图像 + 40K 视频）× 960K 条人工标注，视觉质量与文本对齐**分别独立打分**、T2I/T2V 双模态覆盖——标注量为此前最大同类数据集的两倍以上；Sample & Scrutinize 分批门控质控（5K 金标分、SRCC>0.8 验收）兼顾规模与准确度。
- **面向 LMM 的"语境提示 + 形容词等级化"SFT 范式**：人类评估流程显式编码为 CoT 式语境提示，绝对 MOS 映射 Bad~Excellent 五档离散等级（离散等级更易学），CE+MSE 联合损失，推理时按等级 token 概率加权平均恢复连续分数——统一框架同时学会质量与对齐两个解耦任务。
- **Vague-to-Specific 长提示策略**：发现微调后模型对 >25 词长提示系统性低估对齐分，将其拆为"模糊提示 + ≤3 条特定提示"分别评估再融合（长提示子集 SRCC 0.591→0.620）——验证了高质量人类标注扩充对评估器性能的可预测提升（Scaling Law 实证）。

### 74 FPEM——直播美颜场景的人脸先验增强吸引力预测
- **首个"直播 + 美颜"FAP 数据集 LiveBeauty**：从真实直播平台 9,500+ 频道采集 10,000 张人脸（逐小时采样、清洗虚拟头像/同人重复），20 名受试者依 ITU-R 规范产出 200,000 条标注——最大的开放获取 FAP 数据集，且首次覆盖"美颜处理后"的人脸吸引力分布（此前数据集要么小、要么闭源、均不反映直播美颜特征）。
- **人脸识别先验补齐美学短板（PAPM）+ CLIP 分级锚点回归（MAEM）**：冻结 FaceNet 先验以交叉注意力注入 Swin 多尺度主干（数据匮乏的 MEBeauty 上增益最大 +0.077 SROCC）；CLIP 以 bad/poor/fair/good/perfect 五级文本锚点的相似度 softmax 期望作回归输出（零样本仅 0.3838 → 完整适配 0.9198，证明关键在适配而非 CLIP 原生能力）。
- **心理学先验的结构化监督 + 两阶段选择性融合**：Thurstone 比较判断模型的成对保真损失 + 双向排序损失强制等级分布自峰值向两侧单调递减（编码"吸引力感知单峰"特性）；SFM 以通道级自适应软权重（$a+b=1$）融合两路特征——LiveBeauty SROCC 0.9243，并带来全部配置中最强的跨数据集泛化（MEBeauty 0.6299）。

### 75 VGA-Bench——视频美学 21 维统一基准
- **美学从 1 维扩展到 21 维（共 52 维三层体系）**：美学质量 10 维连续评分 + 美学标签 11 类离散属性（三分法构图/逆光/浅景深等）+ 生成质量 31 子维——美学被同时建模为"打多分"与"是什么"，评估从"好不好看"走向"美在哪里、为何美"的可复现分析。
- **"被评维度必须在提示词中显式指定"的维度对齐原则**：LLM 三策略差异化生成 1,016 条提示词 + "-1 无效问题"废弃机制，从源头抑制主观臆断；三个专用多任务评估器（VAQA/VTag/VGQA-Net）取代 MUSIQ/DINO 等外部打分模型，让美学指标本身成为可训练可迭代的资产。
- **"真实影像美学预训练 → 生成视频微调"迁移 + 跨模型留出检验**：评估器不许见过被评模型（3 训 3 测零重叠）——同类基准中少见的严格设计。
- **"美与真解耦"实证**：12 个主流模型（SVD→Sora2）× 6 万视频的最大整合测试平台；Sora2 美学第一（0.50）但生成等级落后（0.54 vs SVD 系 0.55）、美学标签分类全场最低（0.18）——美学与保真各自独立的直接证据。

### 76 FGAesthetics——系列内相对排序的细粒度美学
- **FG-IAA 任务重定义 + 首个大规模基准**：从"单图独立绝对评分"转向"照片系列内相对排序判别"；32,217 张图 / 10,028 个系列 / 44,863 标注对，覆盖自然/AIGC/密集裁剪三大类八个来源，"指标-MLLM-人工"三级精炼 + 成对比较排序校准。
- **DiffToken + CTAlign + RankReg 三件套**：RGB-SSIM 逐块选取"美学决定性区域"保原始分辨率、其余区域降采样（固定开销下兼得局部差异与全局构图，系列级 0.600 vs 0.423 的最大单项贡献）；GPT-4o 比较文本引导视觉差异对齐语言空间（推理零开销）；Bradley-Terry + ListMLE 让绝对分数天然满足系列内次序。

### 77 A³——广告美学的法则化评估
- **A³-Law 三阶段递进法则体系**：AIDA 启发的"感知注意→形式兴趣→欲望影响"，每条规则锚定具体理论（信号检测论/知觉流畅性/格式塔/符号学/情绪评估）——抽象的传播学心理学理论首次变为可直接用于标注、训练与评估的可执行规则。
- **双阶段质控数据 + 差异化工具设计**：30K 广告图 × 120K 指令-响应对（客观题准确率 >0.93、检测 IoU >0.92、评分 SRCC >0.85 验收；CoT 由 5 专家多数票迭代至 85% 接受率）；只为三条有计算代理的规则配轻量工具（色相/色彩度/OCR），促销图像志刻意不给检测器逼迫模型自主感知——直接转化为"定位 mAP 0.701 vs 现有最强 0.283"的代差。
- **与美学判断结构匹配的多信号 GRPO**：格式/准确性/工具使用/IoU/高斯连续分五类奖励按样本激活集归一化加权，消融首次观察到"格式→工具→准确性→IoU→连续分"的层级式收敛顺序。
- **双模式评测 + 两类真实应用闭环**：20+ MLLM 思考/非思考模式横评；A³-Law 三阶段筛选使广告满意度 +1.05（35.5%）、行动意向为其他模型 3 倍，处方式批评超次优 +8.6%——评估落成可用的商业决策工具。

### 78 VideoAesBench——LMM 视频美学感知诊断
- **首个"视频 × 美学 × LMM"基准**：1,804 道精心设计问答、12 个细粒度美学维度（视觉形式/视觉风格/视觉感染力三层体系），填补 AesBench（图像侧）与 Q-Bench-Video（感知质量侧）之间的空白格。

### 80 ArtiMuse——联合评分与专家级理解
- **首个"精确评分 + 专家级理解"统一的细粒度 IAA 模型**：单一 MLLM 同时输出精确连续美学分数与 8 维结构化专家评语，直接对治既有方法的模态偏置（Q-Align 只有离散分数、AesExpert 只有描述）——文本分析获 MLLM 裁判 71.1%、人类 67.8% 选择率，评分在五个基准几乎全面 SOTA。
- **ArtiMuse-10K 专家策划数据集**：10,000 张图横跨平面设计/3D 设计/AIGC/摄影/绘画书法 5 主类 15 子类（首次系统纳入设计与 AIGC），每图由 3–30+ 年经验专家标注 8 维属性评语 + 整体分数；"与内容无关"的属性体系可普适于自然图像与 AIGC。
- **Token As Score**：复用 LLM 词表中天然有序的既有孪生字母 token（`aa`→0 … `ey`→100，token ID 序与分数序一致）表示 0–100 连续分，推理时对分数 token 概率分布取期望——免词表扩张、免幻觉、免 5 级粗离散信息损失（附录证明扩词表方案 SRCC≈0 不收敛，该方案稳定 0.614）。
- **两阶段 LoRA + 固定分辨率的可复现配方**：文本预训练（35 万+ 混合数据）建立结构化分析能力 → 分数微调注入评分能力；把 InternVL3 动态高分辨率改为固定 448×448（SRCC/PLCC 各 +0.3、效率翻倍）——4×A100 约 5 小时，8B 参数超越 72B/78B 开源模型与 GPT-4o 等闭源模型。

### 81 Venus——从评分到可操作构图指导
- **美学引导（AG）任务的形式化**：把"识别美学问题 + 给出可操作拍摄/后期指导"从摄影师隐性专业能力提炼为明确定义域；1,069 人调研（91% 偏好 AG）量化需求缺口——计算美学从"被动评分/描述"推进到"可解释、可交互的可操作指导"。
- **AesGuide 数据集 + 开放式文本评测协议**：10,748 张真实照片 × 评分/分析/引导三层标注（GPT 精炼 + 72B 循环校验 + 20 专家修订闭环）；用单模态 GPT 三维三点量表评分替代"选择题+准确率"范式，并以专家独立评分验证排序一致性——为"无固定答案的美学文本评测"提供可复用双轨范式。

### 82 ContextAes——上下文相关图像集合中的成对美学偏好学习
- **新任务设定：从“独立图像/相似系列”到“上下文相关集合”**：把“用户在同一场景/事件/主题的多图中挑更美观的一张”（相册管理、选片分享、推荐的真实需求）形式化为集合内成对美学偏好学习，同时覆盖自然共现（RedNote 多图帖、ETH3D/HPatches 视点与光照变化）与编辑诱导（Lightroom 同源多版本）两类上下文关系；以 1−DreamSim/LPIPS/DreamSim/CLIP 的分布分析证明该 setting 与真实用户相册吻合、而与 AVA（独立图像）和 FGAesthetics（高度相似系列）显著不同——严格论证了现有数据集与范式无法覆盖该问题。
- **“图论采样 + 统计校准”的低成本标注方案**：ContextAes-40K 共 39,033 图 / 8,069 集合 / 40,717 成对偏好标注；基于 Wong–Coppersmith 正则图理论的双步长（1 与 √N 取整）确定性配对把比较数从 O(N²) 压到 O(N)（图直径 ≤3、平均最短路径 ≈2）；再用 Bradley–Terry 模型把多人投票校准为潜在分数、以标准化分数差 |Δ|/SE 过滤“难区分/高不确定”对（每集合剔除最低 30%）——这套方法论可复用于其他集合级比较标注任务。
- **真实用户外部基准 ContextAes-Album**：22 位相册提供者贡献 4,140 图 / 494 集合，用户自排 Top-5 偏好排序转成 26,688 个成对测试实例，为“实验室受控标注的偏好”与“真实用户选片行为”之间提供独立的零样本泛化检验——结果揭示现有全部模型（含 Gemini 3.1 Pro）Acc 均不足 60% 的显著空白。
- **SkillOpt → SFT → GRPO 三阶段配方及“不可拆用”发现**：SkillOpt 把美学比较技能当作可迭代优化的自然语言工件（Gemini 3.1 Pro 作优化器、冻结 Qwen3.5-9B 作目标模型、验证集门控的 patch 式更新）；SFT 以该技能为条件、LoRA（视觉+语言）+ merger 全量微调建立比较式判断；GRPO 以“格式有效性 + 偏好正确性”的可验证奖励与成对翻转增广对齐人类偏好。消融系统证明三阶段非可加：GRPO 单独使用或两两组合反而掉点，仅完整三阶段最优——“偏好优化需要任务化技能与监督初始化先行”。
- **领先且超越模型本身的实证洞见**：自建基准 Overall Acc 75.30%（超最强对手 8.28 pt）、五个既有基准全部最优或次优、仅用 AVA 训练时跨库保持率最高（FLICKR-AES 上保留 80.8% SRCC）、真实相册零样本 63.64%（+4.51 pt）；同时揭示——专用 IAA 模型不敌通用 MLLM、模型规模增大不保证提升（InternVL3.5-30B 整体反而低于 8B 版）、闭源强模型 Gemini 3.1 Pro 也低于任务专属训练的 9B 模型，证明“集合内相对偏好建模”是需要专门训练的能力，而非通用多模态能力的自然副产品。

### 83 Aes-R1——美学推理的强化学习
- **AesCoT 冷启动数据管线**：对强 MLLM 遮蔽分数、沿光影/情绪叙事/构图/色彩/曝光五维度蒸馏与分数水平匹配的思维链评注，经"分数泄漏-推理失配-事实错误"三重错误向量过滤——把廉价的"图像-分数"数据转化为可验证推理链数据（AesCoT-3K/10K 开源）。
- **RAPO 相对-绝对策略优化**：正态 CDF 构造成对比较概率与真值偏好做 FRank 式几何组合（保证序一致），高斯核压缩绝对误差（保证分校准）——直接修复 rank-only（高 SRCC 低 PLCC）与 scalar-only（峰值失配）两类失配，把两种美学监督统一进单一 RL 目标。
- **"1 epoch 冷启动 + RL"的熵视角配方**：SFT 后平均 token 熵达峰（0.921→1.609）、继续 SFT 单调坍缩——从高熵检查点启动 RAPO 收益最大；GRPO+DAPO 改造（组归一化优势 + 非对称截断 $\epsilon_{high}=0.28$ + 极弱 KL）适配连续评分回归，仅 15K 样本平均 PLCC/SRCC 较骨干提升 47.9%/34.8%、超 GPT-4.1 等基线，OOD（PARA/AADB）最佳。

### 84 AesMind——神经美学三系统的计算操作化与认知美学 MLLM
- **以神经美学奠基的完整可计算分类体系**：把 Chatterjee & Vartanian 的“审美三联体”（感觉-运动/情绪-评价/知识-意义）操作化为摄影美学层级体系（3 核心维度、18 类、37 子类、168 个细粒度标签），并明确其为“功能性组织蓝图”而非神经活动模拟——为长期依赖启发式拼盘的 IAA 评测提供统一认知理论基础，形成“感知属性→情绪评价→专业批评”的完整可学习认知链。
- **审美情绪 vs 诱发情绪的双轨 VAD 解耦**：把传统只用于“内容诱发情绪”的 VAD 连续空间扩展出针对“摄影执行本身”的审美 VAD 三维（效价=视觉愉悦、唤醒=即时冲击、支配=叙事清晰），使数据集能表达“拍得极好的悲剧题材”这类正交情感状态；跨数据集实验（含仅 AVA 训练的严格设定）证明该解耦产出通用而非数据集特异的情感表示——CogIP-Bench 上美学 MSE 降约 2.6 倍的直接原因。
- **NeuroAes：“深度换体量”的数据集设计 + 原生 PIAA 支持**：25K 图（5K NeuroAes-Bench + 20K NeuroAes-Data）× 每图 40 标签、6 个 MOS（15 人独立评分、Z 分数标准化、零泄漏评分者池）、8 条专业批评，总量 120 万+细粒度标签、225 万人类评分、100 万+ QA 对；独家保留每位评分者的原始评分与人口学/MBTI/大五人格画像（甚至刻意保留色盲被试），个性化美学评估（PIAA）无需重新采集数据即可开展。
- **Skill→SFT→GRPO 渐进三阶段（认知初始化先于参数更新）**：第一阶段不动任何权重，用元优化器（Gemini-3.1-Pro）以 patch 式编辑 + 验证门机制迭代搜索 8 个任务技能的系统提示（失败案例驱动、单调改进保证）；第二阶段 LoRA（r=64, α=128）注入 + 全训练融合器的 SFT 内化跨模态知识；第三阶段丢弃 LoRA、全参数 GRPO 激活 `<think>/<answer>` 显式推理——消融显示 SFT 是 GRPO 的强制前提。
- **面向连续主观回归的混合奖励 GRPO + 三任务全面 SOTA**：混合回归奖励以“线性引导区 + 高斯高精区”双区结构兼顾高误差区不停滞与低误差区细校准（直击阈值/ℓ1 惩罚缺陷）；类别匹配奖励以类别先验对数项平衡重尾美学属性；课程门（τ 0.4→0.2）强制“先掌握输出结构、再优化语义”。最终感知总体 65.36%（超 Qwen3.5-9B 基座 23 点）、连续 VAD 回归六维全面 SOTA（总体 SRCC 0.6986 / PLCC 0.7261）、八维批评生成的 LLM 评判与词汇对齐均第一，跨五个既有基准零样本即与专用模型持平或更好。

### 85 CropReward——百万对裁剪偏好与奖励自举闭环
- **"原图入候选"的评测范式 + CropBench 基准**：首个把未裁剪原图纳入候选的美学裁剪偏好基准——1,019 张图 × 15 候选全量成对（每图 105 对、含平局选项）共 106,995 对人类标注 + 15,285 个 Bradley-Terry 分数，同时服务方法基准、评测标准审计与奖励训练三种用途；混合人机协作标注（HMCA）用五个 MLLM 评委的投票一致性动态决定每对人类标注人数（2/4/6 人三档）——预算集中花在分歧样本上。
- **相对原图的成对差值奖励模型 CropReward**：以"原图 + 候选裁剪"双图输入（免专家参考框），在 MLLM 可学习 `<AES>` token 上接 MLP 头，用 NPD 损失直接回归 BT 分数之差（而非仅次序）；消融证明去原图输入 SRCC 直降 0.156/0.163——SRCC 0.763/0.787，超 $\mathrm{IoU}_{\mathrm{mean}}$ 类指标 19.79%–22.47%。
- **奖励自举 + 无人工框监督的裁剪模型 CropAlign**：用 CropReward 给 51.8 万张无标注 Unsplash 图的候选裁剪打分选优，自举出 31 万图的 CropReward-300K（零人工标注）；仅以其做 SFT、再以冻结 CropReward 为奖励做 GRPO——CropBench/FLMS/FCDB 三个基准 Overall 全部第一，3,000 对用户研究总胜率 75.7%——"奖励引导探索"成为摆脱专家框标注依赖的完整示范路径。

### 86 LongT2IBench——图结构化长提示对齐评测
- **"分数 + 解释"双标签基准**：3K 长提示（自 4.5K 筛选）× 14K 图文对（自 18K 筛选），长文本显式结构化为实体-属性-关系图；对齐分数 = 图中已对齐元素占比（天然可解释），解释 = 图上对齐/未对齐元素列表——"对齐在哪里失败"首次成为可定位、可学习的监督信号。
- **Generate-Refine-Qualify 人机协同协议**：GPT-4 生成初始图 → 标注者精修 → 一致性双检；图像-图对齐先评实体、自动屏蔽未对齐实体的属性与关系（分层标注逻辑），三人多数一致再校验——长提示细粒度标注的噪声压制工程范式。
- **HA-CoT 分层对齐思维链 + 特殊 token 多任务**：实体对齐器→属性关系对齐器→综合评分的三跳推理复刻标注逻辑；`<Level>`/`<Json>` 特殊 token 让一个 7B 模型同时输出分数与解释且互补增强（评分 0.474→0.557、解释 32.8%→53.2%）——长提示对齐解释上大超 GPT-4o/Gemini-1.5-pro（53.2% vs 31.1%）。

### 87 FG-IQA 恢复——感知图像恢复的细粒度质量评估
- **首个面向 IR 的细粒度 IQA 数据集 FGRestore**：18,408 张恢复图像 × 108 种恢复算法 × 六类任务（去模糊/去噪/去雨/去雾/超分/混合），MOS 标量分 + 30,886 个细粒度成对偏好对（45,318 条标注）——此前同类数据集最多覆盖 3 类任务且以标量 MOS 为主。
- **"分数阈值 + JND 校准"两步过滤管线**：数据集专属分数差阈值剔除粗粒度对 + JND 噪声注入 SSIM 中位数剔除不可感知对，从 127.5 万随机对中系统筛出"差异可感知但细微"的 30,886 对——细粒度样本"如何自动客观构造"的方法学回答。
- **细粒度失效的系统实证**：把 MOS 区间切五档，证明主流 FR/NR IQA 指标整体 SRCC 尚可（DeQA-Score 0.747）但窄区间内全面崩塌（多数 <0.35 甚至为负）——"分数式 IQA 在细粒度场景失灵"首次被量化。
- **FGResQ 双分支统一评估**：CLIP 退化感知特征学习（双向对比对齐、六任务统一）+ 回归/比较双分支 + 场景感知保真损失（场景内排序约束规避多源分数尺度不一致）；ACC 0.752 超最强基线 DeQA-Score 7.2%，无参考条件下超过有参考的 DISTS。

### 88 TuningIQA——直播相机调优的细粒度盲 IQA
- **FGLive-10K 受控参数数据集**：10,185 张 1080p 图像 × 555 个场景，三台直播相机对光圈/快门/ISO/白平衡/对比度/饱和度/锐度 7 个参数系统性扰动采集——"同场景受控参数变化 + 完整参数元数据"独此一家，质量差异可归因于相机设置。
- **"MOS + 条件性成对精化"两段式标注**：单刺激 MOS 后仅对分差 ≤0.8 的 21% 图像对做人工成对复核，得 19,234 个细粒度偏好对——直击"单刺激在质量层级内部失效"（层内 PLCC 低至 0.24），以最小标注成本换取细粒度可靠性。
- **HFE 人区域优先 + GCPF 参数图融合**：Faster R-CNN + ROI Align + 九分区残差 + 交叉注意力把"人脸质量主导整体感知"的洞察架构化（人脸 SRCC 0.885 vs 基线 0.807）；8 节点异构图编码曝光三角/后处理链等物理关系（+0.035 SRCC）；FG-ACC 领先 LIQE 7.5pp，并在 44 场景真实调优闭环中对 MUSIQ 取得 74% 主观胜率——"基准指标 → 实际调优收益"的完整证据链。

## 三、跨论文共性主题

### 主题 1：结构化（量规/清单/CoT）奖励成为视觉奖励建模的主流范式
01、02、05、06、14 五篇从不同角度收敛到同一思想：**把"标量打分"重构为显式评估结构**——动态量规（01/05）、评分维度+支撑理由（02）、验证清单（06）、案例自适应细则（14）；42 的 TAPO 把这一思想带进训练侧——过程奖励不落在思维链 token 上，而直接落在工具动作的视觉后果上。共同收益：
- 可解释：判断轨迹可审查（01 的"可审查判断轨迹"、06 的"可追溯视觉证据"）；
- 抗漂移：治理标量漂移（05）、BT 极化（14）、分数塌缩；
- 抗 hacking：结构化奖励在下游 RL 中更稳（05 对比 VideoReward、03 的域外泛化、14 的方差衰减更慢）。

### 主题 2：GRPO 家族的视觉本地化改造
前文十篇与新批七篇（共十七篇）各自改造 GRPO 以适配奖励结构：**维度级 GRPO**（01，奖励=维度分差×偏好方向×权重）、**dimension-wise GRPO**（02，答案项+维度项组合）、**RGPO**（05，生成器/评分器非对称优化）、**PD-GRPO**（14，硬间隔指示奖励治极化）、**TAPO**（42，工具动作级过程奖励混合准确率奖励、保正确性主导）、**对比式工具奖励 GRPO**（43，直接/工具双路径四情形奖励经组相对优势归一化）、**GRPO-ATS**（45，文本温度 1.0/代码温度 0.0 动态切换救回报废 rollout）、**TIR Rollout**（49，代码解释器嵌入 GRPO 采样循环、OBSERVATION 回插上下文）、**条件式工具奖励 GRPO**（50，工具加成门控于答案正确）、**NAAR**（53，按任务必要性给文本可解时正确的代码回答 0.25 部分分的软偏好，叠加提示化组的非对称重要性采样）；新批七篇再添四条改造轴——**接地格式奖励 GRPO**（56，坐标有效性作为格式项与任务正确性加权）、**工具条件化优势估计**（57 V-ToolRL，工具返回的视觉输出直接进状态与重要性比率）、**组级难度自适应奖励**（60，$\mu_{\text{acc}}$ 在线信号经 sigmoid 缩放翻转工具激励方向）、**教师标注符号缩放**（61 AT-GRPO，$\Delta S$ 符号与幅度调制工具奖励）——而 62 的 **HDPO**（分层解耦：精度通道全域 GRPO + 效率通道仅正确轨迹合格集内条件优势估计）从数学上证明标量耦合奖励的效率信号会被精度方差系统性淹没，为整个家族提供了"为什么要改造"的理论注脚；46 的好奇心约束奖励（拉格朗日松弛化为加法项）则是同一家族的非 GRPO 变奏。共同问题意识：组相对优势估计在连续/多维奖励下的稳定性（01 的饱和组过滤与 14 的方差衰减分析直接呼应，62 的方差分解给出最新形式化）；工具智能体一脉则把「奖励该落在哪个动作粒度上」（结果 vs 工具调用 vs 代码可执行性）变成新的设计轴——44 的"零内容监督"消融（严格代码正确性奖励反而损害泛化）与 50 的条件式工具奖励消融互为印证。

### 主题 3：原生统一架构——单一流、共享视觉空间、多分支
07（空间耦合解码 + 原生 MoT）、08（6B 单流 DiT 统一 T2I+编辑）、10（统一视觉空间替代 VAE 双通路）、13（文本/VoT/扩散三分支 MoT）、12（共享 MMDiT 多任务）共同指向：**摆脱"扩散主干 + 外挂 VAE/编码器"的拼装式架构**，用共享表示与统一目标覆盖生成+编辑+理解。配套的统一训练目标设计：平衡流匹配（10）、BFM 分区归一（10）、去噪式密集监督（12）。

### 主题 4：多专家 RL + 在策略蒸馏的后训练配方
07（四专家 RL → 多专家在策略蒸馏）与 08（并行专家 RL → 多教师在策略蒸馏）面对同一难题——**异质目标联合优化的干扰**——给出同构解法：先并行特化、再蒸馏归一，蒸馏时学生沿自身轨迹学习（on-policy）。这是 2026 年统一模型后训练的代表性工程范式。

### 主题 5：能力驱动数据工程与课程调度
11（能力专用引擎 + 五阶段课程 + 缺口反馈闭环）、08（渐进训练管线）、12（三阶段课程）、09（四阶段流水线）共同把数据从"规模堆叠"转向"能力覆盖、依赖顺序、失败驱动补数"。**Caption 作为统一监督语言**（11 的"条件 T2I 生成"式编辑指令）与**自然视觉关联挖掘**（11 的同人/同产品关联、09 的知识图谱+谱聚类视频对）是两个可复用的数据构造洞见。

### 主题 6：效率与紧凑性贯穿始终
08（6B 前沿 + 3B 剪枝近无损 + 少步蒸馏）、07（每 32×32 区域 1 token）、05（480 对数据效率）、14（9B 比肩 72B、vLLM 流水线）、09（<0.5% 推理开销、32 GPU 天）、13（6 万 GPU 时增量训练）——"受限预算下逼近前沿"是本批论文的集体姿态，且多篇给出从训练到推理的全链路效率设计。

### 主题 7：每篇自带评测基准
Lever-Bench（04）、VA-Judger-Bench（02）、TryOn-Bench/TryOnRewardBench（03）、FIRM-Video-Bench（06）、VicEdit-Bench（09）、CPI-Bench（11）、InsEdit-Bench（12）——奖励/编辑领域缺乏公认基准，论文以"方法+数据+基准+下游验证"四位一体发表，且普遍强调**与训练集零重叠**与**域外/未见模型子集**。新加入的 13 篇进一步印证：EditReward-Bench（15 多方排序 + 16 重构扩展）、FIRM-Bench（17）、MER-Bench（18）、RealBench（23 留出评估器防过拟合）、GenTextEval（24）、HPSv2 协议（21）、Pick-a-Pic Elo（22）——"先造尺子再造模型"已成领域默认动作。本批工具智能体论文延续同一姿态：44 另立 MAT（350 例搜索+编程）、43 立 ChartQA-OoD、51 的 V\*Bench 则成为整个视觉工具智能体方向的事实标准基准（46/50/42 均以 V\* 为主战场报告）。

### 主题 8：编辑奖励的"流水线化"构建——与 Lever-Edit 构成方法论对立面
15–18 四篇从不同角度构建编辑专用奖励：专家双维标注 + 多头不确定性排序（15）、基准→数据→生成式奖励→自集成→在线 RL 全链路（16）、差异优先数据 + 清单评分 + 乘性融合（17）、空间定位 + 交错 token 验证（18）。共同姿态是**分阶段流水线**：构造中间监督结构（量表/差异报告/边界框/清单）→ 训练专门化奖励模型 → 多维信号融合 → 接入 GRPO/Flow-GRPO。每一步都在对抗"相对编辑评估"的同一批困难：标注噪声（15/16 的多人协议与讨论机制）、作弊模式（17 的乘性调制、18 的强制回看）、通用 VLM 的失效模式（16 的 72B 仍不稳、17 的负优化、18 的注意力坍缩）。而 04（Lever-Edit）从反方向证明：若把编辑指令转写为自包含目标描述，这整条流水线可被 T2I 奖励迁移替代——两路对照是本批论文最有张力的方法论分歧：**造专用奖励 vs 迁移通用奖励**。

### 主题 9：T2I 奖励生态的谱系演化（2021–2026）
28–31 与 19–27 共同勾勒出文生图奖励的完整演化树：
- **史前史：免参考指标的确立**：CLIP（28）以 4 亿图文对对比预训练确立"图文嵌入相似度"这一通用语义底座，CLIPScore（29）将其直接变成免参考评估指标（不用任何人工参考即超全部基于参考的指标）——此后一切 T2I 偏好奖励都可视为对"CLIPScore 不够像人类"的回应。
- **数据来源演化**：专家比较（19 ImageReward）→ 社区交互挖掘（20 HPS）→ 真实用户产品化采集（22 Pick-a-Pic）→ 去偏 + 受控标注（21 HPSv2）→ 宽谱标注（30 HPSv3：高质量真实摄影作质量上界 + 16 模型输出，108 万对/117 万比较）→ 多维二值问答（31 VisionReward：约 500 万条 checklist 问答）——偏好数据从"专家"走向"真实用户"、从"成对比较"走向"逐维度诊断"。
- **奖励机制多样化**：判别式 CLIP 微调（19–22）→ 生成式"推理+打分"（16、32）→ 检测器引导（23 RealGen）→ 结构异常量化（24 TextPecker）→ 统一理解/生成（25）→ 零样本读回似然（27）→ 个性化上下文自适应层级评估（33）——从"训练一个打分器"演化到"不训练也能打分"再到"打分前先规划评估体系"。
- **表示底座**：CLIP（28）→ SigLIP（26，sigmoid 损失更强对齐）→ VLM 全参主干（30 用 Qwen2VL-7B、25/32/33 用 Qwen-VL 系）——它们被后续工作广泛复用为语义一致性指标（04 的 SigLIP 一致性、12 的语义通路）。
- **三位一体功能位**：自动评估（替代 FID）+ best-of-N 推理时增强 + RL 微调信号——19/22 提出"取代 MS-COCO+FID"评估标准，23/24/25/27/33 直接接入 GRPO 类在线 RL，30 的 CoHP 则展示"免训练推理时增强"。

### 主题 10：量规评估生态——"显式标准"运动从文本侧席卷到多模态侧
35–41 七篇与 01/05 共同构成一场把评估标准显式化的运动：
- **文本侧基建三件套**：统一框架（35 AutoRubric：混合准则类型 + 集成评审 + κ/EMD 信度诊断的"有主见默认值"开源 API）、数据资产（36 RubricHub：约 11 万条粗到细自动生成量规 + RuFT/RuRL 量规驱动后训练；37 OpenRubrics：六大来源合成 (提示,量规) 对 + CRG 对比量规生成与闭环验证）——量规的"生成→验证→数据化→奖励化"全链条在文本侧率先成熟。
- **多模态侧四种打开方式**：自聚合量规治"推理-答案不一致"（38 AutoRubric-R1V）、代理评测器闭合量规质量监督回路（39 Proxy-GRM）、统计学习从偏好数据选规则（40 AutoRubric-T2I：ℓ1 稀疏逻辑回归 + 课程分桶困难对挖掘）、隐式偏好外化为二元量规直接做 RL 奖励（41 Auto-Rubric as Reward）。
- **与 RubricRM（01）的定位差**：40 学全局共享规则、41 生成提示词条件二元标准、36/37 建固定量规库，而 01 主张"为每条指令动态决定维度与权重"——恰好构成 01"指令自适应量规"主张的对照系；05 的 RewardVerse 则把量规用于视频奖励的标量漂移治理。
- **集体姿态**：零/少参数更新（40/41 冻结 VLM、38 零人工标注零更强教师）、极端数据效率（40 仅 256 对偏好数据、41 约 100 对、39 约 5 万样本）、可解释可审计（规则文本直接可读）、闭环验证（37/39/41 均带"生成-验证"环节）——与 15–18 的"重流水线专用奖励"形成成本谱系的另一端。

### 主题 11：视觉工具智能体生态——从"调用工具"到"发明工具"、从"两阶段课程"到"免 SFT 涌现"
42–62 共 21 篇勾勒出 MLLM 工具使用的完整技术栈（51 V\* 为其基准源头、48 为其训练理论依据）：
- **动作空间逐级放大**：从静态工具库中选择（43 VisTA：同类异构工具按需选用、推理器全程冻结）→ 固定像素操作集（46 Pixel Reasoner：zoom-in/select-frame）→ 原生边界框裁剪（50 DeepEyes：生成 bbox→裁剪→裁剪图纳回轨迹）→ 通用代码生成（45 Thyme / 49 ToRL / 44 Visual-ARFT / 53 Beacon：Python 一次编排裁剪、旋转、对比度、数学计算）→ 动态工具发明（52 PyVision：不预定义任何工具，按查询即时编写执行）——"代码即动作空间"成为终点形态（42 CodeV 亦然）。
- **训练配方的两极**：两阶段课程（45 的 50 万样本 SFT + GRPO-ATS、46 的 7,500 合成轨迹 SFT + 好奇心 RL、47 的 1.5k 轨迹冷启动 + 可验证奖励 GRPO、44 的冷启动 + RFT、53 的防遗忘三段式合成 SFT + NAAR/HCE RL）vs 免 SFT 直接 RL（49 ToRL 从 Qwen2.5-Math 基座涌现工具使用、50 DeepEyes 仅凭结果奖励涌现"图像思考"）——48 的受控比较（RL 泛化、SFT 记忆）提供理论坐标，47 更以 R1-Zero 失败（工具使用倾向渐进消失）给出反例实证：规则明确、可验证奖励充分时免 SFT 可行；工具输出构成分布偏移或探索成本高时冷启动不可省略（45 实测仅 200 GPU 小时即激活全部功能）。
- **奖励设计的共同难题——工具加成如何不诱导"装饰性调用"**：43 用双路径对比显式度量工具边际贡献、50 把工具奖励门控于答案正确、46 用截断拉格朗日防奖励作弊、42（CodeV）更进一步把奖励落到工具动作的视觉后果（忠实性）、53 以必要性感知部分分软性调和"文本可解优先"与"代码答对不罚"；44 则反向证明"零内容监督"（只奖可执行、不评代码对错）反而更泛化。
- **忠实性与必要性成为新评估维度**：CodeV（42）实测 SOTA 工具智能体（46/50）的中间裁剪大量不含目标物体——"工具使用忠实率"与"最终答案正确率"解耦，形成与主题 1 结构化奖励呼应的过程级评估诉求；53（Beacon）再把"何时用"（MA）与"用得值不值"（TE = 收益 − 伤害，5 次采样分层标注保证稳健）操作化为可复现指标，实证现有模型工具收益被易样本伤害大幅抵消——与 42 的忠实性、47 的工具收益边界共同构成工具智能体评估三角；51 的 V\*（SEAL 把"指缺—找—答"显式化）正是这一诉求的源头范式。
- **认知科学参照系**：51 的 V\* 搜索效率（2.80 步）逼近人类眼动引导（2.52–2.70 步）、50 涌现"视觉搜索/比较/确认"四种类人模式、52 分析出与人类视觉策略对应的工具使用模式——工具智能体正在成为检验"LLM 推理是否类人"的可观测载体。
- **"何时用工具"成为 2026 年的显式战场（新批 60/61/62 × 53 的方法论争论）**：60 CodeDance 用组级准确率作在线难度信号（无需教师，但可能错罚高准确率组里的成功工具轨迹）、61 AdaTooler-V 用教师模型的工具诱导增益做离线标注（样本级精准，但受策略-教师分布失配与教师能力上限约束）、62 Metis 用条件化解耦劝退冗余调用（理论干净，但"总体少调"缺乏任务依赖性）——三种设计各有盲区，53 Beacon 的 NAAR 以"模式条件化 + 在线标注"双原则逐一回应；62 的 HDPO 数学证明（耦合奖励中效率信号被精度方差 $\mathcal{O}(\alpha)$ 级淹没）与 98%→2% 的调用率坍缩实证，共同把这场争论从经验推向理论——"自适应工具使用"自此与"忠实性"（42）并列成为工具智能体的第二大奖励设计前沿。
- **生态补全：SFT 先声、开源基础设施与生态级体检（54/57/55）**：54 CogCoM 证明"操作即证据"范式早在 RL 浪潮前即以纯 SFT 确立（6 种原子操作 + 70K 自动化轨迹 + KV 记忆多轮架构），是该谱系的历史起点；57 OpenThinkIMG 把工具接入、轨迹合成、训练做成开源全栈（统一注册表 + 容器化工具服务），补上领域基础设施短板；55 VTC-Bench 以 32 工具、9 任务、680 题、平均 5.04 步真值链给出生态级体检——最强模型仅约 51%、工具选择窄化、链深不足、过度依赖未验证中间结果，与 42/53 的诊断互为印证。

### 主题 12：美学评价数据集的谱系演化（2012–2026）——分布、身份、人格、专家、推理链
63–68 与 71/72/76/81/83/85 共同勾勒"标注什么、谁来标注、标签什么形态"的三维演化：
- **被标注对象从均值到"人"本身**：完整评分分布（63 AVA：25.5 万图、平均 210 票/图，"争议度"可量化）→ 评分者身份（64 AADB：唯一跨图记录 ID）→ 个人残差（65 FLICKR-AES：证明个人偏好偏离是系统性可预测信号而非噪声）→ 人格画像（68 PARA：BFI-10 大五人格 + 4 项面向人的主观属性、972 万条标注、438 名被试）——"人"从需要被平均掉的噪声源变成一等标注对象，个性化美学自此有了数据地基。
- **标注主体从众包到专家、标签从分数到理据**：AMT 工人（64/65）→ 严格遴选的美学研究者/教育者/美术生（71 EAPD：32 位专家、8,400 问答 + 2,800 条解释）→ 多元受试者 + GPT-4 放大（72：88K 人类评论 → 409K 指令）→ 3–30+ 年经验专家的 8 维评语（80 ArtiMuse-10K）——标注深度的规模化靠"人类锚点 + 模型放大"两级流水线，而非纯机器生成（72 实证纯众包 AVA-Comments 几乎无效）。
- **标签形态的结构化跃迁**：标量 MOS → 评分直方图（66 NIMA 的目标侧）→ 自然语言评论（72）→ 思维链理据（83 AesCoT：遮蔽分数蒸馏五维评注 + 三重错误过滤）→ 图结构化标注（86：实体-属性-关系图 + 对齐分数 = 图上元素占比）→ 可操作指导（81 AesGuide：评分/分析/引导三层）——"美学为什么是这个分"逐步变成可定位、可学习、可执行的监督信号。
- **细粒度的数据化**：系列内成对排序（76：10,028 系列、44,863 对）、恢复算法对（87：108 种算法、30,886 对）、受控参数扰动（88：7 参数同场景 555 场景）、百万对裁剪偏好（85 CropBench：106,995 对 + 31 万图自举）——"细微差异"从直觉变成可过滤（分数阈值 + JND 校准）、可校准（成对比较排序）的样本工程。

### 主题 13：能力阶梯——从打分到解释、引导与行动
71 的四维阶梯（感知→共情→评估→解释）与 77/81/83/88 的落地化构成美学评估的能力跃迁：
- **零样本先验的挖潜（2016–2022 的底座期）**：64/66 确立"CNN 端到端 + 分布/排序监督"，69 CLIP-IQA 用反义提示配对把 CLIP 变免训练评分器（提示词即指标、每领域只存两个提示词），67 MUSIQ 证明表示底座的结构改造（多尺度 + 哈希位置编码）可免多裁剪推理——这三条路线（监督学习/零样本先验/架构改造）支撑了之后所有美学评估模型。
- **解释能力的两个来源**：数据驱动（72 人类评论 + GPT 扩展；80 专家 8 维评语联合评分）与推理驱动（83 RAPO 把"先解释后评分"变成 RL 联合输出；77 工具增强 CoT 把色相/色彩度/OCR 计算证据融入理据）——71 的诊断（解释精确性显著低于相关性 = 幻觉量化）是两者的共同靶子；80 的 Token As Score 与 83 的 RAPO 分别从表示与优化两侧回应"精确评分 × 可解释"的双需求。
- **从评估到行动（2026 的成形期）**：77 处方式广告批评（修改指导 + 广告筛选决策）、81 可操作构图指导 + 裁剪执行（IoU 87.01 超专用模型）、85 CropAlign（百万偏好训练的裁剪模型、75.7% 用户胜率）、88 相机参数调优闭环（74% 主观胜率）——美学模型开始替代摄影师/相机工程师的具体决策，"评分 → 指导 → 执行"链条在 2026 年成形，与奖励模型线的"评估即训练信号"殊途同归。
- **解耦与统一的双线并进**：70 DOVER 把视频质量解耦为美学/技术双分支（融合权重 0.428/0.572 直接取自主观研究）；75 VGA-Bench 实证"美与真分离"（Sora2 美学第一、保真落后）；73 Q-Eval-100K 把质量与对齐分别独立打分——"单一总分"在视频/生成/文生视觉三个模态上同时被拆解，且三者都给出"拆开后各自更准"的证据。

### 主题 14：细粒度（fine-grained）成为 2025–2026 美学/质量评估的统一前沿
76/83/85/87/88 不约而同指向"细微差异"这一共同痛点，方法论高度趋同：
- **失效证据链**：87 的 MOS 分桶实验（整体 SRCC 0.747，窄区间 <0.35 甚至为负）+ 88 的层内 PLCC 崩塌（0.24）+ 76 的"单图绝对评分在系列内失序"——标量回归在细粒度场景的系统性失灵第一次有了跨任务的量化实证。
- **偏好对的构造方法论**：分数阈值过滤（87/88）+ JND 可感知性校准（87）+ 成对比较排序校准（76：10 人/对、0.5 概率弃）+ 条件性精化（88：仅 21% 不确定对人工复核）+ 真实用户偏好（85）——"如何自动构造'可感知但细微'的样本"成为数据集设计的新核心问题。
- **排序学习的三种融入层级**：损失级（87 双分支排序 BCE、88 回归+排序联合 λ=1:2）、表示级（76 RankReg 让绝对分数天然满足系列内次序）、RL 级（83 RAPO 把相对奖励与绝对奖励统一进策略优化）——与主题 2 的"GRPO 家族视觉本地化"在美学评分回归任务上汇合。
- **奖励化出口**：85 CropReward（视觉感知一致性 + 响应级 DPO 的裁剪奖励模型 + 31 万图自举 AIC 数据）、83 RAPO（美学 RL 奖励）、88 调优闭环——细粒度偏好最终以奖励模型/RL 信号的形式反哺生成与编辑系统，与第一批次的编辑奖励线（15–18）形成同构呼应；80 的"刻意保留低质量样本对冲 MLLM 正向偏置"则提示奖励数据治理仍是薄弱环节。

## 四、研究趋势与创新机会

### 趋势
1. **奖励建模的"过程化"**：从端到端标量回归 → 显式评估结构（量规/清单/思维链）→ 蒸馏回端到端（06 的"先定分后说理"）。评估的可靠性正在被工程化地"编译"进模型。
2. **RL 后训练进入多维细粒度时代**：二元偏好信号被维度级、幅度感知、案例自适应的奖励结构取代，配套的 GRPO 变体解决连续奖励下的组归一化稳定性。
3. **统一模型架构收敛于"共享空间 + 多分支专家 + 统一目标"**：VAE 外挂正在被原生视觉接口（10 的重参数化 ViT、07 的空间耦合解码、13 的语义量化 token）替代。
4. **数据从语料到能力、从静态到闭环**：失败驱动的缺口补数（11）使数据系统具备反馈控制属性。
5. **部署效率成为一等公民**：剪枝、少步蒸馏、异步奖励计算、LoRA 低成本训练贯穿多篇。
6. **奖励来源多元化与"零训练化"**：从人工标注（19–22 专家/用户）到检测器信号（23）、结构先验（24）、再到零样本似然（27）——奖励信号获取成本沿"标注→合成→免费"单调下降；与 15–18 的重流水线形成成本谱系的两端，未来奖励工程将在"保真-成本"平面上选址。
7. **编辑 RL 的两条路线并立**：专用编辑奖励流水线（15–18）与 T2I 奖励迁移（04）；前者保真但昂贵（每篇都是基准+数据+模型+RL 的全链路工程），后者免费但粗粒度（04 自承是语义投影而非等价映射）。18 的 MER-Bench、16 的 EditReward-Bench 与 04 的 Lever-Bench 在同一任务上提供了两条路线公平比较的公共测试床。
8. **"偏好 ≠ 质量"的意识觉醒**：23 实证偏好奖励带偏风格（偏红/偏紫/卡通化）、22 实证 FID 与人类排序负相关、21 从数据端去偏——奖励模型正在从"拟合人类选择"转向"辨析人类选择背后的可取属性"。
9. **量规从评估工具变成数据资产与奖励源**：36/37 把量规本身做成可复用的数据集与合成管线，38–41 直接用量规（或规则集）替代标量奖励模型进 RL——"评估标准"正在经历与"模型"类似的数据资产化过程，量规质量本身成为被优化、被验证的对象（39 的代理评测器、37 的偏好-标签一致性过滤、41 的"生成-验证-精炼"）。
10. **UnifiedReward 家族的"三部曲"阶梯**：25（统一理解/生成打分）→ 32（加显式长 CoT 推理）→ 33（再加上下文自适应层级评估），同一团队沿"标量→推理→个性化"逐级演进且每一级都开源复用——这是奖励模型复杂化的一个缩影，也提供了可复现的参照系（33 的实验直接以 32 为最强基线）。
11. **视觉工具智能体从"调用"走向"发明"、从"两阶段课程"走向"免 SFT 涌现"、再走向"知何时"的元认知化**：动作空间沿"静态工具库→像素操作→原生裁剪→通用代码→动态工具生成"逐级放大（43→46→50→45/49/44→52），训练配方沿"SFT 冷启动 + RL 精炼 → 纯结果奖励直接 RL"两极分化（48 的"RL 泛化/SFT 记忆"受控比较提供理论坐标）；与此同时，"工具使用的忠实性"（42 的诊断：SOTA 模型大量中间裁剪不含目标物体）暴露出过程级奖励与评估的新前沿——该方向的下一个战场不是"会不会用工具"，而是"用得是否忠实、调用是否必要、奖励是否落在视觉后果上"（53 Beacon 的 MA/TE 诊断实证：现有模型的工具收益被易样本上的伤害大幅抵消、多模型 Δ_TE≈0，"知何时"与"知如何"自此成为与准确率并列的评测轴）。新批 54–62 确认并深化了这一转向：60/61/62 三种"自适应工具使用"设计（组级难度信号、教师标注收益、元认知解耦）与 53 的批评构成 2026 年的核心方法论争论——62 Metis 以 HDPO 数学证明耦合奖励失效、并以 98%→2% 的调用率坍缩证明"效率与精度可互为催化"；55 VTC-Bench 的生态级体检（最强 51%、工具选择窄化、链深不足）与 57 的开源全栈则分别补齐了评测与基础设施两块拼图。
12. **美学评价完成了自己的范式转移（63–88 批次的主线）**：数据侧从均值/众包走向分布、评分者身份、人格画像与专家理据（63→64/65→68→71/72/80）；模型侧从 CNN 单分（66）到零样本先验（69）、任意分辨率架构（67）、美学/技术解耦双分（70）、MLLM 评分 + 解释联合（80/83）；输出侧从打分到指导与执行（77 处方式批评、81 构图指导、85 裁剪执行、88 相机调优闭环）——与奖励模型线的"结构化、过程化"趋势（趋势 1/2）完全同构，且两条线在 83/85 的"细粒度偏好奖励化"处合流；82（集合上下文偏好）与 84（神经美学）已补录、进一步延伸了“认知化”一端，79（生成图像美学）待补录。

### 潜在创新机会（跨论文交叉点）
1. **量规奖励 × 原生统一模型**：当前两条主线（奖励建模 01–06/14 与统一架构 07/08/10/13）基本平行发展——把案例自适应量规奖励直接用于原生统一模型的 RL 后训练（而非依赖外部打分器）尚属空白。
2. **视觉思维 token（13）× 思考式奖励（14）**：VoT 在渲染前显式规划、TRM 在评分前显式思考——"生成前规划"与"评估前规划"共用一套结构化推理底座，可互相蒸馏。
3. **密集感知监督（12）× 奖励接地（03）**：TryOnReward 的 FCO 把奖励锚定在区域证据上，12 的深度/法线监督把结构先验注入生成——"结构接地的奖励"（用几何一致性作为可验证奖励信号）是自然延伸。
4. **视听联合奖励（02）× 清单验证（06）**：FIRM-Video 的时序证据验证扩展到音画同步验证，得到跨模态可追溯的视听奖励。
5. **奖励迁移（04）的推广**：Lever-Edit 证明 T2I 奖励可迁移到编辑；"反事实目标描述"接口可推广到视频编辑（09 的三模态参考可提供更丰富的反事实描述素材）。
6. **能力缺口闭环（11）× 量规诊断（01）**：量规的逐维打分天然给出能力缺口信号，可作为 11 式数据引擎的主动反馈源，形成"评估-数据-训练"全自动闭环。
7. **高方差奖励洞察（16）× 方差治理（14 PD-GRPO、05 标量漂移）**：16 发现高方差奖励反而利于在线 RL、14 治理 BT 极化、05 治理分数塌缩——"何时保留方差、何时治理方差"是奖励工程尚未系统化的开放问题。
8. **零样本自奖励（27）× 原生统一模型（07/08/10）**：Self-SpectraReward 证明统一模型可用自身理解分支为生成分支打分（奖励-策略分布对齐）；与 07/08 的多专家 RL + 在策略蒸馏结合，"自奖励 + 自蒸馏"的闭环后训练尚属空白。
9. **检测器奖励（23）× 密集感知监督（12）**：RealGen 把检测器变成真实感奖励源、12 用深度/法线给生成注入结构先验——"感知任务作为可验证奖励源"可推广到更多几何/物理一致性维度（与 03 的区域接地、18 的空间锚定同向）。
10. **结构化编辑奖励（15–18）× 奖励迁移（04）的混合路线**：Lever-Edit 证明 T2I 奖励经反事实目标描述即可迁移，但一致性仅是粗粒度语义投影；用 17 的差异报告或 18 的边界框作为**条件增强**喂给 04 的描述器（而非训练专门奖励模型），或可用流水线十分之一的成本修复"低层身份保持"短板。
11. **编辑奖励 × 量规统计学习（40 的移植）**：AutoRubric-T2I 的"从偏好数据学加权规则 + 冻结 VLM 逐条打分"可直接移植到编辑领域——用 15 的 20 万编辑偏好对学出"指令执行/源图保持/视觉质量"三族的加权规则集，或以 40 十分之一的成本复现 16 式"基准→奖励→在线 RL"全链路；41 的二元量规生成也可为编辑指令合成"执行了/没执行"的可验证标准。
12. **合成数据范式回流编辑数据（34 → 15/16/11）**：InstructPix2Pix 用 GPT-3 + Prompt-to-Prompt 合成 45 万编辑对破解数据瓶颈的路线，在编辑奖励数据仍然稀缺的今天值得复用——配合 11 的能力缺口反馈闭环，可自动合成"指令类型 × 难度"全覆盖的编辑偏好对，替代 15/16 的高成本人工标注。
13. **量规驱动数据管线的文本→视觉迁移（36/37 → 11/01）**：机会 6 已指出 01 的逐维打分可作 11 式数据引擎的反馈源；36 的 RuFT（量规做拒绝采样过滤器）与 37 的 CRG（对比量规生成）给出了文本侧的成熟实现，把它们接到视觉生成/编辑的数据管线上（量规筛选 + 量规条件化合成）是自然延伸。
14. **奖励族的"信息增益"审计（29 → 19–33 全体）**：CLIPScore 的前向选择分析证明指标间相关但不冗余——用同样的方法审计整个 T2I 奖励生态（19–22 的偏好标量、30 的宽谱分数、31 的多维 checklist、32/33 的生成式评估各覆盖哪些维度、哪些是真正增量），可为"给定任务该选哪个奖励/该怎么组合"给出定量组合建议，也是治"奖励刷分"的系统性体检。
15. **忠实性奖励的泛化（42 TAPO × 43–52 全体）**：CodeV 把过程奖励落到"工具动作的视觉后果"上治装饰性调用；43 的双路径对比奖励、50 的条件式工具奖励、46 的好奇心约束都只回答"要不要用工具"，未回答"用了是否真看了"——把 TAPO 式忠实性奖励（评判裁剪是否含目标物体）与这些奖励结构嫁接，或将其蒸馏为可微的忠实性奖励模型，是工具智能体训练的显性空白。
16. **量规评估（35–41）× 工具轨迹评估（42–52）**：量规生态证明"显式标准 + 冻结 VLM 逐条打分"可低成本替代标量奖励模型；工具智能体的轨迹（何时调用、调用参数、中间视觉证据）天然是可逐条审计的对象——为工具轨迹合成"忠实/冗余/装饰"三级量规并用 40 式统计学习从偏好数据选规则，可把 42 的 GPT-4o 评判成本降低一个量级；32 式生成式"推理+打分"若从给最终图像打分扩展到给中间工具输出打分，即为 TAPO 提供可学习奖励底座。
17. **SFT/RL 理论（48）× 工具课程设计（44/45/46/49/50）**：48 给出"无 SFT 的 RL 因指令遵循差而失败、过度调优 SFT 令 RL 无法恢复"的边界条件，而工具智能体论文恰在"指令遵循 vs 探索"边界上做工程取舍（44/45/46 用 SFT 冷启动，49/50 免 SFT）；用 48 的 GeneralPoints 式可控环境把"工具课程 SFT 数据量/多样性 vs RL 可恢复性"操作化为可测曲线，是训练配方从经验走向科学的直接机会。
18. **自适应工具奖励的三方互补（60 × 61 × 62 × 53）**：CodeDance 的在线组级信号（无需教师但可能错罚成功轨迹）、AdaTooler-V 的教师标签（样本级精准但分布失配）、Metis 的条件化解耦（理论干净但只劝退不扩展）、Beacon 的 NAAR（模式条件化 + 在线标注）各有盲区且互为批评对象——把"教师标注仅用于冷启动、在线组级信号驱动 RL、效率通道条件化解耦、困难样本用提示回收"组合为一条配方并受控比较，是自适应工具使用的显性空白。
19. **真值工具链作为过程奖励源（55 × 42 TAPO）**：VTC-Bench 的 680 题 × 平均 5.04 步人工核验执行轨迹天然是过程监督素材——把真值链的中间视觉输出作为 TAPO 式忠实性奖励的参照锚，或以"链编辑距离"设计过程奖励，可为工具智能体提供首个大规模程序化过程监督源；其 MAE/$Eff_{\text{tool}}$ 指标亦可与 53 的 MA/TE 合并为统一的"必要性 × 有效性"评测矩阵。
20. **美学评分直方图 × 细粒度排序（63/66 × 76/87）**：AVA 保留的完整评分分布（方差 = 争议度）从未被细粒度排序线利用——把"分布预测 + 系列内排序"联合建模（EMD 损失对齐直方图、Bradley-Terry 对齐次序），可让模型同时输出"这组里哪张最好"与"这张争议多大"，为 best-of-N 筛选提供不确定性感知的排序信号；87 的分桶失效实验可直接作为该方向的评测协议。
21. **人格条件 × 美学引导（68 × 81）**：PARA 证明人格特质可条件化美学评分（100-shot SROCC +0.009），Venus 证明美学可转化为可操作指导——把 BFI 画像注入 AG 框架做"人格条件化的构图指导"（外向者重内容主体、高神经质者回避负面情绪题材），是个性化推荐从"打分"到"建议"的显性空白；65 的 Active-PAM 可复用为冷启动阶段的标注预算分配器。
22. **零样本先验 × 专家解释（69 × 71/72/80）**：CLIP-IQA 的反义提示配对零成本可扩展到任意维度，但 71 诊断的解释幻觉无法靠提示工程修复——用 AesMMIT 的 409K 指令数据蒸馏 CLIP 类轻量评估器（保零样本骨架、注入解释能力），或反向用反义配对做 80/83 类解释模型的自一致性校验（同一图正反提示的理据应互斥），两端互为补全。
23. **美学 RL 奖励 × 生成/编辑后训练（83/85 × 15–18、19–27）**：RAPO 已证明美学 RL 可行、CropReward 提供百万对裁剪偏好与自举数据配方——但两者都尚未接入生成端；把细粒度美学奖励接入编辑 RL（15–18 的在线 RL 配方）或 T2I 的 GRPO（19–27 生态），并移植 77 的格式/防重复奖励经验防奖励作弊、80 的"保留低质量样本"对齐 MLLM 正向偏置，是美学线与奖励线合流的自然下一步。
